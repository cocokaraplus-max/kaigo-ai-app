      '<div class="sr-lbl" style="margin-top:8px;">利用者（ひらがな・漢字・カルテ番号で検索）</div>' +
      '<div class="sr-search" style="margin-top:5px;">' +
        '<input type="text" class="q" placeholder="例：やまだ / 山田 / 001" autocomplete="off">' +
        '<div class="sr-cands"></div>' +
      '</div>' +
      '<div class="picked" style="display:none;margin-top:6px;"></div>' +
      '<div class="row"><label style="font-size:0.8rem;display:flex;align-items:center;gap:4px;">' +
        '<input type="checkbox" class="guest"> 登録のない方（名前を直接入力）</label></div>');

    var q = box.querySelector('.q');
    var cands = box.querySelector('.sr-cands');
    var picked = box.querySelector('.picked');
    var guest = box.querySelector('.guest');
    var chosen = null;

    function clearPick() {
      chosen = null;
      picked.style.display = 'none';
      box.querySelector('.sr-search').style.display = '';
      q.value = '';
      q.focus();
    }
    function pick(p) {
      chosen = p;
      cands.classList.remove('show');
      box.querySelector('.sr-search').style.display = 'none';
      picked.style.display = '';
      picked.innerHTML = '<div class="sr-picked">' + esc(p.user_name) + '<span class="chg">変更</span></div>';
      picked.querySelector('.chg').onclick = clearPick;
    }

    q.oninput = q.onkeyup = q.oncompositionend = function () {
      if (guest.checked || !q.value.trim()) { cands.classList.remove('show'); return; }
      var list = searchPatients(q.value);
      if (!list.length) {
        cands.innerHTML = '<div class="sr-cand" style="color:#9aa0a6;">該当なし（登録のない方はチェックを入れてください）</div>';
      } else {
        cands.innerHTML = list.map(function (p, i) {
          return '<div class="sr-cand" data-i="' + i + '">' + esc(p.user_name) +
            (p.user_kana ? '<span style="color:#9aa0a6;font-size:0.78rem;margin-left:6px;">' + esc(p.user_kana) + '</span>' : '') +
            '</div>';
        }).join('');
        cands.querySelectorAll('[data-i]').forEach(function (el) {
          el.addEventListener('mousedown', function (e) { e.preventDefault(); });
          el.addEventListener('click', function () { pick(list[Number(el.dataset.i)]); });
          el.addEventListener('touchstart', function (e) { e.preventDefault(); pick(list[Number(el.dataset.i)]); });
        });
      }
      cands.classList.add('show');
    };
    guest.onchange = function () {
      clearPick();
      cands.classList.remove('show');
      q.placeholder = guest.checked ? '名前を入力（例：見学 太郎）' : '例：やまだ / 山田 / 001';
    };

    // 選ばれた人を返す。未選択なら null。
    return function () {
      if (guest.checked) {
        var nm = (q.value || '').trim();
        if (!nm) { toast('名前を入れてください', 'err'); q.focus(); return null; }
        return { patient_id: uuid(), user_name: nm, guest: true };
      }
      if (!chosen) { toast('利用者を選んでください', 'err'); q.focus(); return null; }
      return { patient_id: chosen.patient_id, user_name: chosen.user_name, guest: false };
    };
  }

  // 臨時便を新しく作る
  function openExtraPanel(btn) {
    if (document.querySelector('.sr-panel')) return;

    var vopts = state.vehicles.map(function (x) {
      return '<option value="' + esc(x.id) + '">' + esc(x.name) + '</option>';
    }).join('');
    var sopts = state.staff.map(function (n) {
      return '<option value="' + esc(n) + '">' + esc(n) + '</option>';
    }).join('');

    var box = document.createElement('div');
    box.className = 'sr-panel';
    box.innerHTML =
      '<div style="font-weight:800;font-size:0.95rem;">臨時便を作る</div>' +
      '<div class="row">' +
        '<select class="reason">' +
          '<option value="早退">早退</option><option value="遅刻">遅刻</option>' +
          '<option value="通院">通院</option><option value="その他">その他</option>' +
        '</select>' +
        '<select class="ty"><option value="dropoff">送り</option><option value="pickup">迎え</option></select>' +
        '<input type="time" class="dep">' +
      '</div>' +
      '<div class="row">' +
        '<select class="veh"><option value="">車両…</option>' + vopts + '</select>' +
        '<select class="drv"><option value="">運転手…</option>' + sopts + '</select>' +
      '</div>';
    btn.parentNode.insertBefore(box, btn);

    var getPerson = personPicker(box);

    box.insertAdjacentHTML('beforeend',
      '<div class="row" style="margin-top:10px;">' +
        '<button class="sr-tap ok" style="min-width:80px;">作成</button>' +
        '<button class="sr-mini no">やめる</button>' +
      '</div>');

    box.querySelector('.no').onclick = function () { box.remove(); };
    box.querySelector('.ok').onclick = async function () {
      var p = getPerson();
      if (!p) return;
      var body = {
        date: state.date,
        reason: box.querySelector('.reason').value,
        depart: box.querySelector('.dep').value || '',
        vehicle_id: box.querySelector('.veh').value || '',
        driver_name: box.querySelector('.drv').value || '',
        stops: [{ patient_id: p.patient_id, user_name: p.user_name,
                  type: box.querySelector('.ty').value }]
      };
      var r = await fetch('/api/soge/run/extra', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      var j = await r.json();
      if (j.status !== 'success') { toast(j.message || '作れませんでした', 'err'); return; }
      box.remove();
      toast('臨時便を作りました（他の便からは自動で外しました）');
      // soge-unassigned-v1: 便の並びが変わるので、覚えていたタブは捨てる。
      //   残すと、同じ車の別の臨時便が選ばれることがある
      state.tabKey = '';
      state.tripTab = 9999; // 臨時便タブに自動移動（render()でlength-1にクランプ）
      await load();
    };
  }

  // すでにある臨時便に、あとから1名足す
  function openAddToExtra(btn, dayId) {
    if (document.querySelector('.sr-panel')) return;
    var trip = btn.closest('.sr-trip');

    var box = document.createElement('div');
    box.className = 'sr-panel';
    box.innerHTML =
      '<div style="font-weight:800;font-size:0.95rem;">臨時便に利用者を追加</div>' +
      '<div class="row"><select class="ty"><option value="dropoff">送り</option><option value="pickup">迎え</option></select></div>';
    trip.appendChild(box);

    var getPerson = personPicker(box);
    box.insertAdjacentHTML('beforeend',
      '<div class="row" style="margin-top:10px;">' +
        '<button class="sr-tap ok" style="min-width:80px;">追加</button>' +
        '<button class="sr-mini no">やめる</button>' +
      '</div>');

    box.querySelector('.no').onclick = function () { box.remove(); };
    box.querySelector('.ok').onclick = async function () {
      var p = getPerson();
      if (!p) return;
      var r = await fetch('/api/soge/run/extra/stop', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          day_id: dayId, patient_id: p.patient_id, user_name: p.user_name,
          type: box.querySelector('.ty').value
        })
      });
      var j = await r.json();
      if (j.status !== 'success') { toast(j.message || '追加できませんでした', 'err'); return; }
      box.remove();
      toast(p.user_name + ' さんを追加しました');
      await load();
    };
  }

  (async function init() {
    state.date = todayStr();
    $('srDate').value = state.date;
    $('srDate').onchange = function () {
      state.date = $('srDate').value || todayStr();
      state.tab = 0; state.tabKey = ''; state.autoTab = true;
      $('srPrint').href = '/soge/print?month=' + state.date.slice(0, 7);   // soge-print-v2
      load();
    };
    $('srPrint').href = '/soge/print?month=' + state.date.slice(0, 7);      // soge-print-v2

    // soge-extra-v1: 臨時便で使う候補
    var s = await fetch('/api/soge/staff').then(function (r) { return r.json(); }).catch(function () { return {}; });
    state.staff = (s && s.staff) ? s.staff : [];
    var v = await fetch('/api/vehicles').then(function (r) { return r.json(); }).catch(function () { return {}; });
    state.vehicles = (v && v.vehicles) ? v.vehicles : [];
    var p = await fetch('/api/soge/patients').then(function (r) { return r.json(); }).catch(function () { return {}; });
    state.patients = (p && p.patients) ? p.patients : [];

    load();
  })();
})();
</script>
{% endblock %}
