      });
    });
    groups.sort(function (a, b) {
      return (a.order - b.order) || (a.depart < b.depart ? -1 : (a.depart > b.depart ? 1 : 0));
    });

    /* soge-run-pick-v1: 「車を選ぶ」。
       soge-trip-pick-v1: ★その【上】に便の札を置く。便 → 車 の順。 */
    var pick = tripPickHtml()
      + '<div class="sr-pick" id="srLsPick">'
      + '<button type="button" class="sr-pick-b" data-lspick="1">'
        + '<span>' + esc(listPickLabel()) + '</span>'
        + '<span class="ar">▼ 変える</span>'
      + '</button></div>';

    /* soge-trip-pick-v1: 便で絞って隠れた「車が決まっていない人」の知らせ。 */
    var hideNote = hiddenUn
      ? '<div class="sr-lhide">ほかの便に、<b>車が決まっていない方が ' + hiddenUn
        + ' 人</b>います。<br>上の「すべて」を押すと出ます。</div>'
      : '';

    if (!groups.length) {
      /* ★まだ車を選んでいないときと、その日に送迎が無いときは別のこと。
         同じ文にすると、選べば出るのか、そもそも無いのかが分からない。 */
      return pick + hideNote + (state.lsCar
        ? '<div class="sr-empty">'
          + (state.lsTrip === 'all' ? 'この車には、この日の送迎がありません。'
                                    : 'この車には、この便の送迎がありません。')
          + '</div>'
        : '<div class="sr-pick-hint">上の<b>「車を選ぶ」</b>を押すと、'
          + '<br>その車の送迎一覧が出ます。<br>'
          + '「すべての車」を選ぶと、その日の全部が出ます。</div>');
    }

    var out = groups.map(function (g) {
      var nAll = 0, nDone = 0;
      g.cars.forEach(function (c) {
        (c.t.stops || []).forEach(function (s) {
          if (s.is_absent || s.is_leave) return;
          nAll++;
          if (s.arrived_at) nDone++;
        });
      });
      var head = '<div class="sr-lg-h"><span>' + esc(g.label) + '</span>'
        + (g.depart ? '<span class="tm">' + esc(g.depart) + ' 出発</span>' : '')
        + '<span class="n">' + nAll + '名'
          + (nDone ? ('／到着 ' + nDone + '名') : '') + '</span></div>';

      var cars = g.cars.map(function (c) {
        var v = c.v, t = c.t;
        var un = !!(t.unassigned || v.unassigned);
        var stops = (t.stops || []);
        var live = stops.filter(function (s) { return !s.is_absent && !s.is_leave; });
        var leftN = live.filter(function (s) { return !s.arrived_at; }).length;
        var doneN = live.length - leftN;
        /* 「いま向かう人」＝まだ着いていない人のうち、いちばん上。
           ★出発していない便では出さない。走り出す前に「いま向かう」は嘘になる。 */
        var nowId = '';
        if (!un && t.departed_at) {
          for (var i = 0; i < stops.length; i++) {
            var s = stops[i];
            if (s.is_absent || s.is_leave || s.arrived_at) continue;
            nowId = s.id; break;
          }
        }
        var drv = t.driver_name || v.driver_name || '';
        var h = '<div class="sr-lc-h">'
          + (un ? '' : (v.icon_svg || ''))
          + '<span class="cn">' + esc(un ? '⚠ 車が決まっていません' : (v.vehicle_name || '')) + '</span>'
          + (un ? '' : '<span class="dv">' + esc(drv ? drv : '運転手 未設定') + '</span>')
          + (t.is_extra
              ? '<span class="sr-lc-x">'
                  + '<button class="sr-mini" data-exadd="' + escA(t.day_id) + '">＋ 利用者</button>'
                  + '<button class="sr-mini del" data-exdel="' + escA(t.day_id) + '">取消</button>'
                + '</span>'
              : (un
                  ? '<span class="cnt">' + stops.length + '名</span>'
                  /* ★一覧から運転席へ1タップで戻れるようにする。
                     戻れないと、確かめるたびに上のボタンを押し直すことになる。 */
                  : '<button type="button" class="sr-lc-go" data-golist="' + escA(v.key) + '"'
                    + ' data-golistt="' + escA(t.day_id) + '">運転中で開く</button>'))
          + '</div>';
        if (!t.is_extra && !un) {
          h = h.replace('<button type="button" class="sr-lc-go"',
                        '<span class="cnt">' + (t.departed_at
                          ? ('残り' + leftN + '／到着' + doneN)
                          : (live.length + '名')) + '</span>'
                        + '<button type="button" class="sr-lc-go"');
        }
        var body = un
          ? '<div class="sr-lc-w">このままだと、この方は誰にも運ばれません。'
            + '⇄ を押して車に乗せてください。</div>'
          : '';
        body += stops.length
          ? stops.map(function (s, i) { return listRow(s, i, s.id === nowId, un); }).join('')
          : '<div class="sr-lc-w">立ち寄りはありません。</div>';
        return '<div class="sr-lc' + (un ? ' un' : '') + (t.is_extra ? ' ex' : '') + '">'
          + h + body + '</div>';
      }).join('');

      return '<div class="sr-lg">' + head + cars + '</div>';
    }).join('');

    /* soge-run-pick-v1: まだ車を選んでいないときも、
       「車が決まっていません」だけは出る（上の絞り込みで残してある）。
       ★そのときは、選び方の案内も一緒に出す。出さないと、
         警告だけが出ていて他に何も無い画面になり、壊れたように見える。 */
    return pick + hideNote + out + (state.lsCar ? ''
      : '<div class="sr-pick-hint">上の<b>「車を選ぶ」</b>を押すと、'
        + '<br>その車の送迎一覧が出ます。<br>'
        + '「すべての車」を選ぶと、その日の全部が出ます。</div>');
  }

  /* ===== soge-drive-v1: 運転中の本文 =====
     ★到着・休み・時刻直し・車の移動は、すでにある bind() が
       data-tap / data-abs / data-pen / data-mv を拾って動かしている。
       ここでも【同じ属性】を使う。配線は1行も書かない。
       別に書くと、片方だけ直したときに食い違う。 */
  function driveHtml(t, roadHex, edgeHex, softHex) {
    if (t.unassigned) {
      return '<div class="sr-dv"><div class="sr-dv-name">車が決まっていません</div>'
        + '<div class="sr-dv-note">この便に乗る車が決まっていないため、'
        + '運転中の画面には出せません。上の「一覧」に切り替えて、'
        + '⇄ で車に移してください。</div></div>';
    }
    /* soge-drive-v2: 道の線の色。車の色が引けないときは、これまでの青のまま。 */
    var road = roadHex || '#1a73e8';
    /* soge-car-color-v4: 明るい車の色は、うっすらの縁では道が見えない。
       サーバが「はっきりした黒が要る色か」を決めて渡してくる。 */
    var edge = edgeHex || '';
    /* soge-drive-v4: うっすら敷く地。サーバが決めた色。
       ★引けないときは何も入れない。CSS 側の既定（白）に戻るだけ。 */
    var soft = softHex || '';

    var all = (t.stops || []);
    /* お休みの人は「次の人」から外す。★ただし黙って消さない（下に名前を出す）。
       居ないことと、見落としたことは、別のこと。 */
    var off = all.filter(function (s) { return s.is_absent || s.is_leave; });
    var live = all.filter(function (s) { return !s.is_absent && !s.is_leave; });
    var leftAll = live.filter(function (s) { return !s.arrived_at; });
    var doneN = live.length - leftAll.length;
    /* 一度に出すのは4人まで。全部並べると、下の「事業所に戻る」まで遠くなる。
       ★残りの人数は必ず文字で出す（黙って隠さない）。 */
    var left = leftAll.slice(0, 4);
    var hidden = leftAll.length - left.length;

    /* soge-undo-v1: お休みの人に「戻す」を付ける。
       ★「休み連絡」(is_leave) には付けない。運転手が付けたものではないので、
         ここで消せてしまうと、連絡した側の記録を運転席から書き換えることになる。 */
    var offHtml = off.length
      ? '<div class="sr-dv-off">お休み：' + off.map(function (s) {
          return '<span class="sr-off-i">' + esc(s.user_name)
            + (s.is_absent && !s.is_leave
                ? '<button type="button" class="sr-off-u" data-uds="' + escA(s.id) + '"'
                  + ' data-udk="absent" data-udn="' + escA(s.user_name) + '" data-udt="">戻す</button>'
                : '<span class="sr-off-n">休み連絡</span>')
            + '</span>';
        }).join('') + '</div>'
      : '';

    /* soge-undo-v1: 済んだ人。ふだんは閉じておき、開くと時刻と「戻す」が並ぶ。 */
    var doneList = live.filter(function (s) { return s.arrived_at; });
    var doneHtml = doneList.length
      ? '<div class="sr-done' + (state.doneOpen ? ' open' : '') + '">'
          + '<button type="button" class="sr-done-h" data-doneopen="1">'
            + '済んだ人 ' + doneList.length + ' 人'
            + '<span class="sr-done-i">' + (state.doneOpen ? '▲ 閉じる' : '▼ 開く') + '</span>'
          + '</button>'
          + (state.doneOpen
              ? '<div class="sr-done-b">' + doneList.map(function (s) {
                  /* soge-tap-retry-v1: まだ送れていない打刻には印を出す。
                     ★出さないと「送れた」と思ってしまう。 */
                  var _pend = srqPendingStops()[s.id];
                  return '<div class="sr-done-r">'
                    + '<span class="n">' + esc(s.user_name) + '</span>'
                    + (_pend ? '<span class="sr-pend">未送信</span>' : '')
                    + '<span class="t">' + esc(s.arrived_at) + '</span>'
                    + '<button type="button" data-uds="' + escA(s.id) + '" data-udk="arrive"'
                      + ' data-udn="' + escA(s.user_name) + '"'
                      + ' data-udt="' + escA(s.arrived_at) + '">戻す</button>'
                    + '</div>';
                }).join('') + '</div>'
              : '')
        + '</div>'
      : '';

    /* soge-undo-v1: 押した直後の帯。★その便を見ているときだけ出す。
       別の車のタブに切り替えたら出さない（関係ない人の記録を戻さないため）。 */
    var _u = state.undo;
    var undoHtml = (_u && _u.day === t.day_id)
      ? '<div class="sr-undo">'
          + '<span class="sr-undo-t">' + esc(_u.text) + '</span>'
          + '<button type="button" class="sr-undo-go" data-udbar="go">戻す</button>'
          + '<button type="button" class="sr-undo-x" data-udbar="x" title="閉じる">✕</button>'
        + '</div>'
      : '';

    /* --- 見出し（この便と、残り／到着の人数） --- */
    var head = '<div class="sr-nv-head">'
      + '<span class="sr-type ' + ((t.stops || [])[0] || {}).type + '">'
        + (((t.stops || [])[0] || {}).type === 'dropoff' ? '送' : '迎') + '</span>'
      + '<span>' + esc(tripLabel(t)) + '</span>'
      + '<span class="cnt">残り ' + leftAll.length + ' 人／到着 ' + doneN + ' 人</span>'
      + '</div>';

    /* --- 出発（いちばん上の地点） ---
       ★記録表の「出発時刻」はこれが入る。押し忘れると紙が埋まらないので、
         まだなら押すところを大きく出す。押したあとは灰色の帯で残す
         （消すと「押したか分からない」になる）。 */
    var depNode = t.departed_at
      /* soge-undo-v1: 押し間違えた出発を消せるようにする。★確認を出してから消す。 */
      ? '<div class="sr-nd past"><div class="sr-pl dep done">'
          + '<span class="nm">事業所を出発</span>'
          + '<span class="tm">' + esc(t.departed_at) + '</span>'
          + '<button type="button" class="sr-pl-u" data-udd="' + escA(t.day_id) + '"'
            + ' data-udk="depart" data-udt="' + escA(t.departed_at) + '">戻す</button>'
          + '</div></div>'
      /* soge-drive-v3: 板そのものを押す。★data-dep は変えない
         （押したときの動きは、すでにある bind() がそのまま拾う）。 */
      : '<div class="sr-nd now">'
          + '<button type="button" class="sr-pl dep go" data-dep="' + t.day_id + '">'
            + '<span class="nm">事業所を出発</span>'
            + (t.depart ? '<span class="tm">予定 ' + esc(t.depart) + '</span>' : '')
            + '<span class="go-i">▶</span>'
          + '</button></div>';

    /* soge-done-road-v1: 送り終わった人を、道の上に灰色で残す。
       ★これまでは到着を押した瞬間に道から消えていた。運転席から
         「誰まで終わったか」が見えず、順番の入れ替えもしにくかった。
       ★時刻には必ず【済】と書く。すぐ下に「予定 08:49」が並ぶので、
         数字だけだと、どちらの時刻か読み分けられない。
         灰色の板の数字を打刻済みと読み違えた実例がある（soge-plan-label-v1）。
       ★出すのは直近3人まで。全員出すと「事業所に戻る」まで遠くなる。
         ただし黙って隠さない。すぐ上の〈済んだ人 N 人〉に全員ぶんが出る。 */
    var doneNodes = doneList.slice(-3).map(function (s) {
      var _pend = srqPendingStops()[s.id];
      return '<div class="sr-nd past"><div class="sr-pl fin">'
        + '<span class="nm">' + esc(s.user_name) + '</span>'
        + (_pend ? '<span class="sr-pend">未送信</span>' : '')
        + '<span class="tm">済 ' + esc(s.arrived_at) + '</span>'
        + '<button type="button" class="sr-pl-u" data-uds="' + escA(s.id) + '"'
          + ' data-udk="arrive" data-udn="' + escA(s.user_name) + '"'
          + ' data-udt="' + escA(s.arrived_at) + '">戻す</button>'
        + '</div></div>';
    }).join('');

    /* --- 立ち寄り先を、上から順に並べる --- */
    var stopsHtml = left.map(function (s, i) {
      var tag = (s.is_wheelchair ? '<span class="tag">車いす</span>' : '');
      /* soge-plan-label-v1: ★「予定」と必ず書く。
         書かないと、記録した時刻に見える。実際にそう読まれた。
         そのあとの人の板は灰色で、このアプリの灰色は「済んだ」の色なので、
         数字だけだと【打刻済み】としか読めない。
         いま向かう人の板と同じ書き方にそろえる。 */
      var tm  = (s.planned_at ? '<span class="tm">予定 ' + esc(s.planned_at) + '</span>' : '');
      if (i > 0) {
        /* 先の人。板だけ。★名前は割らない。住所は詰める（下見なので全部は要らない）。 */
        /* soge-drive-v5: 先の人は灰色。緑は「いま向かう人」だけにする。 */
        return '<div class="sr-nd later">'
          + '<div class="sr-pl later"><span class="nm">' + esc(s.user_name) + '</span>'
            + tag + tm
            /* soge-back-v1: この人をもう1段後ろへ。
               ★後ろに誰も居ない人には出さない（押しても何も起きないボタンは出さない）。 */
            + (nextLiveAfter(t, s.id)
                ? '<button type="button" class="sr-pl-bk" data-back="' + escA(s.id) + '">↓ 後に</button>'
                : '')
            + '</div>'
          + (s.address ? '<div class="sr-nvs">' + esc(s.address) + '</div>' : '')
          + '</div>';
      }
      /* いま向かう人。ここだけ大きく、住所は切らずに号室まで出す。 */
      /* soge-back-v1: この人の次に回れる人（居なければ null）。 */
      var _bkNext = nextLiveAfter(t, s.id);
      return '<div class="sr-nd now">'
        + '<div class="sr-pl big"><span class="nm">' + esc(s.user_name) + '</span>'
          + tag + (s.planned_at ? '<span class="tm">予定 ' + esc(s.planned_at) + '</span>' : '')
        + '</div>'
        + '<div class="sr-nvb">'
          + (s.address ? '<div class="sr-nva">' + esc(s.address) + '</div>'
                       : '<div class="sr-nva none">住所が登録されていません</div>')
          + mvHtml(s)
          + '<button class="sr-dv-tap" data-tap="' + s.id + '">到着</button>'
          /* soge-back-v1: 1つ後ろへ回す。★誰が先になるかを添える。
             後ろに回せる人が居ないときは出さない（押せないボタンを
             出しておくより、無いほうが迷わない）。 */
          + (_bkNext
              ? '<button class="sr-dv-back" data-back="' + s.id + '">↓ 後にする'
                + '<span class="w">' + esc(_bkNext.user_name) + 'さんが先になります</span>'
                + '</button>'
              : '')
          + '<div class="sr-dv-sub">'
            + '<button data-abs="' + s.id + '">お休みだった</button>'
            + '<button data-pen="' + s.id + '" data-init="' + esc(s.planned_at || '') + '">時刻を手で</button>'
            + '<button data-mv="' + s.id + '">別の車へ</button>'
          + '</div>'
        + '</div></div>';
    }).join('');

    if (hidden > 0) {
      stopsHtml += '<div class="sr-nd later"><div class="sr-pl later">'
        + '<span class="nm">ほか ' + hidden + ' 人</span></div></div>';
    }

    /* --- 事業所へ戻る（終点） ---
       ★勝手に次の便へ動かさない。別の人に打刻が付く事故のもとになる。
         全員おわるまでは押せるものを出さず、何をすればよいかを文字で出す。 */
    var goal;
    if (t.returned_at) {
      goal = '<div class="sr-nd goal past"><div class="sr-pl dep done">'
        + '<span class="nm">事業所に帰着</span>'
        + '<span class="tm">' + esc(t.returned_at) + '</span>'
        /* soge-undo-v1: 押し間違えた帰着を消せるようにする。 */
        + '<button type="button" class="sr-pl-u" data-udd="' + escA(t.day_id) + '"'
          + ' data-udk="return" data-udt="' + escA(t.returned_at) + '">戻す</button>'
        + '</div></div>';
    } else if (leftAll.length) {
      goal = '<div class="sr-nd goal"><div class="sr-pl dep wait">'
        + '<span class="nm">事業所に戻る</span></div></div>';
    } else {
      /* soge-drive-v3: ここも板そのものを押す。文字は「事業所に戻った」に
         そろえる（押したら記録が付く、と読めるように）。
         ★説明は板の【下】に置く。上に置くと、押すところが下がって遠くなる。 */
      goal = '<div class="sr-nd goal now">'
        + '<button type="button" class="sr-pl dep go hasnote" data-ret="' + t.day_id + '">'
          + '<span class="nm">事業所に戻った</span><span class="go-i">▶</span>'
        + '</button>'
        + '<div class="sr-nvb"><div class="sr-dv-note">'
          + (live.length ? ('この便は全員おわりました（到着 ' + doneN + ' 人）。')
                         : 'この便に立ち寄りはありません。')
          + '<br>次の便に行くときは、上の便のタブを押してください。</div>'
        + '</div></div>';
    }

    /* soge-undo-v1: 帯と「済んだ人」は帯の上（見出しのすぐ下）に置く。
       ★道の帯の中には入れない。中に入れると立ち寄り先と同じ並びに見えて、
         行き先だと読み違える。 */
    return '<div class="sr-dv">' + head + undoHtml + doneHtml
      /* soge-car-color-v4: 道と地点の縁の色も一緒に渡す。
         ★白い車だと、うっすらの縁では道そのものが見えない。 */
      + '<div class="sr-nv" style="--sr-road:' + road
        + (edge ? ';--sr-edge:' + edge : '')
        + (soft ? ';--sr-soft:' + soft : '')      /* soge-drive-v4: うっすら敷く地 */
        + '">'
        /* soge-done-road-v1: 出発 → 送り終わった人 → いま向かう人 → 先の人、
           の順に並べる。上から下へ、時間どおりに読める形にする。 */
        + depNode + doneNodes + stopsHtml + goal
      + '</div>' + offHtml + '</div>';
  }

  /* soge-run-list-v1: 「車両から／便から」の本文(tripHtml)は消しました。
     どこからも呼ばれなくなったため。★残すと、誰も開かない画面のコードだけが
     古びていき、次に読む人が「どちらが本物か」で迷う。
     欲しくなったら git から戻せます。 */

  /* soge-move-v1: 移した跡を、その人の行に出す。
     ★あとで記録表を見た人が「なぜこの車なのか」を追えるようにする。 */
  function mvHtml(s) {
    if (!s.moved_from) return '';
    return '<span class="sr-moved">' + esc(s.moved_from) + ' から移動'
      + (s.moved_at ? '（' + esc(s.moved_at) + (s.moved_by ? ' ' + esc(s.moved_by) : '') + '）' : '')
      + '</span>';
  }

  /* その日の「移せる先」を集める。
     ★「車が未定」は走らない枠なので、移す先には出さない。
     ★いま居る便も出さない（そこへ移す意味が無い）。 */
  function moveTargets(curDayId) {
    var out = [];
    ((state.data && state.data.vehicles) || []).forEach(function (v) {
      if (v.unassigned) return;
      (v.trips || []).forEach(function (t) {
        if (t.unassigned) return;
        if (String(t.day_id) === String(curDayId)) return;
        var live = (t.stops || []).filter(function (x) { return !x.is_absent && !x.is_leave; });
        out.push({
          day_id: t.day_id,
          name: v.vehicle_name || '',
          trip: tripLabel(t),
          extra: !!t.is_extra,
          driver: t.driver_name || '',
          depart: t.depart || '',
          n: live.length
        });
      });
    });
    return out;
  }

  /* ===== soge-driver-change-v1: 運転手を替えるパネル =====
     ★選ぶだけにする。手で打てるようにしない。打つと表記ゆれ（田中／田中 太郎）
       が記録表に残り、あとで名寄せできない。
     ★いま入っている名前が職員名簿に無いときは、それも選べるように足す。
       退職した人の名前が入っている便を開いたとき、勝手に消えないように。 */
  function openDriverPanel(btn) {
    if (document.querySelector('.sr-panel')) return;
    var dayId = btn.dataset.drv;
    var cur = btn.dataset.drvnow || '';

    var list = (state.staff || []).slice();
    if (cur && list.indexOf(cur) < 0) list.unshift(cur);   // ★いまの名前は必ず残す
    var opts = list.map(function (n) {
      return '<option value="' + escA(n) + '"' + (n === cur ? ' selected' : '') + '>'
        + esc(n) + '</option>';
    }).join('');

    var box = document.createElement('div');
    box.className = 'sr-panel';
    box.innerHTML =
      '<div style="font-weight:800;font-size:0.95rem;">運転手を替える</div>'
      + '<div class="sr-drvp-n">替わるのは<b>いま開いている便だけ</b>です。'
      + 'ほかの便と、来週からの配車は変わりません。<br>'
      + '空にしたいときは「記録表」から。</div>'
      + '<div class="row">'
        /* ★ここに「未設定」は置かない。置くと嘘になる。
             この画面は、便に運転手が入っていないと【車の側の名前】に落とす
             （soge-driver-per-trip-v1 のつくり）。だから空にしても、同じ車の
             別の便の人の名前が出てしまう。「未設定にしたのに名前が出る」と
             見えるくらいなら、はじめから選ばせない。
           ★空にしたいときは記録表からできる（あちらは落とさずそのまま出す）。 */
        + '<select class="drv2">'
        + (cur ? '' : '<option value="" disabled selected>選んでください</option>')
        + opts + '</select>'
      + '</div>'
      + '<div class="row" style="margin-top:10px;">'
        + '<button class="sr-tap ok" style="min-width:80px;">替える</button>'
        + '<button class="sr-mini no">やめる</button>'
      + '</div>';
    btn.parentNode.appendChild(box);

    box.querySelector('.no').onclick = function () { box.remove(); };
    box.querySelector('.ok').onclick = async function () {
      var nm = box.querySelector('.drv2').value || '';
      if (!nm) { toast('運転手を選んでください', 'err'); return; }
      if (nm === cur) { box.remove(); return; }            // 何も変えていない
      var key = 'drv' + dayId;
      if (state.busy[key]) return;
      state.busy[key] = true;
      this.disabled = true;
      try {
        /* soge-tap-retry-v1: ここも catch が無かった（私の落ち度）。
           ★運転手は貯めない。走る前に事務所で押すもので、あとから
             勝手に書き換わるほうが困る。失敗したら、そう出す。 */
        var res = await srSend('/api/soge/run/day', 'PUT',
                               { day_id: dayId, driver_name: nm });
        if (!res.ok) {
          srAlert('err', '運転手を替えられませんでした（' + res.why + '）');
          this.disabled = false;
          return;
        }
        /* 全部読み直すと画面が先頭に飛ぶので、その便だけ直す。 */
        var t = findTrip(dayId);
        if (t) t.driver_name = nm;
        box.remove();
        toast('運転手を ' + nm + ' さんに替えました');
        keepScroll(render);
      } finally { state.busy[key] = false; }
    };
  }

  function openMovePanel(btn, stopId) {
    if (document.querySelector('.sr-panel')) return;
    var st = findStop(stopId);
    if (!st) { toast('対象が見つかりません', 'err'); return; }
    var who = st.user_name || 'この方';
    var list = moveTargets(st.day_id);

    var box = document.createElement('div');
    box.className = 'sr-panel';
    var d = state.data || {};
    /* ★確定済み・過ぎた日は【記録の書き換え】になる。先に、押す前に伝える。 */
    var warn = (d.locked || d.past)
      ? '<div class="sr-mvwarn">この日は' + (d.past ? '<b>過ぎた日</b>' : '<b>確定済み</b>')
        + 'です。実際に走った<b>記録を書き換える</b>ことになります。'
        + '<br>移した場合、<b>いつ・誰が・どこから移したか</b>が記録に残ります。</div>'
      : '';
    box.innerHTML =
      '<div style="font-weight:800;font-size:0.95rem;">' + esc(who) + ' さんを別の車へ移す</div>'
      + '<div style="font-size:0.78rem;color:#5f6368;margin-top:4px;">'
      + '移す先を選んでください。移した人は、その便の<b>いちばん最後</b>に入ります。</div>'
      + warn
      + (list.length
          ? '<div class="sr-mvlist">' + list.map(function (x, i) {
              return '<button data-i="' + i + '">'
                + '<span class="n">' + esc(x.name) + (x.extra ? '（臨時）' : '') + '</span>'
                + '<span class="m">' + esc(x.trip)
                + (x.depart ? ' ' + esc(x.depart) + '出発' : '')
                + (x.driver ? ' ／ ' + esc(x.driver) : '')
                + ' ／ 今 ' + x.n + '人</span>'
                + '</button>';
            }).join('') + '</div>'
          : '<div class="sr-mvwarn">この日には、移せる車がほかにありません。</div>')
      + '<div class="row" style="margin-top:10px;"><button class="sr-mini no">やめる</button></div>';

    /* soge-run-pick-v1: ★置き先が見つからないと appendChild で落ちて、
       押しても【何も起きない】。一覧から ⇄ を押したときに実際に起きた（私の落ち度）。
       一覧の枠(.sr-lc)も置き先に加え、それでも無ければボタンの親に置く。
       落ちるより、どこかに出るほうがよい。 */
    var host = btn.closest('.sr-trip') || btn.closest('.sr-stop')
            || btn.closest('.sr-lc') || btn.parentNode;
    host.appendChild(box);
    box.scrollIntoView({ block: 'nearest', behavior: 'smooth' });

    box.querySelector('.no').onclick = function () { box.remove(); };
    box.querySelectorAll('[data-i]').forEach(function (el) {
      el.onclick = async function () {
        var x = list[Number(el.dataset.i)];
        if (!confirm(who + ' さんを\n' + x.name + '（' + x.trip + '）へ移します。\n'
                     + ((d.locked || d.past) ? '★この日の記録を書き換えます。\n' : '')
                     + 'よろしいですか。')) return;
        el.disabled = true;
        try {
          var r = await fetch('/api/soge/run/move', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ stop_id: stopId, to_day_id: x.day_id, confirm: true })
          });
          var j = await r.json();
          if (j.status !== 'success') { toast(j.message || '移せませんでした', 'err'); el.disabled = false; return; }
          box.remove();
          /* ★予定時刻を消したことを黙っていない。次にすることも一緒に言う。 */
          toast(who + ' さんを ' + x.name + ' へ移しました'
                + (j.replan ? '（到着予定は消えました。「予定時刻を計算し直す」で入れ直せます）' : ''));
          if (j.warn) setTimeout(function () { toast(j.warn, 'err'); }, 2600);
          await load();
        } catch (e) {
          toast('移せませんでした', 'err');
          el.disabled = false;
        }
      };
    });
  }

  function bind() {
    var root = $('srBody');
    /* soge-past-admin-v1: 先に止める。あとから onclick を付け直されないよう、
       ここで止めてから、下の配線を通す（下の配線は disabled を見ない）。 */
    lockEdits(root);

    // 到着の打刻。押した瞬間にボタンを止めるので、2度押ししても2回飛ばない。
    // サーバ側でも「すでに時刻が入っていたら上書きしない」を守っている。
    root.querySelectorAll('[data-tap]').forEach(function (el) {
      el.onclick = async function () {
        var id = el.dataset.tap;
        if (state.busy[id]) return;
        state.busy[id] = true;
        el.disabled = true; el.textContent = '…';
        try {
          /* soge-tap-retry-v1: ★押した時刻をここで控える。
             届かなかったときは、この時刻で送り直す。送り直した時刻ではない。 */
          var hm = srNowHM();
          var res = await srSend('/api/soge/run/arrive', 'POST', { stop_id: id });
          if (!res.ok) {
            /* ★黙って終わらせない。ここが今回いちばん大事なところ。
               ・赤い帯を出しっぱなしにする（トーストは2.4秒で消えて見落とす）
               ・端末に貯めて、電波が戻ったら押した時刻で送る
               ・画面は先に進める（運転席で並びが止まるほうが困る）。
                 ただし「まだ送れていない」印を出し、帯にも件数を出し続ける。 */
            var sf = findStop(id);
            srqAdd({ k: 'arrive', id: id, date: state.date, hhmm: hm,
                     nm: (sf && sf.user_name) || '' });
            if (sf) { sf.arrived_at = hm; sf.is_absent = false; }
            srAlert('err', ((sf && sf.user_name) || 'この方') + ' ' + hm
                    + ' を記録できませんでした（' + res.why + '）。電波が戻ると自動で送ります。');
            el.disabled = false; el.textContent = '到着';
            keepScroll(render);
            return;
          }
          var j = res.data;
          /* 届いたので、貯めてあった同じ打刻は捨てる（二重に送らない） */
          srqDrop('arrive', id);
          srAlert('');
          // 全部読み直すと画面が先頭に飛ぶので、その行だけ直す
          var s = findStop(id);
          if (j.already) {
            toast('すでに ' + j.arrived_at + ' で記録済みです');
          } else {
            toast(j.arrived_at + ' で記録しました');
            /* soge-undo-v1: 押し間違いはここで気づくことが多い。すぐ戻せるように帯を出す。
               ★2度押し(already)のときは出さない。何も新しく起きていない。 */
            setUndo('arrive', id, false, dayIdOfStop(id),
                    ((s && s.user_name) || '') + ' ' + j.arrived_at + ' を記録');
          }
          if (s) { s.arrived_at = j.arrived_at; s.is_absent = false; }
          keepScroll(render);
        } finally {
          state.busy[id] = false;
        }
      };
    });

    // 時刻を手で入れる／直す。押した要素をその場で時刻入力に差し替える。
    function openTimeEditor(el, id, initial) {
      var inp = document.createElement('input');
      inp.type = 'time';
      inp.className = 'sr-timeedit';
      inp.value = initial || '';
      el.replaceWith(inp);
      inp.focus();
      var done = false, tmr = null;
      async function commit() {
        if (done) return;
        var t = inp.value;
        /* soge-time-edit-v1: ★何も変えていないなら送らない。触っただけで保存しない。 */
        if (t === (initial || '')) { done = true; clearTimeout(tmr); keepScroll(render); return; }
        if (!t) { done = true; clearTimeout(tmr); keepScroll(render); return; }
        done = true;
        clearTimeout(tmr);
        var res = await srSend('/api/soge/run/stop', 'PUT', { stop_id: id, time: t });
        if (!res.ok) {
          /* soge-tap-retry-v1: 手で入れた時刻も貯める。入れた時刻のまま送る。 */
          var sf2 = findStop(id);
          srqAdd({ k: 'arrive', id: id, date: state.date, hhmm: t,
                   nm: (sf2 && sf2.user_name) || '' });
          if (sf2) { sf2.arrived_at = t; sf2.is_absent = false; }
          srAlert('err', ((sf2 && sf2.user_name) || 'この方') + ' ' + t
                  + ' を記録できませんでした（' + res.why + '）。電波が戻ると自動で送ります。');
        } else {
          srqDrop('arrive', id);
          srAlert('');
          toast(t + ' で記録しました');
          var s = findStop(id);
          /* soge-undo-v1: 手で入れた時刻も戻せるようにする。 */
          setUndo('time', id, false, dayIdOfStop(id),
                  ((s && s.user_name) || '') + ' ' + t + ' を記録');
          if (s) { s.arrived_at = t; s.is_absent = false; }
        }
        keepScroll(render);
      }
      /* soge-time-edit-v1: ★change ですぐ確定しない。
         input[type=time] は「時」を選んだ時点でも change を投げる。
         そこで確定すると「分」を選ぶ前に入力欄が消える（記録表で実際に起きた）。 */
      inp.onchange = function () { clearTimeout(tmr); tmr = setTimeout(commit, 900); };
      inp.onblur = commit;
    }

    // 記録した時刻をタップすると直せる
    root.querySelectorAll('[data-edit]').forEach(function (el) {
      el.onclick = function () { openTimeEditor(el, el.dataset.edit, el.textContent.trim()); };
    });

    // まだ打刻していない人に、時刻を手で入れる（初期値は到着予定）
    root.querySelectorAll('[data-pen]').forEach(function (el) {
      el.onclick = function () {
        var id = el.dataset.pen;
        var init = el.dataset.init || '';
        var tap = el.parentNode.querySelector('[data-tap="' + id + '"]');
        if (tap) tap.remove();
        openTimeEditor(el, id, init);
      };
    });

    // 休み（その日の送迎から外すだけ。実績や請求には触らない）
    root.querySelectorAll('[data-mv]').forEach(function (el) {   // soge-move-v1
      el.onclick = function () { openMovePanel(el, el.dataset.mv); };
    });

    root.querySelectorAll('[data-abs]').forEach(function (el) {
      el.onclick = async function () {
        var id = el.dataset.abs;
        if (state.busy[id]) return;
        var on = el.classList.contains('on');
        if (!on && !confirm('この方を休みにしますか？（その日の送迎から外します）')) return;
        state.busy[id] = true;
        try {
          var res = await srSend('/api/soge/run/stop', 'PUT', { stop_id: id, absent: !on });
          if (!res.ok) {
            /* soge-tap-retry-v1: 休みも貯める。★画面は先に進める。 */
            var sa = findStop(id);
            srqAdd({ k: 'absent', id: id, date: state.date, on: !on,
                     nm: (sa && sa.user_name) || '' });
            if (sa) { sa.is_absent = !on; if (!on) sa.arrived_at = ''; }
            srAlert('err', ((sa && sa.user_name) || 'この方')
                    + ' の休みを記録できませんでした（' + res.why + '）。電波が戻ると自動で送ります。');
            keepScroll(render);
            return;
          }
          srqDrop('absent', id);
          srAlert('');
          toast(on ? '休みを取り消しました' : '休みにしました');
          var s = findStop(id);
          /* soge-undo-v1: 休みにしたときだけ帯を出す（取り消しは戻す対象ではない）。 */
          if (!on) {
            setUndo('absent', id, false, dayIdOfStop(id),
                    ((s && s.user_name) || '') + ' を休みに');
          } else if (state.undo && state.undo.id === id) {
            state.undo = null;
          }
          if (s) { s.is_absent = !on; if (!on) s.arrived_at = ''; }
          keepScroll(render);
        } finally {
          state.busy[id] = false;
        }
      };
    });

    // 出発（soge-note-v1）
    root.querySelectorAll('[data-dep]').forEach(function (el) {
      el.onclick = async function () {
        var id = el.dataset.dep;
        if (state.busy['d' + id]) return;
        state.busy['d' + id] = true;
        el.disabled = true;
        try {
          var hmd = srNowHM();
          var res = await srSend('/api/soge/run/depart', 'POST', { day_id: id });
          if (!res.ok) {
            /* soge-tap-retry-v1: 出発も貯める。押した時刻で送り直す。 */
            srqAdd({ k: 'depart', id: id, date: state.date, hhmm: hmd });
            var td = findTrip(id);
            if (td) td.departed_at = hmd;
            srAlert('err', '出発 ' + hmd + ' を記録できませんでした（' + res.why
                    + '）。電波が戻ると自動で送ります。');
            el.disabled = false;
            keepScroll(render);
            return;
          }
          var j = res.data;
          srqDrop('depart', id);
          srAlert('');
          toast('出発 ' + j.departed_at);
          /* soge-undo-v1: 2度押し(already)のときは出さない。何も新しく起きていない。 */
          if (!j.already) setUndo('depart', id, true, id, '出発 ' + j.departed_at + ' を記録');
          var t = findTrip(id);
          if (t) t.departed_at = j.departed_at;
          keepScroll(render);
        } finally {
          state.busy['d' + id] = false;
        }
      };
    });

    // 帰着
    root.querySelectorAll('[data-ret]').forEach(function (el) {
      el.onclick = async function () {
        var id = el.dataset.ret;
        if (state.busy[id]) return;
        state.busy[id] = true;
        el.disabled = true;
        try {
          var hmr = srNowHM();
          var res = await srSend('/api/soge/run/return', 'POST', { day_id: id });
          if (!res.ok) {
            /* soge-tap-retry-v1: 帰着も貯める。押した時刻で送り直す。 */
            srqAdd({ k: 'return', id: id, date: state.date, hhmm: hmr });
            var tr = findTrip(id);
            if (tr) tr.returned_at = hmr;
            srAlert('err', '帰着 ' + hmr + ' を記録できませんでした（' + res.why
                    + '）。電波が戻ると自動で送ります。');
            el.disabled = false;
            keepScroll(render);
            return;
          }
          var j = res.data;
          srqDrop('return', id);
          srAlert('');
          toast('帰着 ' + j.returned_at);
          if (!j.already) setUndo('return', id, true, id, '帰着 ' + j.returned_at + ' を記録');
          var t = findTrip(id);
          if (t) t.returned_at = j.returned_at;
          keepScroll(render);
        } finally {
          state.busy[id] = false;
        }
      };
    });

    // ---- soge-extra-v1: 臨時便 ----
    var addBtn = document.getElementById('srAddExtra');    // ---- soge-undo-v1: 戻す ----
    /* 済んだ人の開け閉め。開いているかは state に持つ（描き直しても閉じない）。 */
    root.querySelectorAll('[data-doneopen]').forEach(function (el) {
      el.onclick = function () { state.doneOpen = !state.doneOpen; keepScroll(render); };
    });

    /* 直後の帯。★ここだけ確認を出さない。
       押し間違いに気づいた瞬間の操作なので、もう一手間かけさせるのは邪魔。 */
    root.querySelectorAll('[data-udbar]').forEach(function (el) {
      el.onclick = async function () {
        if (el.dataset.udbar === 'x') { state.undo = null; keepScroll(render); return; }
        var u = state.undo;
        if (!u) return;
        var key = 'u' + u.id;
        if (state.busy[key]) return;
        state.busy[key] = true;
        el.disabled = true;
        try {
          var ok;
          /* soge-back-v1: 順番を戻すときは、前の並びをそのまま送り直す。
             ★打刻の「戻す」とは別の道。あちらは値を空にするだけだが、
               順番は「全員の並び」を渡さないと直らない。 */
          if (u.kind === 'order') {
            ok = await sendOrder(u.day, u.ids || []);
            if (ok) {
              var _t = findTrip(u.day);
              if (_t) applyOrder(_t, u.ids || []);
            }
          } else {
            ok = u.isDay ? await undoDay(u.id, u.kind) : await undoStop(u.id, u.kind);
          }
          if (!ok) { el.disabled = false; return; }
          toast('戻しました');
          state.undo = null;
          keepScroll(render);
        } finally { state.busy[key] = false; }
      };
    });

    /* 一覧の中の「戻す」（済んだ人・お休みの人）。
       ★いつでも押せる場所にあるので、名前と時刻を出して確認する。 */
    root.querySelectorAll('[data-uds]').forEach(function (el) {
      el.onclick = async function () {
        var id = el.dataset.uds, kind = el.dataset.udk;
        var nm = el.dataset.udn || '', tm = el.dataset.udt || '';
        var q = (kind === 'absent')
          ? (nm + 'さんの「休み」を取り消しますか？')
          : (nm + 'さん ' + tm + ' の到着を消しますか？');
        if (!confirm(q)) return;
        var key = 'u' + id;
        if (state.busy[key]) return;
        state.busy[key] = true;
        el.disabled = true;
        try {
          if (!await undoStop(id, kind)) { el.disabled = false; return; }
          toast('戻しました');
          if (state.undo && state.undo.id === id) state.undo = null;
          keepScroll(render);
        } finally { state.busy[key] = false; }
      };
    });

    /* 出発・帰着の板の中の「戻す」。
       ★消したあと押し直すと【そのときの時刻】が入る。元の時刻には戻らない。
         なので、消す前に必ず元の時刻を見せて聞く。 */
    root.querySelectorAll('[data-udd]').forEach(function (el) {
      el.onclick = async function () {
        var id = el.dataset.udd, kind = el.dataset.udk, tm = el.dataset.udt || '';
        var q = (kind === 'return' ? '帰着 ' : '出発 ') + tm + ' の記録を消しますか？'
              + '\n（消したあと押し直すと、そのときの時刻が入ります）';
        if (!confirm(q)) return;
        var key = 'u' + id + kind;
        if (state.busy[key]) return;
        state.busy[key] = true;
        el.disabled = true;
        try {
          if (!await undoDay(id, kind)) { el.disabled = false; return; }
          toast('戻しました');
          if (state.undo && state.undo.id === id) state.undo = null;
          keepScroll(render);
        } finally { state.busy[key] = false; }
      };
    });


    /* soge-back-v1: 1つ後ろへ回す。★確認は出さない。
       押し間違えても、すぐ上の帯から戻せる。走行中に確認を出すと、
       画面を見る時間が増える。 */
    root.querySelectorAll('[data-back]').forEach(function (el) {
      el.onclick = async function () {
        var id = el.dataset.back;
        var t = findTrip(dayIdOfStop(id));
        if (!t) return;
        var before = (t.stops || []).map(function (s) { return s.id; });
        var ids = orderAfterBack(t, id);
        if (!ids) { toast('これ以上うしろに回せません'); return; }
        var key = 'b' + id;
        if (state.busy[key]) return;
        state.busy[key] = true;
        /* ★中の文字を作り直さない。名前が入っているので、消すと戻せない。 */
        var oldHtml = el.innerHTML;
        el.innerHTML = '…';
        el.disabled = true;
        try {
          if (!await sendOrder(t.day_id, ids)) {
            el.innerHTML = oldHtml;
            el.disabled = false;
            return;
          }
          applyOrder(t, ids);
          var _s = findStop(id);
          /* soge-undo-v1 と同じ帯に出す。★前の並びをそのまま覚えておいて、
             戻すときはそれを送り直す。 */
          /* ★帯の文は短く。長いと幅に入りきらず「…」で切れる。
             「○○さんを後にしました」は実際に切れた。名前を先に置いて詰める。 */
          state.undo = { kind: 'order', id: id, isDay: false, day: t.day_id,
                         ids: before,
                         text: ((_s && _s.user_name) || '') + 'さんを後に' };
          keepScroll(render);
        } finally { state.busy[key] = false; }
      };
    });

    /* soge-trip-pick-v1: 一覧の便の札。 */
    root.querySelectorAll('[data-lstrip]').forEach(function (el) {
      el.onclick = function () {
        if (state.lsTrip === el.dataset.lstrip) return;
        state.lsTrip = el.dataset.lstrip;
        keepScroll(render);
      };
    });

    /* soge-run-pick-v1: 一覧の「車を選ぶ」。 */
    root.querySelectorAll('[data-lspick]').forEach(function (el) {
      el.onclick = function () { openListPick(el); };
    });

    /* soge-run-list-v1: 一覧から、その車を運転中で開く。
       ★車は key で指定する（並び順で指定しない）。
         臨時便を作った直後などに並びが変わると、別の車が開く。 */
    root.querySelectorAll('[data-golist]').forEach(function (el) {
      el.onclick = function () {
        var key = el.dataset.golist, day = el.dataset.golistt || '';
        state.mode = 'drive';
        /* soge-run-pick-v1: ★開いた状態で戻す。閉じたまま戻すと、
           「運転中で開く」を押したのに何も開かない。 */
        state.accOpen = true;
        try { localStorage.setItem('soge_run_mode', 'drive'); } catch (e) {}
        state.tabKey = key;
        state.autoTab = false;      /* 自分で選んだ車は動かさない */
        state.tripTab = 0;
        /* その車の中で、押した便を開く */
        var vs = (state.data && state.data.vehicles) || [];
        for (var i = 0; i < vs.length; i++) {
          if (String(vs[i].key) !== String(key)) continue;
          state.tab = i;
          var ts = vs[i].trips || [];
          for (var k = 0; k < ts.length; k++) {
            if (String(ts[k].day_id) === String(day)) { state.tripTab = k; break; }
          }
          break;
        }
        window.scrollTo(0, 0);
        render();
      };
    });

    if (addBtn) addBtn.onclick = function () { openExtraPanel(addBtn); };

    root.querySelectorAll('[data-exdel]').forEach(function (el) {
      el.onclick = async function () {
        if (!confirm('この臨時便を取り消しますか？（打刻も消えます）')) return;
        var r = await fetch('/api/soge/run/extra', {
          method: 'DELETE', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ day_id: el.dataset.exdel })
        });
        var j = await r.json();
        if (j.status !== 'success') { toast(j.message || '取り消せませんでした', 'err'); return; }
        toast('臨時便を取り消しました');
        await load();
      };
    });

    root.querySelectorAll('[data-exadd]').forEach(function (el) {
      el.onclick = function () { openAddToExtra(el, el.dataset.exadd); };
    });
  }

  // ---------- soge-extra-v1: 利用者の検索（記録入力と同じやり方） ----------
  function toKata(s) { return s.replace(/[ぁ-ゖ]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) + 0x60); }); }
  function toHira(s) { return s.replace(/[ァ-ヶ]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0x60); }); }

  function searchPatients(q) {
    q = (q || '').trim();
    if (!q) return [];
    var ql = q.toLowerCase(), qk = toKata(q), qh = toHira(q);
    return state.patients.filter(function (p) {
      var n = p.user_name || '', k = p.user_kana || '', no = String(p.patient_number || '');
      return n.indexOf(q) >= 0 || n.toLowerCase().indexOf(ql) >= 0 ||
             k.indexOf(q) >= 0 || k.indexOf(qk) >= 0 || k.indexOf(qh) >= 0 ||
             no.indexOf(q) >= 0;
    }).slice(0, 30);
  }

  function uuid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
      var r = Math.random() * 16 | 0;
      return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
    });
  }

  // 検索欄＋「登録のない方」を1つの部品にまとめる。臨時便の新規でも追加でも使う。
  function personPicker(box) {
    box.insertAdjacentHTML('beforeend',
      '<div class="sr-lbl" style="margin-top:8px;">利用者（ひらがな・漢字・カルテ番号で検索）</div>' +
      '<div class="sr-search" style="margin-top:5px;">' +
        '<input type="text" class="q" placeholder="例：やまだ / 山田 / 001" autocomplete="off">' +
        '<div class="sr-cands"></div>' +
      '</div>' +
      '<div class="picked" style="display:none;margin-top:6px;"></div>' +
      '<div class="row"><label style="font-size:0.8rem;display:flex;align-items:center;gap:4px;">' +
        '<input type="checkbox" class="guest"> 登録のない方（名前を直接入力）</label></div>');

    var q = box.querySelector('.q');
    var cands = box.querySelector('.sr-cands');
    var picked = box.querySelector('.picked');
    var guest = box.querySelector('.guest');
    var chosen = null;

    function clearPick() {
      chosen = null;
      picked.style.display = 'none';
      box.querySelector('.sr-search').style.display = '';
      q.value = '';
      q.focus();
    }
    function pick(p) {
      chosen = p;
      cands.classList.remove('show');
      box.querySelector('.sr-search').style.display = 'none';
      picked.style.display = '';
      picked.innerHTML = '<div class="sr-picked">' + esc(p.user_name) + '<span class="chg">変更</span></div>';
      picked.querySelector('.chg').onclick = clearPick;
    }

    q.oninput = q.onkeyup = q.oncompositionend = function () {
      if (guest.checked || !q.value.trim()) { cands.classList.remove('show'); return; }
      var list = searchPatients(q.value);
      if (!list.length) {
        cands.innerHTML = '<div class="sr-cand" style="color:#9aa0a6;">該当なし（登録のない方はチェックを入れてください）</div>';
      } else {
        cands.innerHTML = list.map(function (p, i) {
          return '<div class="sr-cand" data-i="' + i + '">' + esc(p.user_name) +
            (p.user_kana ? '<span style="color:#9aa0a6;font-size:0.78rem;margin-left:6px;">' + esc(p.user_kana) + '</span>' : '') +
            '</div>';
        }).join('');
        cands.querySelectorAll('[data-i]').forEach(function (el) {
          el.addEventListener('mousedown', function (e) { e.preventDefault(); });
          el.addEventListener('click', function () { pick(list[Number(el.dataset.i)]); });
          el.addEventListener('touchstart', function (e) { e.preventDefault(); pick(list[Number(el.dataset.i)]); });
        });
      }
      cands.classList.add('show');
    };
    guest.onchange = function () {
      clearPick();
      cands.classList.remove('show');
      q.placeholder = guest.checked ? '名前を入力（例：見学 太郎）' : '例：やまだ / 山田 / 001';
    };

    // 選ばれた人を返す。未選択なら null。
    return function () {
      if (guest.checked) {
        var nm = (q.value || '').trim();
        if (!nm) { toast('名前を入れてください', 'err'); q.focus(); return null; }
        return { patient_id: uuid(), user_name: nm, guest: true };
      }
      if (!chosen) { toast('利用者を選んでください', 'err'); q.focus(); return null; }
      return { patient_id: chosen.patient_id, user_name: chosen.user_name, guest: false };
    };
  }

  // 臨時便を新しく作る
  function openExtraPanel(btn) {
    if (document.querySelector('.sr-panel')) return;

    var vopts = state.vehicles.map(function (x) {
      return '<option value="' + esc(x.id) + '">' + esc(x.name) + '</option>';
    }).join('');
    var sopts = state.staff.map(function (n) {
      return '<option value="' + esc(n) + '">' + esc(n) + '</option>';
    }).join('');

    var box = document.createElement('div');
    box.className = 'sr-panel';
    box.innerHTML =
      '<div style="font-weight:800;font-size:0.95rem;">臨時便を作る</div>' +
      '<div class="row">' +
        '<select class="reason">' +
          '<option value="早退">早退</option><option value="遅刻">遅刻</option>' +
          '<option value="通院">通院</option><option value="その他">その他</option>' +
        '</select>' +
        '<select class="ty"><option value="dropoff">送り</option><option value="pickup">迎え</option></select>' +
        '<input type="time" class="dep">' +
      '</div>' +
      '<div class="row">' +
        '<select class="veh"><option value="">車両…</option>' + vopts + '</select>' +
        '<select class="drv"><option value="">運転手…</option>' + sopts + '</select>' +
      '</div>';
    btn.parentNode.insertBefore(box, btn);

    var getPerson = personPicker(box);

    box.insertAdjacentHTML('beforeend',
      '<div class="row" style="margin-top:10px;">' +
        '<button class="sr-tap ok" style="min-width:80px;">作成</button>' +
        '<button class="sr-mini no">やめる</button>' +
      '</div>');

    box.querySelector('.no').onclick = function () { box.remove(); };
    box.querySelector('.ok').onclick = async function () {
      var p = getPerson();
      if (!p) return;
      var body = {
        date: state.date,
        reason: box.querySelector('.reason').value,
        depart: box.querySelector('.dep').value || '',
        vehicle_id: box.querySelector('.veh').value || '',
        driver_name: box.querySelector('.drv').value || '',
        stops: [{ patient_id: p.patient_id, user_name: p.user_name,
                  type: box.querySelector('.ty').value }]
      };
      var r = await fetch('/api/soge/run/extra', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      var j = await r.json();
      if (j.status !== 'success') { toast(j.message || '作れませんでした', 'err'); return; }
      box.remove();
      toast('臨時便を作りました（他の便からは自動で外しました）');
      // soge-unassigned-v1: 便の並びが変わるので、覚えていたタブは捨てる。
      //   残すと、同じ車の別の臨時便が選ばれることがある
      state.tabKey = '';
      state.tripTab = 9999; // 臨時便タブに自動移動（render()でlength-1にクランプ）
      await load();
    };
  }

  // すでにある臨時便に、あとから1名足す
  function openAddToExtra(btn, dayId) {
    if (document.querySelector('.sr-panel')) return;
    /* soge-run-pick-v1: ★ここも同じ。一覧の「＋ 利用者」は .sr-trip の中に
       居ないので、置き先が見つからず落ちていた（私の落ち度）。 */
    var trip = btn.closest('.sr-trip') || btn.closest('.sr-lc') || btn.parentNode;

    var box = document.createElement('div');
    box.className = 'sr-panel';
    box.innerHTML =
      '<div style="font-weight:800;font-size:0.95rem;">臨時便に利用者を追加</div>' +
      '<div class="row"><select class="ty"><option value="dropoff">送り</option><option value="pickup">迎え</option></select></div>';
    trip.appendChild(box);

    var getPerson = personPicker(box);
    box.insertAdjacentHTML('beforeend',
      '<div class="row" style="margin-top:10px;">' +
        '<button class="sr-tap ok" style="min-width:80px;">追加</button>' +
        '<button class="sr-mini no">やめる</button>' +
      '</div>');

    box.querySelector('.no').onclick = function () { box.remove(); };
    box.querySelector('.ok').onclick = async function () {
      var p = getPerson();
      if (!p) return;
      var r = await fetch('/api/soge/run/extra/stop', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          day_id: dayId, patient_id: p.patient_id, user_name: p.user_name,
          type: box.querySelector('.ty').value
        })
      });
      var j = await r.json();
      if (j.status !== 'success') { toast(j.message || '追加できませんでした', 'err'); return; }
      box.remove();
      toast(p.user_name + ' さんを追加しました');
      await load();
    };
  }

  (async function init() {
    state.date = todayStr();
    $('srDate').value = state.date;
    $('srDate').onchange = function () {
      state.date = $('srDate').value || todayStr();
      state.tab = 0; state.tabKey = ''; state.autoTab = true;
      $('srPrint').href = '/soge/print?month=' + state.date.slice(0, 7);   // soge-print-v2
      load();
    };
    $('srPrint').href = '/soge/print?month=' + state.date.slice(0, 7);      // soge-print-v2

    // soge-extra-v1: 臨時便で使う候補
    var s = await fetch('/api/soge/staff').then(function (r) { return r.json(); }).catch(function () { return {}; });
    state.staff = (s && s.staff) ? s.staff : [];
    var v = await fetch('/api/vehicles').then(function (r) { return r.json(); }).catch(function () { return {}; });
    state.vehicles = (v && v.vehicles) ? v.vehicles : [];
    var p = await fetch('/api/soge/patients').then(function (r) { return r.json(); }).catch(function () { return {}; });
    state.patients = (p && p.patients) ? p.patients : [];

    load();
  })();
})();
</script>
{% endblock %}
