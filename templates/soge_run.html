{% extends "base.html" %}
{% block title %}運行 - TASUKARU{% endblock %}
{% block nav_soge %}active{% endblock %}

{% block extra_style %}
<style>
/* soge-run-v1 */
.sr-wrap { max-width:1100px; margin:0 auto; padding:12px 12px 90px; container-type:inline-size; }
.sr-head { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
.sr-title { font-size:1.15rem; font-weight:800; }
.sr-btn { border:none; border-radius:8px; padding:8px 14px; font-weight:700; cursor:pointer; font-size:0.9rem;
  background:#eef2f7; color:#334; text-decoration:none; display:inline-block; }
.sr-date { border:1px solid #d6dbe3; border-radius:8px; padding:7px 9px; font-size:0.9rem; background:#fff; }

/* 車両タブ（運転手は自分の車だけ見ればいい） */
.sr-tabs { display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; margin-bottom:8px; }
.sr-tab { flex:0 0 auto; padding:9px 14px; border-radius:10px; border:1.5px solid #dadce0; background:#fff;
  color:#5f6368; font-weight:800; font-size:0.9rem; cursor:pointer; white-space:nowrap; }
/* soge-car-icon-v1: 選んでいるタブは【薄い青の地＋青い枠】。
   ★車の色で塗るのはやめた。塗ると、その上の名前を黒にできない。
     色は車のアイコンだけが持つ。名前はどこでも黒。 */
.sr-tab.on { background:#E8F0FE; border-color:#1a73e8; color:#202124; }
.sr-tab { color:#202124; }
/* 車のアイコン。置く場所ごとに大きさを決める。 */
.soge-cari { display:inline-block; vertical-align:-4px; width:30px; height:18px;
  flex:0 0 auto; margin-right:6px; }
.sr-driver .soge-cari { width:26px; height:15px; vertical-align:-3px; }

/* soge-view-v1: 見せ方の切り替え（車両から／便から）
   現場の要望。運転手は「自分の車」から見たいが、送迎の全体を組む人は
   「迎え便に何台出ているか」から見たい。どちらが正しいということはないので選べるようにした。 */
.sr-mode-row { display:flex; align-items:center; gap:10px; margin-bottom:9px; flex-wrap:wrap; }
.sr-mode { display:inline-flex; border:1.5px solid #dadce0; border-radius:9px; overflow:hidden; background:#fff; }
.sr-mode button { border:none; background:#fff; color:#5f6368; font-weight:800; font-size:0.82rem;
  padding:8px 13px; cursor:pointer; font-family:inherit; }
.sr-mode button.on { background:#1a73e8; color:#fff; }
.sr-mode button + button { border-left:1.5px solid #dadce0; }
.sr-mode-hint { font-size:0.75rem; color:#9aa3b2; font-weight:600; }

/* soge-trip-tab-v1: 便タブ（迎え便・送り便ごとに切り替え） */
.sr-ttabs { display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; margin-bottom:12px; }
.sr-ttab { flex:0 0 auto; padding:8px 14px; border-radius:10px; border:1.5px solid #dadce0; background:#fff;
  color:#5f6368; font-weight:800; font-size:0.88rem; cursor:pointer; text-align:center; line-height:1.3; }
.sr-ttab.on { background:#0f9d58; border-color:#0f9d58; color:#fff; }
.sr-ttab-time { display:block; font-size:0.72rem; font-weight:600; opacity:0.85; font-variant-numeric:tabular-nums; }

/* soge-unassigned-v1: まだ乗る車が決まっていない人。
   運転手にも見せて、誰も乗せ忘れないようにする。打刻はできない（走らないので）。 */
.sr-trip.unassigned { border-color:#f5c6c2; }
.sr-trip.unassigned .sr-trip-head { background:#fce8e6; color:#a5261f; }
.sr-unassigned-note { background:#fce8e6; border:1px solid #f5c6c2; color:#a5261f;
  border-radius:8px; padding:10px 12px; font-size:0.86rem; font-weight:700; line-height:1.6;
  margin-bottom:10px; }

.sr-driver { font-size:0.8rem; color:#5f6368; font-weight:700; margin-bottom:10px; }
/* soge-driver-change-v1: 運転手の行を押して替えられるようにする。
   ★押せると分かる形にする（枠と「交代」の札）。ただの文字のままだと、
     押せることに誰も気づかない。
   ★大きくはしない。運転席で押すものではなく、出発前に事務所で押すもの。 */
.sr-drv-b { border:1px solid #dadce0; background:#fff; border-radius:9px;
  font-family:inherit; font-size:0.8rem; font-weight:700; color:#3c4043;
  padding:5px 9px; cursor:pointer; display:inline-flex; align-items:center; gap:7px; }
.sr-drv-b:active { background:#eef2f7; }
.sr-drv-b:disabled { opacity:.55; cursor:not-allowed; }
.sr-drv-i { font-size:0.68rem; font-weight:800; color:#1a73e8;
  background:#E8F0FE; border-radius:6px; padding:2px 6px; }
.sr-drv-b:disabled .sr-drv-i { color:#5f6368; background:#eceff1; }
.sr-drvp-n { font-size:0.76rem; color:#8a5a00; line-height:1.6; margin-top:6px; }

.sr-trip { border:1px solid #dbe3ee; border-radius:12px; margin-bottom:14px; background:#fafcff; overflow:hidden; }
.sr-trip-head { display:flex; align-items:center; gap:8px; padding:10px 12px; background:#eef2f7;
  border-bottom:1px solid #e3e8ef; font-weight:800; }
.sr-trip-time { font-size:0.78rem; color:#6b7280; font-weight:600; }
.sr-trip-body { padding:8px 10px 10px; }

.sr-stop { display:flex; align-items:center; gap:8px; padding:9px 8px; margin-bottom:6px;
  background:#fff; border:1px solid #e3e8ef; border-radius:10px; box-shadow:0 1px 2px rgba(16,24,40,.05); }
.sr-stop:last-child { margin-bottom:0; }
.sr-stop.done { background:#f2fbf5; border-color:#cdeed8; }
.sr-stop.absent { background:#f6f7f9; border-color:#e6e8ec; }
.sr-stop.absent .sr-name { color:#9aa0a6; text-decoration:line-through; }

.sr-seq { width:18px; text-align:center; font-weight:800; color:#9aa0a6; font-size:0.8rem; flex:0 0 auto; }
.sr-type { font-size:0.68rem; font-weight:800; border-radius:6px; padding:2px 6px; white-space:nowrap; flex:0 0 auto; }
.sr-type.pickup  { background:#E6F1FB; color:#185FA5; }
.sr-type.dropoff { background:#EAF3DE; color:#3B6D11; }
/* soge-layout-v2: 名前エリアとボタン群を分離して名前が押しつぶされないようにする */
.sr-info { flex:1; min-width:0; }
.sr-name { display:block; font-weight:700; font-size:0.92rem; overflow-wrap:anywhere; }
.sr-actions { flex:0 0 auto; display:flex; align-items:center; gap:4px; }
/* 住所は名前の下に小さく。最大2行で切る。 */
.sr-addr { display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2;
  font-weight:400; font-size:0.66rem; line-height:1.2; color:#9aa0a6; margin-top:2px;
  white-space:normal; overflow:hidden; overflow-wrap:anywhere; }
.sr-tag { font-size:0.66rem; font-weight:700; border-radius:6px; padding:2px 5px; margin-left:4px; white-space:nowrap;
  background:#f3e8ff; color:#6b21a8; }
.sr-tag.leave { background:#fff3e0; color:#b26a00; }   /* soge-leave-v1: 休み連絡 */

/* soge-lock-v1: 確定バー。この日の表を止めるかどうかは【人が決める】 */
.sr-lock { display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  border:1px solid #dbe3ee; background:#f7fafd; border-radius:10px; padding:9px 11px; margin-bottom:10px; }
.sr-lock .st { font-size:0.82rem; font-weight:800; color:#1a73e8; }
.sr-lock.on { border-color:#c7e3cd; background:#f2f9f4; }
.sr-lock.on .st { color:#137333; }
.sr-lock .ex { flex:1 1 100%; font-size:0.73rem; color:#7b8794; line-height:1.6; }
.sr-lock button { border:1.5px solid #b6c0cb; background:#fff; color:#334; border-radius:8px;
  padding:7px 12px; font-size:0.8rem; font-weight:800; cursor:pointer; font-family:inherit; }
.sr-lock button.main { background:#137333; border-color:#137333; color:#fff; }
.sr-lock button.warn { border-color:#e6c3c0; background:#fdf3f2; color:#a34a41; }
.sr-plan { display:block; font-size:0.72rem; color:#9aa0a6; font-variant-numeric:tabular-nums; margin-top:2px; }

/* 打刻ボタン。指で押しやすい大きさにする */
.sr-tap { flex:0 0 auto; border:none; border-radius:10px; padding:9px 14px; font-weight:800; font-size:0.9rem;
  background:#1a73e8; color:#fff; cursor:pointer; min-width:62px; }
.sr-tap:disabled { opacity:0.6; cursor:default; }
.sr-time { flex:0 0 auto; border:1px solid #cdeed8; background:#e6f4ea; color:#137333; border-radius:10px;
  padding:8px 10px; font-weight:800; font-size:0.95rem; font-variant-numeric:tabular-nums; cursor:pointer;
  min-width:74px; text-align:center; }
.sr-timeedit { flex:0 0 auto; border:1px solid #1a73e8; border-radius:10px; padding:7px 8px; font-size:0.95rem;
  font-variant-numeric:tabular-nums; }
.sr-pen { flex:0 0 auto; border:1px solid #dadce0; background:#fff; border-radius:10px; width:38px; height:38px;
  cursor:pointer; color:#5f6368; font-size:0.95rem; line-height:1; padding:0; }
.sr-x { flex:0 0 auto; border:1px solid #dadce0; background:#fff; border-radius:10px; width:38px; height:38px;
  cursor:pointer; color:#9aa0a6; font-size:0.95rem; font-weight:800; line-height:1; padding:0; }
.sr-x.on { background:#fce8e6; border-color:#f5c6c2; color:#c5221f; }

.sr-return { display:flex; justify-content:flex-end; margin-top:8px; }
.sr-ret-btn { border:none; border-radius:10px; padding:9px 16px; font-weight:800; font-size:0.88rem;
  background:#eef2f7; color:#334; cursor:pointer; }
.sr-ret-btn.done { background:#e6f4ea; color:#137333; }

/* 臨時便（早退・遅刻・通院など）。定期便と見分けが付くように色を変える。 */
.sr-trip.extra { border-color:#fed7aa; background:#fffaf5; }
.sr-trip.extra .sr-trip-head { background:#fff2e5; }
.sr-badge-extra { background:#9a3412; color:#fff; font-size:0.66rem; font-weight:800; border-radius:999px;
  padding:2px 8px; margin-right:2px; }
.sr-mini { border:1px solid #dadce0; background:#fff; border-radius:8px; padding:4px 9px;
  font-size:0.72rem; font-weight:700; color:#5f6368; cursor:pointer; }
.sr-mini.del { border-color:#f5c6c2; background:#fce8e6; color:#c5221f; }
.sr-extra-add { display:flex; justify-content:center; margin:14px 0 4px; }

/* 臨時便の入力パネル */
/* ===== soge-drive-v1: 運転中の画面 =====
   運転席で片手で使う。出すものを絞り、押すところを大きくする。 */
.sr-dv { background:#fff; border:1px solid #e3e8ef; border-radius:14px;
  box-shadow:0 1px 3px rgba(16,24,40,.08); padding:14px; margin-bottom:10px; }
.sr-dv-top { display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  font-size:0.8rem; color:#5f6368; margin-bottom:8px; }
.sr-dv-cnt { margin-left:auto; font-weight:800; color:#1f2933; }
.sr-dv-name { font-size:1.5rem; font-weight:800; line-height:1.25; color:#1a1a1a;
  overflow-wrap:anywhere; }
/* ★住所は切らない。マンション名が長いと、いちばん要る号室がちょうど切れる。 */
.sr-dv-addr { font-size:1.05rem; line-height:1.5; color:#3c4043; margin-top:6px;
  overflow-wrap:anywhere; white-space:normal; }
.sr-dv-plan { font-size:0.85rem; color:#5f6368; margin-top:6px; }
/* 到着ボタン。運転席で押すので、指1本ぶんより十分に大きく。 */
.sr-dv-tap { display:block; width:100%; margin-top:12px; border:none; border-radius:12px;
  background:#1a73e8; color:#fff; font-size:1.25rem; font-weight:800; padding:18px 10px;
  cursor:pointer; }
.sr-dv-tap:active { background:#1558b0; }
.sr-dv-tap:disabled { opacity:0.6; }
.sr-dv-tap.done { background:#137333; }
.sr-dv-tap.gray { background:#5f6368; }
/* 小さいほうのボタン（お休み・時刻・車の移動） */
.sr-dv-sub { display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }
.sr-dv-sub button { flex:1 1 30%; min-width:96px; border:1px solid #dadce0; background:#fff;
  border-radius:10px; padding:10px 6px; font-size:0.82rem; font-weight:700; color:#3c4043;
  cursor:pointer; }
.sr-dv-sub button:active { background:#eef2f7; }
.sr-dv-next { margin-top:10px; }
.sr-dv-next .h { font-size:0.78rem; font-weight:800; color:#5f6368; margin-bottom:5px; }
.sr-dv-next .r { display:flex; gap:8px; align-items:baseline; padding:6px 8px;
  border-bottom:1px dashed #e3e8ef; font-size:0.86rem; }
.sr-dv-next .r:last-child { border-bottom:none; }
/* ★名前は絶対に割らない。実測で「佐藤／花」と縦に割れた。
   住所のほうを詰める（この一覧は下見なので、全部は要らない。
   その人が「次」になったとき、上の大きい欄に号室まで出る）。 */
.sr-dv-next .r b { font-weight:800; flex:0 0 auto; white-space:nowrap; }
.sr-dv-next .r .a { flex:1 1 auto; min-width:0; color:#9aa0a6; font-size:0.74rem;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sr-dv-off { margin-top:10px; font-size:0.8rem; color:#b26a00; line-height:1.6; }
.sr-dv-fin { text-align:center; padding:10px 4px 4px; }
.sr-dv-fin .t { font-size:1.15rem; font-weight:800; color:#137333; }
.sr-dv-fin .s { font-size:0.82rem; color:#5f6368; margin-top:6px; line-height:1.6; }
.sr-dv-note { font-size:0.8rem; color:#5f6368; line-height:1.6; margin-top:8px; }

/* ===== soge-drive-v2: カーナビのような縦の帯 =====
   高速道路の案内表示にならって、行き先を上から順に並べる。
   ★道の線には【車の色】を使う。配車・記録表で見た色と、運転席の線がつながる。 */
.sr-nv { position:relative; padding-left:34px; }
/* 道。うっすら敷いて、点（立ち寄り先）を目立たせる */
/* soge-car-color-v2: 薄い色でも道が見えるように、細い縁を添える。
   ★色そのものは変えない。白い車の道は白いまま。 */
.sr-nv::before { content:''; position:absolute; left:13px; top:10px; bottom:10px; width:6px;
  border-radius:3px; background:var(--sr-road, #1a73e8); opacity:.45;
  box-shadow:0 0 0 1px var(--sr-edge, rgba(0,0,0,.14)); }   /* soge-car-color-v4 */
.sr-nd { position:relative; margin-bottom:12px; }
.sr-nd:last-child { margin-bottom:0; }
.sr-nd::before { content:''; position:absolute; left:-27px; top:13px;
  width:12px; height:12px; border-radius:50%; background:#fff;
  border:3px solid var(--sr-road, #1a73e8);
  box-shadow:0 0 0 1px var(--sr-edge, rgba(0,0,0,.18)); }   /* soge-car-color-v4 */
/* いま向かっている先。ここだけ塗って、目が最初に行くようにする */
/* soge-car-color-v2: ★ここにも細い縁が要る。塗りつぶしの丸なので、
   白い車だと「白地に白い丸」で完全に消える（実際に測って消えていた）。
   下の box-shadow は【後ろに書いたほうが勝つ】ので、縁を先に足しておく。 */
.sr-nd.now::before { left:-31px; top:9px; width:20px; height:20px; border-width:4px;
  background:var(--sr-road, #1a73e8);
  box-shadow:0 0 0 1.5px var(--sr-edge, rgba(0,0,0,.30)), 0 0 0 6px rgba(0,0,0,.06); }
/* もう済んだところ（出発の打刻など）。灰色にして、押すものではないと分かるように */
.sr-nd.past::before { border-color:#bdc1c6; }
/* 事業所（終点）。丸ではなく四角にして、人の家と見分ける */
.sr-nd.goal::before { border-radius:3px; }

/* 案内板。高速道路の標識と同じ緑地・白抜き。
   ★名前は絶対に割らない（実測で「佐藤／花」と縦に割れたことがある）。
     入り切らないときは、時刻のほうが下の行へ落ちる。 */
.sr-pl { background:#146C43; color:#fff; border-radius:10px; padding:9px 12px;
  display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
.sr-pl .nm { font-weight:800; font-size:1.05rem; white-space:nowrap; line-height:1.3; }
.sr-pl .tm { margin-left:auto; font-weight:800; font-size:0.95rem; white-space:nowrap;
  font-variant-numeric:tabular-nums; }
.sr-pl .tag { font-size:0.68rem; font-weight:800; border-radius:6px; padding:2px 6px;
  background:rgba(255,255,255,.22); white-space:nowrap; }
/* 次の人の板。下の白い箱と1枚につなげる（角を上だけ丸める） */
/* soge-drive-v5: ★名前を大きくするのはやめた。
     大きくしても探す助けにはならず、1人ぶん場所を取って
     そのあとの人が画面の外へ押し出される。見分けは色で付ける。 */
.sr-pl.big { border-radius:12px 12px 0 0; }
/* 事業所の出発・帰着の帯。人の家（緑）とは別の色にして取り違えを防ぐ */
.sr-pl.dep { background:#33404D; }
.sr-pl.dep.done { background:#EEF2F7; color:#5f6368; }
.sr-pl.dep.wait { background:#EEF2F7; color:#9aa0a6; }

/* soge-drive-v3: 事業所の出発・帰着は【板そのもの】を押す。
   ★同じ文字が2つ（板と、その下のボタン）出ていた。押すところが2か所ある
     ように見えるうえ、白い箱のぶん次の人が下へ押し出されていた。
   ★押せる板だけ青くする。済んだ板（灰）・まだ押せない板（薄い灰）・
     人の板（緑）と、色で役割が分かれる。
   ★人の板は押せるようにしない。名前を読もうとして触れただけで
     到着が付いてしまう。 */
button.sr-pl { width:100%; border:none; font-family:inherit; text-align:left;
  cursor:pointer; -webkit-appearance:none; appearance:none; }
.sr-pl.go { background:#1a73e8; padding:15px 14px; }
.sr-pl.go:active { background:#1558b0; }
.sr-pl.go .nm { font-size:1.15rem; }
.sr-pl.go .go-i { font-size:0.85rem; opacity:.9; margin-left:8px; }
/* 板の下に文だけが続くとき（帰着の説明）。角を板とつなげる */
.sr-pl.go.hasnote { border-radius:12px 12px 0 0; }

/* 次の人の中身（住所と押すところ）。板の下に、白い箱として続ける */
/* soge-drive-v4: いま向かう人の箱に、車の色をうっすら敷く。
   ★名前・住所・押すところが、まとめて1つの箱に見えるようにする。
   ★opacity で薄くしてはいけない。上に載る文字まで薄くなる。
     地の色そのものを薄くしたもの(--sr-soft)を敷く。 */
.sr-nvb { background: var(--sr-soft, #fff); border:1px solid #E3E8EF; border-top:none;
  border-radius:0 0 12px 12px; padding:12px; }
/* ★住所は切らない。マンション名が長いと、いちばん要る号室がちょうど切れる。 */
.sr-nva { font-size:1.05rem; line-height:1.5; color:#3c4043; overflow-wrap:anywhere; }
.sr-nva.none { color:#c5221f; }
/* 先の人の住所。ここは下見なので詰めてよい（その人が次になれば上に大きく出る） */
.sr-nvs { font-size:0.78rem; color:#5f6368; margin:5px 2px 0;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* soge-drive-v5: そのあとの人。緑をやめて薄い灰色にする。
   ★これで緑は「いま向かっているところ」だけの色になる。
     全部が緑だと、どこまでが「次」か毎回目で追うことになる。
   ★消してはいけない。名前・時刻・車いすはそのまま読める濃さで残す。
     運転席から「次の次は誰か」は見えている必要がある。 */
.sr-pl.later { background:#EEF0F2; color:#5f6368; }
/* ★札の地は白のままだと薄い灰に溶ける（実際に重ねて消えた）。暗いほうに替える。 */
.sr-pl.later .tag { background:rgba(0,0,0,.08); color:#3c4043; }
/* 道の丸も灰色に。板だけ灰色だと丸が浮いて見える。 */
.sr-nd.later::before { border-color:#bdc1c6; }
/* ★住所は薄くしない（モックからここだけ変えた）。
     モックの薄い灰(#9aa0a6)を白地で測ったら 2.64:1 しかなかった。
     住所は 0.78rem と小さい。小さい字ほど濃さが要る。
     走っている車の中で読むものを、そこまで薄くしてはいけない。
     板が灰色になっている時点で「そのあと」だとは分かる。 */
.sr-nv-head { display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  font-size:0.8rem; color:#5f6368; margin-bottom:10px; }
.sr-nv-head .cnt { margin-left:auto; font-weight:800; color:#1f2933; }

/* ===== soge-undo-v1: 押し間違いを戻す =====
   ★直後の帯。運転席で「あ、間違えた」と思った瞬間に押せる場所に置く。
     時間で消さない。走っている最中に消えたら、戻す手立てが無くなる。
   ★黄色にする。緑（行き先）・青（押すところ）・灰（済んだところ）と
     どれとも違う色にして、記録そのものと取り違えないようにする。 */
.sr-undo { display:flex; align-items:center; gap:8px; margin:0 0 10px;
  background:#FEF7E0; border:1px solid #F0C36D; border-radius:10px; padding:8px 10px; }
.sr-undo-t { flex:1; min-width:0; font-size:0.82rem; color:#5F4300;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sr-undo-go { border:1px solid #9A6400; background:#fff; color:#8A5A00;
  font-family:inherit; font-size:0.85rem; font-weight:800; border-radius:8px;
  padding:8px 15px; cursor:pointer; white-space:nowrap; }
.sr-undo-go:active { background:#FBE8B8; }
.sr-undo-x { border:none; background:none; color:#8A5A00; font-family:inherit;
  font-size:0.9rem; padding:7px 5px; cursor:pointer; }

/* 済んだ人。ふだんは閉じておく（運転席で要るのは「次どこか」だけ）。
   ★人数は閉じていても出す。黙って隠さない。 */
.sr-done { margin:0 0 10px; }
.sr-done-h { width:100%; display:flex; align-items:center; cursor:pointer;
  border:1px solid #E3E8EF; background:#fff; border-radius:10px; padding:9px 12px;
  font-family:inherit; font-size:0.82rem; font-weight:700; color:#3c4043; text-align:left; }
.sr-done.open .sr-done-h { border-radius:10px 10px 0 0; }
.sr-done-i { margin-left:auto; color:#5f6368; }
.sr-done-b { border:1px solid #E3E8EF; border-top:none; border-radius:0 0 10px 10px;
  background:#fff; padding:2px 8px 6px; }
.sr-done-r { display:flex; align-items:center; gap:8px; padding:7px 2px;
  border-top:1px solid #F1F3F4; }
.sr-done-r:first-child { border-top:none; }
.sr-done-r .n { min-width:0; font-weight:700; font-size:0.92rem; color:#202124;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sr-done-r .t { margin-left:auto; font-size:0.9rem; font-weight:800; color:#3c4043;
  font-variant-numeric:tabular-nums; white-space:nowrap; }
/* ★戻すは赤の文字にするが、地は白のまま。地まで赤くすると、
     となりの「到着」より目立ってしまう。 */
.sr-done-r button, .sr-off-u { border:1px solid #dadce0; background:#fff; color:#C5221F;
  font-family:inherit; font-size:0.78rem; font-weight:700; border-radius:8px;
  padding:6px 11px; cursor:pointer; white-space:nowrap; }
.sr-done-r button:active, .sr-off-u:active { background:#FCE8E6; }

/* 出発・帰着の板の中の「戻す」 */
.sr-pl-u { align-self:center; border:1px solid #C4CAD2; background:#fff; color:#5f6368;
  font-family:inherit; font-size:0.72rem; font-weight:700; border-radius:7px;
  padding:5px 10px; cursor:pointer; white-space:nowrap; }
.sr-pl-u:active { background:#E4EAF2; }

/* お休みの人。運転手が休みにした人だけ「戻す」を出す。 */
.sr-off-i { display:inline-flex; align-items:center; gap:6px; margin:0 10px 4px 0; }
.sr-off-u { font-size:0.72rem; padding:4px 9px; }
.sr-off-n { font-size:0.7rem; color:#9aa0a6; }

/* soge-car-color-v1: 車の色。タブと運転手の行に出す。
   ★色は付けるだけ。文字と背景の組み合わせは変えない（読みにくくしない）。 */
.sr-tab { border-left: 5px solid transparent; }
/* soge-car-color-v2: 薄い色（白・銀・ベージュ）も選べるので、
   丸には必ず細い縁を付ける。★白い車は【白いまま】出す。灰色に置き換えると
   実際の車と見比べられなくなる。縁があれば白でも位置が分かる。 */
/* soge-car-color-v4: 縁の濃さは色ごとに変える。明るい色ははっきりした黒、
   暗い色はうっすらで足りる。--sr-edge はサーバが決めた色（無ければ既定）。 */
.sr-dot { display:inline-block; width:11px; height:11px; border-radius:50%;
  margin-right:6px; vertical-align:-1px;
  box-shadow:0 0 0 var(--sr-dot-w, 1px) var(--sr-edge, rgba(0,0,0,.30)); }

/* soge-past-admin-v1: 直せない日の見た目。押せないことが見て分かるようにする。 */
.sr-ro { opacity: .45 !important; cursor: not-allowed !important; }
.sr-ro-note { border: 1px solid #f5c6c2; background: #fce8e6; color: #a50e0e;
  border-radius: 10px; padding: 9px 11px; margin-bottom: 10px;
  font-size: 0.82rem; line-height: 1.6; }

/* soge-move-v1: ボタンが1つ増えるので、名前が縦に割れないようにする。
   ★実測で踏んだ：⇄ を足すと [到着][✎][⇄][✕] の4つになり、
     390px幅では名前の場所が足りず「青木 利／夫」と縦に割れ、住所も切れた。
     スタッフ一覧で直したのとまったく同じ崩れ方（staff-card-wrap-v1）。
   ★直し方も同じ。行を折り返せるようにし、名前の場所に下限を決める。
     入りきる行はこれまでどおり1行のまま。入らない行だけ、
     ボタンが下に落ちる。名前と住所は【絶対に割らない】。 */
.sr-stop { flex-wrap: wrap; }
.sr-info { flex: 1 1 9rem; min-width: 9rem; }
.sr-actions { margin-left: auto; }

/* soge-move-v1: 別の車へ移すボタンと、移した跡 */
.sr-mv { flex:0 0 auto; border:1px solid #dadce0; background:#fff; border-radius:10px; width:38px; height:38px;
  font-size:1rem; line-height:1; color:#5f6368; cursor:pointer; }
.sr-mv:active { background:#eef2f7; }
.sr-moved { display:block; font-size:0.66rem; line-height:1.2; color:#b26a00; margin-top:2px; }
/* 移動先えらび。★車が多い施設でも押し間違えないよう、1行1台の縦並びにする */
.sr-mvlist { display:flex; flex-direction:column; gap:6px; margin-top:8px; max-height:44vh; overflow:auto; }
.sr-mvlist button { text-align:left; border:1px solid #dadce0; background:#fff; border-radius:10px;
  padding:9px 11px; font-size:0.86rem; line-height:1.35; cursor:pointer; }
.sr-mvlist button:active { background:#eef2f7; }
.sr-mvlist .n { font-weight:800; display:block; }
.sr-mvlist .m { color:#5f6368; font-size:0.76rem; }
.sr-mvwarn { margin-top:8px; font-size:0.78rem; line-height:1.5; color:#a50e0e;
  background:#fce8e6; border:1px solid #f5c6c2; border-radius:8px; padding:8px 10px; }
.sr-panel { border:1px dashed #fed7aa; background:#fffaf5; border-radius:12px; padding:12px; margin:10px 0; }
.sr-panel .row { display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-top:8px; }
.sr-panel select, .sr-panel input[type=text], .sr-panel input[type=time] {
  border:1px solid #d6dbe3; border-radius:8px; padding:8px; font-size:0.9rem; background:#fff; }
.sr-panel select { flex:1; min-width:90px; }
.sr-lbl { font-size:0.75rem; color:#6b7280; font-weight:700; }
.sr-search { position:relative; }
.sr-search input { width:100%; }
.sr-cands { display:none; position:absolute; left:0; right:0; top:100%; z-index:50; background:#fff;
  border:1px solid #d6dbe3; border-radius:8px; margin-top:2px; max-height:190px; overflow-y:auto;
  box-shadow:0 6px 18px rgba(16,24,40,.12); }
.sr-cands.show { display:block; }
.sr-cand { padding:9px 10px; font-size:0.9rem; cursor:pointer; border-bottom:1px solid #f1f3f4; }
.sr-cand:last-child { border-bottom:none; }
.sr-picked { display:flex; align-items:center; gap:6px; background:#e6f4ea; border:1px solid #ceead6;
  color:#137333; border-radius:8px; padding:8px 10px; font-size:0.9rem; font-weight:700; }
.sr-picked .chg { margin-left:auto; color:#5f6368; font-size:0.75rem; font-weight:600; cursor:pointer; }

.sr-empty { color:#9aa3b2; font-size:0.88rem; padding:20px 6px; text-align:center; line-height:1.7; }
.sr-toast { position:fixed; left:50%; top:calc(env(safe-area-inset-top, 0px) + 12px); transform:translate(-50%,-140%); z-index:9999;
  background:#137333; color:#fff; padding:10px 16px; border-radius:10px; font-size:0.85rem; font-weight:700;
  transition:transform .22s ease, opacity .22s ease; opacity:0; pointer-events:none; max-width:min(90vw,420px);
  text-align:center; }
.sr-toast.show { transform:translate(-50%,0); opacity:1; }
.sr-toast.err { background:#c5221f; }
</style>
{% endblock %}

{% block content %}
<div class="sr-wrap">
  <div id="srToast" class="sr-toast"></div>

  <!-- soge-nav-v1: 3画面を行き来するタブ。3つとも同じ形・同じ位置に出す。
       ★「記録表」の行き先は、見ている日の【月】に合わせて JS が入れ直す
         （id="srPrint" のまま。ボタンからタブに変えただけ）。
       ★target=_blank にしない。ホーム画面から起動したアプリでは外部ブラウザが
         開いてログインが切れる（soge-print-v3 で踏んだ）。 -->
  <div class="sgnav">
    <a class="on" href="/soge/run">運行画面</a>
    <a href="/soge" onclick="spaNav(event,'/soge')">配車編集</a>
    <a id="srPrint" href="/soge/print">記録表</a>
  </div>

  <div class="sr-head">
    <div class="sr-title">運行</div>
    <div style="display:flex;gap:8px;align-items:center;">
      <input type="date" class="sr-date" id="srDate">
    </div>
  </div>

  <!-- soge-view-v1: 上下2段のタブ。順番は「見せ方」で入れ替わる -->
  <div class="sr-lock" id="srLock" style="display:none;"></div>

  <div class="sr-mode-row">
    <div class="sr-mode" id="srMode">
      <button type="button" data-mode="vehicle">車両から</button>
      <button type="button" data-mode="trip">便から</button>
      <!-- soge-drive-v1: 運転席で片手で使う見せ方 -->
      <button type="button" data-mode="drive">運転中</button>
    </div>
    <span class="sr-mode-hint" id="srModeHint"></span>
  </div>

  <div class="sr-tabs" id="srTabs"></div>
  <div class="sr-ttabs" id="srTripTabs" style="display:none;"></div>
  <div class="sr-driver" id="srDriver"></div>
  <div id="srBody"><div class="sr-empty">読み込み中…</div></div>
</div>
{% endblock %}

{% block extra_script %}
<script>
// ===== soge-run-v1 =====
(function () {
  var state = { date: '', data: null, tab: 0, tripTab: 0, autoTab: true, tabKey: '', busy: {}, staff: [], vehicles: [], patients: [],
                undo: null, doneOpen: false,   // soge-undo-v1: 直後の帯 / 済んだ人を開いているか
                mode: 'vehicle' };   // soge-view-v1: 'vehicle'=車両から / 'trip'=便から

  /* soge-view-v1: 選んだ見せ方は端末ごとに覚える。
     運転手はいつも「車両から」、送迎を組む人はいつも「便から」使うため、
     開くたびに選び直すのは手間になる。 */
  try {
    var _m = localStorage.getItem('soge_run_mode');
    // soge-drive-v1: 'drive' も許す。★ここに足し忘れると、運転手が
    //   「運転中」を選んでも、画面を開くたびに元に戻る（覚えたことにならない）。
    if (_m === 'trip' || _m === 'vehicle' || _m === 'drive') state.mode = _m;
  } catch (e) {}

  function $(id) { return document.getElementById(id); }
  function esc(s) { var d = document.createElement('div'); d.textContent = (s == null ? '' : s); return d.innerHTML; }

  var toastTimer = null;
  function toast(msg, kind) {
    var el = $('srToast');
    el.textContent = msg;
    el.className = 'sr-toast show' + (kind === 'err' ? ' err' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.className = 'sr-toast' + (kind === 'err' ? ' err' : ''); }, 2400);
  }

  function todayStr() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  async function load() {
    $('srBody').innerHTML = '<div class="sr-empty">読み込み中…</div>';
    var r = await fetch('/api/soge/run?date=' + state.date);
    var j = await r.json();
    if (j.status !== 'success') { $('srBody').innerHTML = '<div class="sr-empty">' + esc(j.message) + '</div>'; return; }
    state.data = j;
    /* ★ここで state.tab / autoTab を初期化しないこと。
       「予定時刻を計算し直す」「確定する」からも load() は呼ばれる。
       走っている最中に、運転手が開いているタブを動かしてはいけない。
       どのタブを開いていたかは state.tabKey（車のkey）で覚えて、
       render() の中で位置を引き直す。 */
    if (state.tab >= (j.vehicles || []).length) state.tab = 0;
    /* soge-undo-v1: 読み込み直したら帯は捨てる。
       ★中身が入れ替わったあとも残っていると、もう無いものを指して押せてしまう。 */
    state.undo = null;
    render();
  }

  // 打刻するたびに画面が先頭まで飛ばないように、見ていた位置を保つ
  /* base.html では本文のスクロールを .page-wrapper が持っている */
  function scrollBox() {
    return document.querySelector('.page-wrapper') || document.scrollingElement || document.body;
  }
  /* ===== soge-keepscroll-v1 : 見ていた位置を保つ =====
     ★これまで効いていなかった。base.html では本文のスクロールを
       .page-wrapper が持っているので、window.scrollY は常に 0 で、
       window.scrollTo も何も起こさない。0を読んで0に戻していただけだった。
     ★innerHTML を入れ替えると、中身の高さが一瞬 0 になる。
       そこでブラウザがスクロール位置を 0 に詰めるので、
       【中身が戻ったあと】＝次の描画でもう一度当て直す必要がある。 */
  function keepScroll(fn) {
    var sc = scrollBox();
    var y = sc.scrollTop;
    fn();
    sc.scrollTop = y;
    if (window.requestAnimationFrame) {
      requestAnimationFrame(function () { sc.scrollTop = y; });
    }
  }

  // state の中から立ち寄り1件を探す（打刻のあと、その行だけ直すため）
  function findStop(id) {
    var vs = (state.data && state.data.vehicles) || [];
    for (var i = 0; i < vs.length; i++) {
      for (var k = 0; k < (vs[i].trips || []).length; k++) {
        var ss = vs[i].trips[k].stops || [];
        for (var m = 0; m < ss.length; m++) {
          if (ss[m].id === id) return ss[m];
        }
      }
    }
    return null;
  }

  function findTrip(dayId) {
    var vs = (state.data && state.data.vehicles) || [];
    for (var i = 0; i < vs.length; i++) {
      for (var k = 0; k < (vs[i].trips || []).length; k++) {
        if (vs[i].trips[k].day_id === dayId) return vs[i].trips[k];
      }
    }
    return null;
  }

  /* ===== soge-undo-v1: 押し間違いを戻す =====
     ★新しいAPIは作らない。すでにある PUT を、値を空にして呼ぶだけ。
       別の道を作ると、片方だけ直したときに食い違う。 */

  /* 属性に入れる文字。★esc() は " を逃がさない。
     名前に " が入っていると属性が途中で切れて画面が壊れる。 */
  function escA(s) { return esc(s).replace(/"/g, '&quot;'); }

  /* その立ち寄りが、どの便のものか。帯を「その便を見ているとき」だけ出すため。
     ★別の車のタブに切り替えたとき、前の車の帯が残っていると、
       関係ない人の記録を戻してしまう。 */
  function dayIdOfStop(id) {
    var vs = (state.data && state.data.vehicles) || [];
    for (var i = 0; i < vs.length; i++) {
      for (var k = 0; k < (vs[i].trips || []).length; k++) {
        var ss = vs[i].trips[k].stops || [];
        for (var m = 0; m < ss.length; m++) {
          if (ss[m].id === id) return vs[i].trips[k].day_id;
        }
      }
    }
    return '';
  }

  async function undoStop(id, kind) {
    /* kind: 'arrive' / 'time' … 到着時刻を消す
             'absent'          … 休みを取り消す
       ★休みを取り消しても、休みにする前の到着時刻は戻らない。
         休みにした時点でサーバが消しているため。時刻は入れ直しになる。 */
    var body = (kind === 'absent') ? { stop_id: id, absent: false }
                                   : { stop_id: id, time: '' };
    var r = await fetch('/api/soge/run/stop', {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    var j = await r.json();
    if (j.status !== 'success') { toast(j.message || '戻せませんでした', 'err'); return false; }
    var s = findStop(id);
    if (s) { if (kind === 'absent') s.is_absent = false; else s.arrived_at = ''; }
    return true;
  }

  async function undoDay(id, kind) {
    var body = (kind === 'return') ? { day_id: id, returned: '' }
                                   : { day_id: id, departed: '' };
    var r = await fetch('/api/soge/run/day', {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    var j = await r.json();
    if (j.status !== 'success') { toast(j.message || '戻せませんでした', 'err'); return false; }
    var t = findTrip(id);
    if (t) { if (kind === 'return') t.returned_at = ''; else t.departed_at = ''; }
    return true;
  }

  /* 直後の帯に出す一言を覚える。★次の記録をすると、こちらに置き換わる
     （2つ前まで戻せるようにはしない。運転席で選ばせるものではない）。
     ★文は短くする。長いと帯の幅に入りきらず「…」で切れる。
       実際に「○○さん 09:07 で記…」と切れた。名前と時刻を先に置く。 */
  function setUndo(kind, id, isDay, dayId, text) {
    state.undo = { kind: kind, id: id, isDay: !!isDay, day: dayId, text: text };
  }

  // soge-trip-tab-v1: 便の種別から表示名を決める
  function tripLabel(t) {
    if (t.is_extra) return '臨時便';
    var stops = t.stops || [];
    var hasPickup  = stops.some(function (s) { return s.type === 'pickup'; });
    var hasDropoff = stops.some(function (s) { return s.type === 'dropoff'; });
    if (hasPickup && hasDropoff) return '送り便/迎え便';
    if (hasPickup)  return '迎え便';
    if (hasDropoff) return '送り便';
    return t.trip_name || '便';
  }

  // soge-view-v1: 便の並び順。臨時便は必ず最後に置く（あとから足すものなので）
  function tripOrder(lbl) {
    var o = ['迎え便', '送り便/迎え便', '送り便'];
    var i = o.indexOf(lbl);
    if (i >= 0) return i;
    return (lbl === '臨時便') ? 8 : 5;
  }

  // タブ1行分のHTML。中身が便でも車両でも同じ形なので共通にする
  /* soge-car-color-v1: 車のタブに色を塗る。
     ★選んでいるタブは【その車の色そのもの】で塗る。
       ここを青のままにすると「1号車は赤なのにタブは青」になり、
       色で見分けるという狙いが逆に濁る。
     ★選んでいないタブは左端の帯と丸だけ。全部を塗ると、
       どれを選んでいるのかが分からなくなる。 */
  function paintCarTabs(row, list) {
    row.querySelectorAll('[data-tab]').forEach(function (el, i) {
      var c = (list[i] && list[i].color_hex) || '';
      if (!c) return;
      /* soge-car-color-v4: 明るい色（白・銀など）は、しっかりした黒で縁取る。
         ★これが無いと、白い車の丸も帯も輪郭ごと消える。 */
      var e = (list[i] && list[i].color_edge) || '';
      el.style.borderLeftColor = c;
      var dot = el.querySelector('.sr-dot');
      if (dot) {
        dot.style.background = c;                 /* 丸は【いつも本当の色】 */
        if (e) {
          dot.style.setProperty('--sr-edge', e);
          dot.style.setProperty('--sr-dot-w', '1.5px');
        }
      }
      if (el.classList.contains('on')) {
        if (e) {
          /* soge-car-color-v4: 明るい色でタブを塗ると、白い画面の中で
             「いま選んでいるタブ」が分からなくなる。塗るのはやめて、
             いつもの青のままにする。車の色は左の帯と丸で伝わる。
             ★v2 はここで丸を文字色で塗っていた。白い車の丸が【黒】になり、
               黒い車と見分けがつかなくなっていた（実際に測って出た）。 */
          el.style.borderLeftColor = c;
        } else {
          el.style.background = c;
          el.style.borderColor = c;
          /* 塗った上の文字色はサーバが決めた色を使う（読めなくならないように） */
          el.style.color = (list[i].color_fg || '#fff');
          if (dot) dot.style.background = (list[i].color_fg || '#fff');
        }
      }
    });
  }

  function tabsHtml(labels, active, cls, attr) {
    return labels.map(function (lb, i) {
      return '<div class="' + cls + (i === active ? ' on' : '') + '" ' + attr + '="' + i + '">' + lb + '</div>';
    }).join('');
  }
  function tripTabLabel(t) {
    var time = t.depart ? ('<span class="sr-ttab-time">' + esc(t.depart) + '</span>') : '';
    return esc(tripLabel(t)) + time;
  }

  /* ===== soge-lock-v1: 確定バー =====
     ★確定していない日は、開くたびに配車表から作り直す（＝配車の直しがそのまま出る）。
       確定した日は、配車表を直しても変わらない。走り出したあとの事故はこれで防ぐ。
     ★打刻が始まった日は、確定していなくても自動では作り直さない。
       確定の押し忘れに備えた保険。作り直しは下のボタンから明示的に行う。 */
  /* soge-past-admin-v1: この日を直してよいか。
     ★サーバが can_edit を返す。分からないときは【直せない扱い】にする。
       古い画面が新しいサーバに当たったときに、押せてしまうより押せないほうが安全。
     ★これは【親切のため】の出し分け。守りはAPI側にある。 */
  function canEditDay() {
    var d = state.data || {};
    if (!d.past) return true;              // 今日・これからの日はこれまでどおり
    return d.can_edit === true;
  }

  /* 直せない日は、押せるものを全部止めて、理由を出す。
     ★消さずに【止める】。消すと「機能が無い」と思われる。
       止めて理由を出せば、管理者に頼めばよいと分かる。 */
  function lockEdits(root) {
    if (canEditDay()) return;
    var sel = '[data-tap],[data-pen],[data-abs],[data-mv],[data-dep],[data-ret],'
            + '[data-edit],[data-exadd],[data-exdel],#srAddExtra'    // soge-odo-off-v1
            /* soge-undo-v1: 戻すも「直す」なので、同じように止める。
               ★開け閉め([data-doneopen])は見るだけなので止めない。 */
            + ',[data-udbar],[data-uds],[data-udd]';
    root.querySelectorAll(sel).forEach(function (el) {
      el.disabled = true;
      el.classList.add('sr-ro');
      el.title = '過ぎた日の記録は管理者だけが直せます';
      el.onclick = null;
    });
    var note = document.createElement('div');
    note.className = 'sr-ro-note';
    note.innerHTML = '過ぎた日の記録です。<b>直せるのは管理者だけ</b>です。'
                   + '直したいときは管理者に依頼してください。';
    root.insertBefore(note, root.firstChild);
  }

  function renderLock() {
    var box = $('srLock');
    if (!box) return;
    var d = state.data || {};
    var locked = !!d.locked, touched = !!d.touched, past = !!d.past;
    box.style.display = 'flex';

    /* soge-drive-v1: 運転中は【状態だけ】出し、押せるボタンは出さない。
       ★「配車表から作り直す」は、打刻と臨時便がすべて消えるボタン。
         走っている最中に親指の近くへ置いてよいものではない。
       ★かといって状態を隠さない。隠すと、確定済みなのに配車を直して
         「反映されない」と悩むことになる。出す。ただし読むだけ。
       確定や作り直しをしたいときは「車両から」に切り替えてもらう。 */
    if (state.mode === 'drive') {
      box.className = 'sr-lock' + (locked || past ? ' on' : '');
      box.innerHTML = '<span class="st">'
        + (past ? '過ぎた日' : (locked ? '確定済み' : '未確定')) + '</span>'
        + '<span class="ex">確定や作り直しは「車両から」に切り替えてください。</span>';
      return;
    }
    box.className = 'sr-lock' + (locked || past ? ' on' : '');

    var h;
    if (past) {
      /* ★過ぎた日は作り直さない。実際に走った記録で、月の記録表の元にもなるため。
         soge-past-admin-v1: さらに、直せるのは管理者だけ。
         ★「直せません」で終わらせない。誰に頼めばいいかまで書く。 */
      h = '<span class="st">過ぎた日</span>'
        + '<span class="ex">この日は<b>実際に走った記録</b>です。'
        + '配車表を直しても書き換わりません。'
        + (canEditDay()
            ? '打刻の修正は各行の時刻から行えます。'
            : '<b>直せるのは管理者だけです。</b>直したいときは管理者に依頼してください。')
        + '</span>';
      box.innerHTML = h;
      return;
    }
    // soge-leave-plan-v1: 予定時刻の引き直し。休み連絡は当日の朝に入ることが多い。
    //   触るのは予定時刻だけなので、確定済みの日でも押せる。
    var replan = '<button id="srReplan">予定時刻を計算し直す</button>';
    if (locked) {
      h = '<span class="st">確定済み</span>'
        + '<button id="srUnlock">確定を解除する</button>' + replan
        + '<span class="ex">この日は配車表を直しても変わりません。'
        + '配車の変更を取り込みたいときだけ、確定を解除してください。</span>';
    } else {
      h = '<span class="st">未確定</span>'
        + '<button class="main" id="srLockBtn">この日を確定する</button>'
        + (touched ? '<button class="warn" id="srRebuild">配車表から作り直す</button>' : '')
        + replan
        + '<span class="ex">'
        + (touched
            ? 'この日はもう打刻などが入っているため、配車表を直しても自動では反映しません。'
              + '取り込むには「配車表から作り直す」を押してください（<b>打刻と臨時便は消えます</b>）。'
            : '配車表を直すと、この画面を開くたびに反映されます。'
              + '当日を走り出す前に「確定」を押すと、それ以降は変わらなくなります。')
        + '</span>';
    }
    box.innerHTML = h;

    var b1 = $('srLockBtn');
    if (b1) b1.onclick = function () { setLock(true); };
    var b2 = $('srUnlock');
    if (b2) b2.onclick = function () {
      if (!confirm('確定を解除します。\nこのあと画面を開くたびに、配車表の内容で作り直されます。\nよろしいですか。')) return;
      setLock(false);
    };
    var b3 = $('srRebuild');
    if (b3) b3.onclick = doRebuild;
    var b4 = $('srReplan');
    if (b4) b4.onclick = doReplan;
  }

  /* soge-leave-plan-v1: 休みの人を抜いた並びで、到着予定時刻を引き直す。
     ★打刻・欠席・臨時便には触らない。予定の時刻だけが変わる。 */
  async function doReplan() {
    var b = $('srReplan');
    if (b) { b.disabled = true; b.textContent = '計算中…'; }
    try {
      var r = await fetch('/api/soge/run/replan', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ date: state.date })
      });
      var j = await r.json();
      if (j.status !== 'success') { toast(j.message || '計算できませんでした', 'err'); return; }
      toast('休みの方を抜いて、予定時刻を引き直しました');
      await load();
    } catch (e) { toast('計算できませんでした', 'err'); }
    finally { if (b) { b.disabled = false; b.textContent = '予定時刻を計算し直す'; } }
  }

  async function setLock(want, ackUnassigned) {
    try {
      var r = await fetch('/api/soge/run/lock', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ date: state.date, locked: want,
                               ack_unassigned: !!ackUnassigned })   // soge-lock-unassigned-v1
      });
      var j = await r.json();
      /* soge-lock-unassigned-v1: 乗る車が決まっていない方が残っている。
         ★名前を必ず出す。人数だけだと、誰を直せばよいのか分からない。
         ★止めるだけにはしない。車が足りない日もあるので、承知したうえで
           進めるようにしておく（進めた人は確定の記録に残る）。 */
      if (j.status === 'confirm' && j.reason === 'unassigned') {
        var nm = (j.names || []);
        if (!confirm(
              'まだ乗る車が決まっていない方がいます。\n\n'
            + '　' + nm.join('、') + '（' + nm.length + '名）\n\n'
            + 'このまま確定すると、この方たちは送迎されません。\n'
            + '「配車編集」で車に移してから確定するのがおすすめです。\n\n'
            + 'それでもこのまま確定しますか。')) {
          toast('確定していません。配車編集で車に移してください', 'err');
          return;
        }
        return setLock(want, true);        // 承知したうえでもう一度
      }
      if (j.status !== 'success') { toast(j.message || '変えられませんでした', 'err'); return; }
      toast(want ? 'この日を確定しました' : '確定を解除しました');
      await load();
    } catch (e) { toast('変えられませんでした', 'err'); }
  }

  async function doRebuild() {
    if (!confirm('配車表からこの日を作り直します。\n\n★この日の打刻・欠席・臨時便は消えます。\nよろしいですか。')) return;
    try {
      var r = await fetch('/api/soge/run/rebuild', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ date: state.date })
      });
      var j = await r.json();
      if (j.status !== 'success') { toast(j.message || '作り直せませんでした', 'err'); return; }
      toast('配車表から作り直しました');
      state.tab = 0; state.tripTab = 0; state.tabKey = ''; state.autoTab = true;
      await load();
    } catch (e) { toast('作り直せませんでした', 'err'); }
  }

  // soge-view-v1: 見せ方の切り替えボタン
  function renderMode() {
    var box = $('srMode');
    if (!box) return;
    box.querySelectorAll('[data-mode]').forEach(function (b) {
      if (b.dataset.mode === state.mode) b.classList.add('on'); else b.classList.remove('on');
      b.onclick = function () {
        if (state.mode === b.dataset.mode) return;
        state.mode = b.dataset.mode;
        try { localStorage.setItem('soge_run_mode', state.mode); } catch (e) {}
        // 意味が変わるので、どちらも先頭に戻す（tabKey も持ち越さない）
        state.tab = 0; state.tripTab = 0; state.tabKey = ''; state.autoTab = true;
        render();
      };
    });
    $('srModeHint').textContent = (state.mode === 'trip')
      ? '便 → 車両 の順に選びます'
      : (state.mode === 'drive'
          ? '行き先を上から順に出します'      // soge-drive-v2
          : '車両 → 便 の順に選びます');
  }

  /* soge-unassigned-v1: 「⚠ 車が未定」を最初に開かせない。
     運転中に片手で使う画面なので、まず本物の車が出てほしい。
     ★職員が自分でそのタブを選んだときは動かさない（state.autoTab）。
     ★「車両から見る」と「便から見る」で state.tab の意味が違うので、
       それぞれの並び（vs / cars）に対して寄せること。load() で vs に対して
       やると、便から見るモードでは【別の車が選ばれる】。 */
  function skipUnassigned(list, isUn) {
    if (!state.autoTab) return;
    if (!list.length || !list[state.tab] || !isUn(list[state.tab])) return;
    for (var i = 0; i < list.length; i++) {
      if (!isUn(list[i])) { state.tab = i; return; }
    }
  }

  function render() {
    renderLock();
    renderMode();
    var vs = (state.data && state.data.vehicles) || [];
    // soge-extra-v1: 送迎がまだ無い日でも、臨時便だけは作れるようにする
    var addExtra = '<div class="sr-extra-add"><button class="sr-btn" id="srAddExtra">＋ 臨時便</button></div>';

    if (!vs.length) {
      $('srTabs').innerHTML = '';
      $('srTripTabs').style.display = 'none';
      $('srDriver').textContent = '';
      $('srBody').innerHTML =
        '<div class="sr-empty">この日の送迎はありません。<br>配車の画面で曜日の配車を保存すると、ここに出ます。</div>' + addExtra;
      bind();
      return;
    }

    var row1 = $('srTabs'), row2 = $('srTripTabs');
    var selVehicle = null, selTrip = null;   // soge-odo-off-v1: 前の便の㎞は使わない

    if (state.mode === 'trip') {
      // ===== 便から見る（soge-view-v1）=====
      //   1段目＝迎え便／送り便/迎え便／送り便／臨時便
      //   2段目＝その便を走る車両
      var labels = [];
      vs.forEach(function (v) {
        (v.trips || []).forEach(function (t) {
          var l = tripLabel(t);
          if (labels.indexOf(l) < 0) labels.push(l);
        });
      });
      labels.sort(function (a, b) { return tripOrder(a) - tripOrder(b); });
      if (state.tripTab >= labels.length) state.tripTab = labels.length - 1;
      if (state.tripTab < 0) state.tripTab = 0;
      var lbl = labels[state.tripTab];

      // その便を持っている車両だけを並べる（出ていない車は出さない）
      var cars = [];
      vs.forEach(function (v, vi) {
        (v.trips || []).forEach(function (t, ti) {
          if (tripLabel(t) === lbl) cars.push({ v: v, t: t, ti: ti });
        });
      });
      /* soge-unassigned-v1: タブは【位置】ではなく【車のkey】で覚える。
         未割当の枠は先頭に出たり消えたりするので、位置で覚えると
         load() のたびに運転手の画面が黙って別の車へずれる。
         打刻はその画面のボタンから入るので、【別の車の人に打刻が付く】。
         同じ車が同じ便を2本持つこと（臨時便）があるので便の位置も混ぜる。 */
      var ckey = function (c) { return String(c.v.key) + '#' + c.ti; };
      if (state.tabKey) {
        // ★見つからなければ、古い位置は当てにせず先頭に戻す。
        //   前に開いていた車が消えているのに位置だけ残すと、
        //   その位置にいる【別の車】が黙って選ばれる。
        var hit = -1;
        for (var q = 0; q < cars.length; q++) {
          if (ckey(cars[q]) === state.tabKey) { hit = q; break; }
        }
        state.tab = (hit >= 0) ? hit : 0;
      }
      if (state.tab >= cars.length) state.tab = 0;
      skipUnassigned(cars, function (c) { return !!c.v.unassigned; });
      state.tabKey = cars[state.tab] ? ckey(cars[state.tab]) : '';

      row1.innerHTML = tabsHtml(labels.map(function (x) { return esc(x); }), state.tripTab, 'sr-ttab', 'data-ttab');
      row1.querySelectorAll('[data-ttab]').forEach(function (el) {
        // 便を変えたら車両は先頭に戻す（前の便の3台目が、この便にあるとは限らない）
        el.onclick = function () {
          state.tripTab = Number(el.dataset.ttab); state.tab = 0;
          state.tabKey = ''; state.autoTab = true; render();
        };
      });
      /* soge-car-color-v1: 「便から見る」ときの車タブにも同じ色を出す。
         ★片方だけ色が付いていると、見比べたときに別の意味だと思われる。 */
      row2.innerHTML = tabsHtml(cars.map(function (c) {
        return ((c.v && c.v.icon_svg) || '') + esc(c.v.vehicle_name);   // soge-car-icon-v1
      }), state.tab, 'sr-tab', 'data-tab');
      row2.style.display = cars.length ? 'flex' : 'none';
      row2.querySelectorAll('[data-tab]').forEach(function (el) {
        // 自分で選んだのだから、以後は勝手に動かさない
        el.onclick = function () {
          // 自分で選んだのだから、以後は勝手に動かさない（key は render で入れ直す）
          state.tab = Number(el.dataset.tab); state.tabKey = ''; state.autoTab = false;
          keepScroll(render);
        };
      });

      var sel = cars[state.tab];
      if (sel) {
        selVehicle = sel.v;
        selTrip = sel.t;
      }
    } else {
      // ===== 車両から見る（これまでどおり。運転手はこちら）=====
      // soge-unassigned-v1: こちらも位置ではなく key で覚える（理由は上と同じ）
      if (state.tabKey) {
        var hit2 = -1;
        for (var q2 = 0; q2 < vs.length; q2++) {
          if (String(vs[q2].key) === state.tabKey) { hit2 = q2; break; }
        }
        state.tab = (hit2 >= 0) ? hit2 : 0;   // 見つからなければ先頭へ（理由は上と同じ）
      }
      if (state.tab >= vs.length) state.tab = 0;
      skipUnassigned(vs, function (v) { return !!v.unassigned; });
      state.tabKey = vs[state.tab] ? String(vs[state.tab].key) : '';
      /* soge-car-color-v1: 車のタブに色。★名前の前に丸を置き、左端に帯を引く。
         色だけに頼らない（色の見分けがつきにくい方でも、名前は名前のまま）。 */
      /* soge-car-icon-v1: 名前は黒のまま。色は車のアイコンが持つ。
         ★アイコンはサーバが組み立てたものをそのまま置く（形と色の
           組み合わせを画面側で作らない）。 */
      row1.innerHTML = tabsHtml(vs.map(function (v) {
        return (v.icon_svg || '') + esc(v.vehicle_name);
      }), state.tab, 'sr-tab', 'data-tab');
      row1.querySelectorAll('[data-tab]').forEach(function (el) {
        // soge-trip-tab-v1: 車両タブを変えたら便タブも先頭に戻す
        el.onclick = function () {
          state.tab = Number(el.dataset.tab); state.tripTab = 0;
          state.tabKey = ''; state.autoTab = false; render();   // 自分で選んだタブは動かさない
        };
      });

      selVehicle = vs[state.tab];
      var trips = (selVehicle && selVehicle.trips) || [];
      if (trips.length > 0) {
        // 範囲外なら最後のタブへ（臨時便追加後に自動で最後の便へ飛ぶために 9999 をセットすることがある）
        if (state.tripTab >= trips.length) state.tripTab = trips.length - 1;
        if (state.tripTab < 0) state.tripTab = 0;
        row2.innerHTML = tabsHtml(trips.map(tripTabLabel), state.tripTab, 'sr-ttab', 'data-ttab');
        row2.style.display = 'flex';
        row2.querySelectorAll('[data-ttab]').forEach(function (el) {
          el.onclick = function () { state.tripTab = Number(el.dataset.ttab); keepScroll(render); };
        });
        selTrip = trips[state.tripTab];
      } else {
        row2.style.display = 'none';
        row2.innerHTML = '';
      }
    }

    // soge-driver-per-trip-v1: いま開いている【便】の運転手を出す。
    //   ★これまでは車に1人しか持っていなかったので、送り便を開いても
    //     迎え便の人の名前が出ていた。
    //   ★便に名前が無いときは、これまでどおり車の側の名前に落とす。
    //     古いデータで名前が【消える】ほうが現場では困る。
    var _drv = (selTrip && selTrip.driver_name)
            || (selVehicle && selVehicle.driver_name) || '';
    /* soge-car-color-v1: 運転手の行にも、いま開いている車の色を出す。 */
    var _dv = $('srDriver');
    /* soge-driver-change-v1: 押すと、この便の運転手を替えられる。
       ★「車が未定」の枠では押せるようにしない。走らない枠なので、
         運転手を入れると走ったことになる記録が残る。 */
    var _canDrv = !!(selTrip && !selTrip.unassigned && selVehicle && !selVehicle.unassigned);
    _dv.innerHTML = selVehicle
      ? ((selVehicle.icon_svg || '')                       // soge-car-icon-v1
         + (_canDrv
             ? ('<button type="button" class="sr-drv-b" data-drv="' + escA(selTrip.day_id) + '"'
                + ' data-drvnow="' + escA(_drv) + '">'
                + esc(_drv ? ('運転手 ' + _drv) : '運転手 未設定')
                + '<span class="sr-drv-i">交代</span></button>')
             : esc(_drv ? ('運転手 ' + _drv) : '運転手 未設定')))
      : '';
    /* ★この行は srBody の外にあるので、bind() も lockEdits() も届かない。
         ここで自分で配線し、過ぎた日は自分で止める。 */
    var _db = _dv.querySelector('[data-drv]');
    if (_db) {
      if (!canEditDay()) {
        _db.disabled = true;
        _db.title = '過ぎた日の記録は管理者だけが直せます';
      } else {
        _db.onclick = function () { openDriverPanel(_db); };
      }
    }

    /* soge-drive-v1: 運転中は本文だけ差し替える。
       タブの選び方は「車両から」とまったく同じ道を通す（別に持たない）。
       ★「＋ 臨時便」は運転中には出さない。運転席で押すものではない。 */
    $('srBody').innerHTML = (state.mode === 'drive')
      /* soge-drive-v2: 道の線に使う色を渡す（soge-car-color-v1 で決めた車の色）。 */
      ? (selTrip ? driveHtml(selTrip, (selVehicle && selVehicle.color_hex) || '',
                            (selVehicle && selVehicle.color_edge) || '',
                            (selVehicle && selVehicle.color_soft) || '')
                 : '<div class="sr-empty">この車の便がありません</div>')
      : ((selTrip ? tripHtml(selTrip) : '') + addExtra);
    bind();
  }

  /* ===== soge-drive-v1: 運転中の本文 =====
     ★到着・休み・時刻直し・車の移動は、すでにある bind() が
       data-tap / data-abs / data-pen / data-mv を拾って動かしている。
       ここでも【同じ属性】を使う。配線は1行も書かない。
       別に書くと、片方だけ直したときに食い違う。 */
  function driveHtml(t, roadHex, edgeHex, softHex) {
    if (t.unassigned) {
      return '<div class="sr-dv"><div class="sr-dv-name">車が決まっていません</div>'
        + '<div class="sr-dv-note">この便に乗る車が決まっていないため、'
        + '運転中の画面には出せません。「車両から」に切り替えて、'
        + '⇄ で車に移してください。</div></div>';
    }
    /* soge-drive-v2: 道の線の色。車の色が引けないときは、これまでの青のまま。 */
    var road = roadHex || '#1a73e8';
    /* soge-car-color-v4: 明るい車の色は、うっすらの縁では道が見えない。
       サーバが「はっきりした黒が要る色か」を決めて渡してくる。 */
    var edge = edgeHex || '';
    /* soge-drive-v4: うっすら敷く地。サーバが決めた色。
       ★引けないときは何も入れない。CSS 側の既定（白）に戻るだけ。 */
    var soft = softHex || '';

    var all = (t.stops || []);
    /* お休みの人は「次の人」から外す。★ただし黙って消さない（下に名前を出す）。
       居ないことと、見落としたことは、別のこと。 */
    var off = all.filter(function (s) { return s.is_absent || s.is_leave; });
    var live = all.filter(function (s) { return !s.is_absent && !s.is_leave; });
    var leftAll = live.filter(function (s) { return !s.arrived_at; });
    var doneN = live.length - leftAll.length;
    /* 一度に出すのは4人まで。全部並べると、下の「事業所に戻る」まで遠くなる。
       ★残りの人数は必ず文字で出す（黙って隠さない）。 */
    var left = leftAll.slice(0, 4);
    var hidden = leftAll.length - left.length;

    /* soge-undo-v1: お休みの人に「戻す」を付ける。
       ★「休み連絡」(is_leave) には付けない。運転手が付けたものではないので、
         ここで消せてしまうと、連絡した側の記録を運転席から書き換えることになる。 */
    var offHtml = off.length
      ? '<div class="sr-dv-off">お休み：' + off.map(function (s) {
          return '<span class="sr-off-i">' + esc(s.user_name)
            + (s.is_absent && !s.is_leave
                ? '<button type="button" class="sr-off-u" data-uds="' + escA(s.id) + '"'
                  + ' data-udk="absent" data-udn="' + escA(s.user_name) + '" data-udt="">戻す</button>'
                : '<span class="sr-off-n">休み連絡</span>')
            + '</span>';
        }).join('') + '</div>'
      : '';

    /* soge-undo-v1: 済んだ人。ふだんは閉じておき、開くと時刻と「戻す」が並ぶ。 */
    var doneList = live.filter(function (s) { return s.arrived_at; });
    var doneHtml = doneList.length
      ? '<div class="sr-done' + (state.doneOpen ? ' open' : '') + '">'
          + '<button type="button" class="sr-done-h" data-doneopen="1">'
            + '済んだ人 ' + doneList.length + ' 人'
            + '<span class="sr-done-i">' + (state.doneOpen ? '▲ 閉じる' : '▼ 開く') + '</span>'
          + '</button>'
          + (state.doneOpen
              ? '<div class="sr-done-b">' + doneList.map(function (s) {
                  return '<div class="sr-done-r">'
                    + '<span class="n">' + esc(s.user_name) + '</span>'
                    + '<span class="t">' + esc(s.arrived_at) + '</span>'
                    + '<button type="button" data-uds="' + escA(s.id) + '" data-udk="arrive"'
                      + ' data-udn="' + escA(s.user_name) + '"'
                      + ' data-udt="' + escA(s.arrived_at) + '">戻す</button>'
                    + '</div>';
                }).join('') + '</div>'
              : '')
        + '</div>'
      : '';

    /* soge-undo-v1: 押した直後の帯。★その便を見ているときだけ出す。
       別の車のタブに切り替えたら出さない（関係ない人の記録を戻さないため）。 */
    var _u = state.undo;
    var undoHtml = (_u && _u.day === t.day_id)
      ? '<div class="sr-undo">'
          + '<span class="sr-undo-t">' + esc(_u.text) + '</span>'
          + '<button type="button" class="sr-undo-go" data-udbar="go">戻す</button>'
          + '<button type="button" class="sr-undo-x" data-udbar="x" title="閉じる">✕</button>'
        + '</div>'
      : '';

    /* --- 見出し（この便と、残り／到着の人数） --- */
    var head = '<div class="sr-nv-head">'
      + '<span class="sr-type ' + ((t.stops || [])[0] || {}).type + '">'
        + (((t.stops || [])[0] || {}).type === 'dropoff' ? '送' : '迎') + '</span>'
      + '<span>' + esc(tripLabel(t)) + '</span>'
      + '<span class="cnt">残り ' + leftAll.length + ' 人／到着 ' + doneN + ' 人</span>'
      + '</div>';

    /* --- 出発（いちばん上の地点） ---
       ★記録表の「出発時刻」はこれが入る。押し忘れると紙が埋まらないので、
         まだなら押すところを大きく出す。押したあとは灰色の帯で残す
         （消すと「押したか分からない」になる）。 */
    var depNode = t.departed_at
      /* soge-undo-v1: 押し間違えた出発を消せるようにする。★確認を出してから消す。 */
      ? '<div class="sr-nd past"><div class="sr-pl dep done">'
          + '<span class="nm">事業所を出発</span>'
          + '<span class="tm">' + esc(t.departed_at) + '</span>'
          + '<button type="button" class="sr-pl-u" data-udd="' + escA(t.day_id) + '"'
            + ' data-udk="depart" data-udt="' + escA(t.departed_at) + '">戻す</button>'
          + '</div></div>'
      /* soge-drive-v3: 板そのものを押す。★data-dep は変えない
         （押したときの動きは、すでにある bind() がそのまま拾う）。 */
      : '<div class="sr-nd now">'
          + '<button type="button" class="sr-pl dep go" data-dep="' + t.day_id + '">'
            + '<span class="nm">事業所を出発</span>'
            + (t.depart ? '<span class="tm">予定 ' + esc(t.depart) + '</span>' : '')
            + '<span class="go-i">▶</span>'
          + '</button></div>';

    /* --- 立ち寄り先を、上から順に並べる --- */
    var stopsHtml = left.map(function (s, i) {
      var tag = (s.is_wheelchair ? '<span class="tag">車いす</span>' : '');
      var tm  = (s.planned_at ? '<span class="tm">' + esc(s.planned_at) + '</span>' : '');
      if (i > 0) {
        /* 先の人。板だけ。★名前は割らない。住所は詰める（下見なので全部は要らない）。 */
        /* soge-drive-v5: 先の人は灰色。緑は「いま向かう人」だけにする。 */
        return '<div class="sr-nd later">'
          + '<div class="sr-pl later"><span class="nm">' + esc(s.user_name) + '</span>'
            + tag + tm + '</div>'
          + (s.address ? '<div class="sr-nvs">' + esc(s.address) + '</div>' : '')
          + '</div>';
      }
      /* いま向かう人。ここだけ大きく、住所は切らずに号室まで出す。 */
      return '<div class="sr-nd now">'
        + '<div class="sr-pl big"><span class="nm">' + esc(s.user_name) + '</span>'
          + tag + (s.planned_at ? '<span class="tm">予定 ' + esc(s.planned_at) + '</span>' : '')
        + '</div>'
        + '<div class="sr-nvb">'
          + (s.address ? '<div class="sr-nva">' + esc(s.address) + '</div>'
                       : '<div class="sr-nva none">住所が登録されていません</div>')
          + mvHtml(s)
          + '<button class="sr-dv-tap" data-tap="' + s.id + '">到着</button>'
          + '<div class="sr-dv-sub">'
            + '<button data-abs="' + s.id + '">お休みだった</button>'
            + '<button data-pen="' + s.id + '" data-init="' + esc(s.planned_at || '') + '">時刻を手で</button>'
            + '<button data-mv="' + s.id + '">別の車へ</button>'
          + '</div>'
        + '</div></div>';
    }).join('');

    if (hidden > 0) {
      stopsHtml += '<div class="sr-nd later"><div class="sr-pl later">'
        + '<span class="nm">ほか ' + hidden + ' 人</span></div></div>';
    }

    /* --- 事業所へ戻る（終点） ---
       ★勝手に次の便へ動かさない。別の人に打刻が付く事故のもとになる。
         全員おわるまでは押せるものを出さず、何をすればよいかを文字で出す。 */
    var goal;
    if (t.returned_at) {
      goal = '<div class="sr-nd goal past"><div class="sr-pl dep done">'
        + '<span class="nm">事業所に帰着</span>'
        + '<span class="tm">' + esc(t.returned_at) + '</span>'
        /* soge-undo-v1: 押し間違えた帰着を消せるようにする。 */
        + '<button type="button" class="sr-pl-u" data-udd="' + escA(t.day_id) + '"'
          + ' data-udk="return" data-udt="' + escA(t.returned_at) + '">戻す</button>'
        + '</div></div>';
    } else if (leftAll.length) {
      goal = '<div class="sr-nd goal"><div class="sr-pl dep wait">'
        + '<span class="nm">事業所に戻る</span></div></div>';
    } else {
      /* soge-drive-v3: ここも板そのものを押す。文字は「事業所に戻った」に
         そろえる（押したら記録が付く、と読めるように）。
         ★説明は板の【下】に置く。上に置くと、押すところが下がって遠くなる。 */
      goal = '<div class="sr-nd goal now">'
        + '<button type="button" class="sr-pl dep go hasnote" data-ret="' + t.day_id + '">'
          + '<span class="nm">事業所に戻った</span><span class="go-i">▶</span>'
        + '</button>'
        + '<div class="sr-nvb"><div class="sr-dv-note">'
          + (live.length ? ('この便は全員おわりました（到着 ' + doneN + ' 人）。')
                         : 'この便に立ち寄りはありません。')
          + '<br>次の便に行くときは、上の便のタブを押してください。</div>'
        + '</div></div>';
    }

    /* soge-undo-v1: 帯と「済んだ人」は帯の上（見出しのすぐ下）に置く。
       ★道の帯の中には入れない。中に入れると立ち寄り先と同じ並びに見えて、
         行き先だと読み違える。 */
    return '<div class="sr-dv">' + head + undoHtml + doneHtml
      /* soge-car-color-v4: 道と地点の縁の色も一緒に渡す。
         ★白い車だと、うっすらの縁では道そのものが見えない。 */
      + '<div class="sr-nv" style="--sr-road:' + road
        + (edge ? ';--sr-edge:' + edge : '')
        + (soft ? ';--sr-soft:' + soft : '')      /* soge-drive-v4: うっすら敷く地 */
        + '">'
        + depNode + stopsHtml + goal
      + '</div>' + offHtml + '</div>';
  }

  function tripHtml(t) {
    /* soge-unassigned-v1: 乗る車が決まっていない人。
       出発・帰着・到着打刻は【出さない】。走らないので押しようがなく、
       押せてしまうと「走ったことになった記録」が残る。
       ここに出す目的は、運転手・職員が乗せ忘れに気づくこと。 */
    if (t.unassigned) {
      var un = (t.stops || []).map(function (s) {
        return '<div class="sr-stop">' +
          '<span class="sr-type ' + s.type + '">' + (s.type === 'pickup' ? '迎' : '送') + '</span>' +
          '<div class="sr-info">' +
            '<span class="sr-name">' + esc(s.user_name) +
              (s.is_wheelchair ? '<span class="sr-tag">車いす</span>' : '') +
              (s.is_leave ? '<span class="sr-tag leave">休み連絡</span>' : '') +
            '</span>' +
            (s.address ? '<span class="sr-addr">' + esc(s.address) + '</span>' : '') +
            mvHtml(s) +
          '</div>' +
          /* soge-move-v1: ★ここから車へ移すのが、いちばん要る操作。
             「車が未定」のまま走り出すと、その人は誰にも運ばれない。 */
          '<div class="sr-actions">' +
            '<button class="sr-mv" data-mv="' + s.id + '" title="車に乗せる">⇄</button>' +
          '</div>' +
        '</div>';
      }).join('');
      return '<div class="sr-trip unassigned">' +
        '<div class="sr-trip-head">' + esc(tripLabel(t)) +
          '<span class="sr-trip-time">車が決まっていません</span></div>' +
        '<div class="sr-trip-body">' +
          '<div class="sr-unassigned-note">この人まだ乗る車が決まっていません。' +
            '配車の画面で乗る車を決めてください。</div>' +
          (un || '<div class="sr-empty">立ち寄りなし</div>') +
        '</div>' +
      '</div>';
    }

    var stops = (t.stops || []).map(function (s, i) {
      // soge-leave-v1: 休み連絡が入っている方は「お休み」として出す。
      //   ★手で付けた欠席（✕）とは別に持つ。連絡が取り消されたら自動で戻る。
      var off = s.is_absent || s.is_leave;
      var cls = 'sr-stop' + (off ? ' absent' : (s.arrived_at ? ' done' : ''));
      // 打刻がまだの人にも、あとから時刻を手で入れられるように ✎ を出す
      // （運転手が走り終わってからまとめて入力する場合がある）
      var right = off
        ? '<span class="sr-time" style="background:#f6f7f9;border-color:#e6e8ec;color:#9aa0a6;">'
            + (s.is_leave && !s.is_absent ? 'お休み' : '休み') + '</span>'
        : (s.arrived_at
            ? '<span class="sr-time" data-edit="' + s.id + '" title="タップで時刻を直す">' + esc(s.arrived_at) + '</span>'
            : '<button class="sr-tap" data-tap="' + s.id + '">到着</button>' +
              '<button class="sr-pen" data-pen="' + s.id + '" data-init="' + esc(s.planned_at || '') + '" title="時刻を手で入れる">✎</button>');

      // soge-layout-v2: 名前(sr-info)とボタン(sr-actions)を分離して名前が縦にならないようにする
      return '<div class="sr-stop ' + cls + '">' +
        '<span class="sr-seq">' + (i + 1) + '</span>' +
        '<span class="sr-type ' + s.type + '">' + (s.type === 'pickup' ? '迎' : '送') + '</span>' +
        '<div class="sr-info">' +
          '<span class="sr-name">' + esc(s.user_name) +
            (s.is_wheelchair ? '<span class="sr-tag">車いす</span>' : '') +
            (s.is_leave ? '<span class="sr-tag leave">休み連絡</span>' : '') +
          '</span>' +
          (s.address ? '<span class="sr-addr">' + esc(s.address) + '</span>' : '') +
          (s.planned_at ? '<span class="sr-plan">予定 ' + esc(s.planned_at) + '</span>' : '') +
          mvHtml(s) +
        '</div>' +
        '<div class="sr-actions">' +
          right +
          '<button class="sr-mv" data-mv="' + s.id + '" title="別の車へ移す">⇄</button>' +
          '<button class="sr-x' + (s.is_absent ? ' on' : '') + '" data-abs="' + s.id + '" title="休み">✕</button>' +
        '</div>' +
      '</div>';
    }).join('');

    // soge-note-v1: 出発と帰着。記録表の「出発時刻／到着時刻」はこれが入る。
    var dep = t.departed_at
      ? '<button class="sr-ret-btn done" disabled>出発 ' + esc(t.departed_at) + '</button>'
      : '<button class="sr-ret-btn" data-dep="' + t.day_id + '">事業所を出発</button>';
    var ret = t.returned_at
      ? '<button class="sr-ret-btn done" disabled>帰着 ' + esc(t.returned_at) + '</button>'
      : '<button class="sr-ret-btn" data-ret="' + t.day_id + '">事業所に戻った</button>';

    // soge-extra-v1: 臨時便は色を変え、取り消しと利用者追加を付ける
    // soge-trip-tab-v1: 便名は tripLabel() で統一（trip_name の代わりに種別から決定）
    var head = '<div class="sr-trip-head">' +
      (t.is_extra ? '<span class="sr-badge-extra">臨時</span>' : '') +
      esc(tripLabel(t)) +
      '<span class="sr-trip-time">' + esc(t.depart || '') + ' 出発予定</span>' +
      (t.is_extra
        ? '<span style="margin-left:auto;display:flex;gap:6px;">' +
            '<button class="sr-mini" data-exadd="' + t.day_id + '">＋ 利用者</button>' +
            '<button class="sr-mini del" data-exdel="' + t.day_id + '">取消</button>' +
          '</span>'
        : '') +
      '</div>';

    return '<div class="sr-trip' + (t.is_extra ? ' extra' : '') + '">' + head +
      '<div class="sr-trip-body">' +
        '<div class="sr-return" style="justify-content:flex-start;margin:0 0 8px;">' + dep + '</div>' +
        (stops || '<div class="sr-empty">立ち寄りなし</div>') +
        '<div class="sr-return">' + ret + '</div>' +
      '</div>' +
    '</div>';
  }

  /* soge-move-v1: 移した跡を、その人の行に出す。
     ★あとで記録表を見た人が「なぜこの車なのか」を追えるようにする。 */
  function mvHtml(s) {
    if (!s.moved_from) return '';
    return '<span class="sr-moved">' + esc(s.moved_from) + ' から移動'
      + (s.moved_at ? '（' + esc(s.moved_at) + (s.moved_by ? ' ' + esc(s.moved_by) : '') + '）' : '')
      + '</span>';
  }

  /* その日の「移せる先」を集める。
     ★「車が未定」は走らない枠なので、移す先には出さない。
     ★いま居る便も出さない（そこへ移す意味が無い）。 */
  function moveTargets(curDayId) {
    var out = [];
    ((state.data && state.data.vehicles) || []).forEach(function (v) {
      if (v.unassigned) return;
      (v.trips || []).forEach(function (t) {
        if (t.unassigned) return;
        if (String(t.day_id) === String(curDayId)) return;
        var live = (t.stops || []).filter(function (x) { return !x.is_absent && !x.is_leave; });
        out.push({
          day_id: t.day_id,
          name: v.vehicle_name || '',
          trip: tripLabel(t),
          extra: !!t.is_extra,
          driver: t.driver_name || '',
          depart: t.depart || '',
          n: live.length
        });
      });
    });
    return out;
  }

  /* ===== soge-driver-change-v1: 運転手を替えるパネル =====
     ★選ぶだけにする。手で打てるようにしない。打つと表記ゆれ（田中／田中 太郎）
       が記録表に残り、あとで名寄せできない。
     ★いま入っている名前が職員名簿に無いときは、それも選べるように足す。
       退職した人の名前が入っている便を開いたとき、勝手に消えないように。 */
  function openDriverPanel(btn) {
    if (document.querySelector('.sr-panel')) return;
    var dayId = btn.dataset.drv;
    var cur = btn.dataset.drvnow || '';

    var list = (state.staff || []).slice();
    if (cur && list.indexOf(cur) < 0) list.unshift(cur);   // ★いまの名前は必ず残す
    var opts = list.map(function (n) {
      return '<option value="' + escA(n) + '"' + (n === cur ? ' selected' : '') + '>'
        + esc(n) + '</option>';
    }).join('');

    var box = document.createElement('div');
    box.className = 'sr-panel';
    box.innerHTML =
      '<div style="font-weight:800;font-size:0.95rem;">運転手を替える</div>'
      + '<div class="sr-drvp-n">替わるのは<b>いま開いている便だけ</b>です。'
      + 'ほかの便と、来週からの配車は変わりません。<br>'
      + '空にしたいときは「記録表」から。</div>'
      + '<div class="row">'
        /* ★ここに「未設定」は置かない。置くと嘘になる。
             この画面は、便に運転手が入っていないと【車の側の名前】に落とす
             （soge-driver-per-trip-v1 のつくり）。だから空にしても、同じ車の
             別の便の人の名前が出てしまう。「未設定にしたのに名前が出る」と
             見えるくらいなら、はじめから選ばせない。
           ★空にしたいときは記録表からできる（あちらは落とさずそのまま出す）。 */
        + '<select class="drv2">'
        + (cur ? '' : '<option value="" disabled selected>選んでください</option>')
        + opts + '</select>'
      + '</div>'
      + '<div class="row" style="margin-top:10px;">'
        + '<button class="sr-tap ok" style="min-width:80px;">替える</button>'
        + '<button class="sr-mini no">やめる</button>'
      + '</div>';
    btn.parentNode.appendChild(box);

    box.querySelector('.no').onclick = function () { box.remove(); };
    box.querySelector('.ok').onclick = async function () {
      var nm = box.querySelector('.drv2').value || '';
      if (!nm) { toast('運転手を選んでください', 'err'); return; }
      if (nm === cur) { box.remove(); return; }            // 何も変えていない
      var key = 'drv' + dayId;
      if (state.busy[key]) return;
      state.busy[key] = true;
      this.disabled = true;
      try {
        var r = await fetch('/api/soge/run/day', {
          method: 'PUT', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ day_id: dayId, driver_name: nm })
        });
        var j = await r.json();
        if (j.status !== 'success') {
          toast(j.message || '替えられませんでした', 'err');
          this.disabled = false;
          return;
        }
        /* 全部読み直すと画面が先頭に飛ぶので、その便だけ直す。 */
        var t = findTrip(dayId);
        if (t) t.driver_name = nm;
        box.remove();
        toast('運転手を ' + nm + ' さんに替えました');
        keepScroll(render);
      } finally { state.busy[key] = false; }
    };
  }

  function openMovePanel(btn, stopId) {
    if (document.querySelector('.sr-panel')) return;
    var st = findStop(stopId);
    if (!st) { toast('対象が見つかりません', 'err'); return; }
    var who = st.user_name || 'この方';
    var list = moveTargets(st.day_id);

    var box = document.createElement('div');
    box.className = 'sr-panel';
    var d = state.data || {};
    /* ★確定済み・過ぎた日は【記録の書き換え】になる。先に、押す前に伝える。 */
    var warn = (d.locked || d.past)
      ? '<div class="sr-mvwarn">この日は' + (d.past ? '<b>過ぎた日</b>' : '<b>確定済み</b>')
        + 'です。実際に走った<b>記録を書き換える</b>ことになります。'
        + '<br>移した場合、<b>いつ・誰が・どこから移したか</b>が記録に残ります。</div>'
      : '';
    box.innerHTML =
      '<div style="font-weight:800;font-size:0.95rem;">' + esc(who) + ' さんを別の車へ移す</div>'
      + '<div style="font-size:0.78rem;color:#5f6368;margin-top:4px;">'
      + '移す先を選んでください。移した人は、その便の<b>いちばん最後</b>に入ります。</div>'
      + warn
      + (list.length
          ? '<div class="sr-mvlist">' + list.map(function (x, i) {
              return '<button data-i="' + i + '">'
                + '<span class="n">' + esc(x.name) + (x.extra ? '（臨時）' : '') + '</span>'
                + '<span class="m">' + esc(x.trip)
                + (x.depart ? ' ' + esc(x.depart) + '出発' : '')
                + (x.driver ? ' ／ ' + esc(x.driver) : '')
                + ' ／ 今 ' + x.n + '人</span>'
                + '</button>';
            }).join('') + '</div>'
          : '<div class="sr-mvwarn">この日には、移せる車がほかにありません。</div>')
      + '<div class="row" style="margin-top:10px;"><button class="sr-mini no">やめる</button></div>';

    var host = btn.closest('.sr-trip') || btn.closest('.sr-stop');
    host.appendChild(box);
    box.scrollIntoView({ block: 'nearest', behavior: 'smooth' });

    box.querySelector('.no').onclick = function () { box.remove(); };
    box.querySelectorAll('[data-i]').forEach(function (el) {
      el.onclick = async function () {
        var x = list[Number(el.dataset.i)];
        if (!confirm(who + ' さんを\n' + x.name + '（' + x.trip + '）へ移します。\n'
                     + ((d.locked || d.past) ? '★この日の記録を書き換えます。\n' : '')
                     + 'よろしいですか。')) return;
        el.disabled = true;
        try {
          var r = await fetch('/api/soge/run/move', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ stop_id: stopId, to_day_id: x.day_id, confirm: true })
          });
          var j = await r.json();
          if (j.status !== 'success') { toast(j.message || '移せませんでした', 'err'); el.disabled = false; return; }
          box.remove();
          /* ★予定時刻を消したことを黙っていない。次にすることも一緒に言う。 */
          toast(who + ' さんを ' + x.name + ' へ移しました'
                + (j.replan ? '（到着予定は消えました。「予定時刻を計算し直す」で入れ直せます）' : ''));
          if (j.warn) setTimeout(function () { toast(j.warn, 'err'); }, 2600);
          await load();
        } catch (e) {
          toast('移せませんでした', 'err');
          el.disabled = false;
        }
      };
    });
  }

  function bind() {
    var root = $('srBody');
    /* soge-past-admin-v1: 先に止める。あとから onclick を付け直されないよう、
       ここで止めてから、下の配線を通す（下の配線は disabled を見ない）。 */
    lockEdits(root);

    // 到着の打刻。押した瞬間にボタンを止めるので、2度押ししても2回飛ばない。
    // サーバ側でも「すでに時刻が入っていたら上書きしない」を守っている。
    root.querySelectorAll('[data-tap]').forEach(function (el) {
      el.onclick = async function () {
        var id = el.dataset.tap;
        if (state.busy[id]) return;
        state.busy[id] = true;
        el.disabled = true; el.textContent = '…';
        try {
          var r = await fetch('/api/soge/run/arrive', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ stop_id: id })
          });
          var j = await r.json();
          if (j.status !== 'success') {
            toast(j.message || '打刻できませんでした', 'err');
            el.disabled = false; el.textContent = '到着';
            return;
          }
          // 全部読み直すと画面が先頭に飛ぶので、その行だけ直す
          var s = findStop(id);
          if (j.already) {
            toast('すでに ' + j.arrived_at + ' で記録済みです');
          } else {
            toast(j.arrived_at + ' で記録しました');
            /* soge-undo-v1: 押し間違いはここで気づくことが多い。すぐ戻せるように帯を出す。
               ★2度押し(already)のときは出さない。何も新しく起きていない。 */
            setUndo('arrive', id, false, dayIdOfStop(id),
                    ((s && s.user_name) || '') + ' ' + j.arrived_at + ' を記録');
          }
          if (s) { s.arrived_at = j.arrived_at; s.is_absent = false; }
          keepScroll(render);
        } finally {
          state.busy[id] = false;
        }
      };
    });

    // 時刻を手で入れる／直す。押した要素をその場で時刻入力に差し替える。
    function openTimeEditor(el, id, initial) {
      var inp = document.createElement('input');
      inp.type = 'time';
      inp.className = 'sr-timeedit';
      inp.value = initial || '';
      el.replaceWith(inp);
      inp.focus();
      var done = false;
      async function commit() {
        if (done) return;
        done = true;
        var t = inp.value;
        if (!t) { keepScroll(render); return; }
        var r = await fetch('/api/soge/run/stop', {
          method: 'PUT', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ stop_id: id, time: t })
        });
        var j = await r.json();
        if (j.status !== 'success') {
          toast(j.message || '記録できませんでした', 'err');
        } else {
          toast(t + ' で記録しました');
          var s = findStop(id);
          /* soge-undo-v1: 手で入れた時刻も戻せるようにする。 */
          setUndo('time', id, false, dayIdOfStop(id),
                  ((s && s.user_name) || '') + ' ' + t + ' を記録');
          if (s) { s.arrived_at = t; s.is_absent = false; }
        }
        keepScroll(render);
      }
      inp.onchange = commit;
      inp.onblur = commit;
    }

    // 記録した時刻をタップすると直せる
    root.querySelectorAll('[data-edit]').forEach(function (el) {
      el.onclick = function () { openTimeEditor(el, el.dataset.edit, el.textContent.trim()); };
    });

    // まだ打刻していない人に、時刻を手で入れる（初期値は到着予定）
    root.querySelectorAll('[data-pen]').forEach(function (el) {
      el.onclick = function () {
        var id = el.dataset.pen;
        var init = el.dataset.init || '';
        var tap = el.parentNode.querySelector('[data-tap="' + id + '"]');
        if (tap) tap.remove();
        openTimeEditor(el, id, init);
      };
    });

    // 休み（その日の送迎から外すだけ。実績や請求には触らない）
    root.querySelectorAll('[data-mv]').forEach(function (el) {   // soge-move-v1
      el.onclick = function () { openMovePanel(el, el.dataset.mv); };
    });

    root.querySelectorAll('[data-abs]').forEach(function (el) {
      el.onclick = async function () {
        var id = el.dataset.abs;
        if (state.busy[id]) return;
        var on = el.classList.contains('on');
        if (!on && !confirm('この方を休みにしますか？（その日の送迎から外します）')) return;
        state.busy[id] = true;
        try {
          var r = await fetch('/api/soge/run/stop', {
            method: 'PUT', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ stop_id: id, absent: !on })
          });
          var j = await r.json();
          if (j.status !== 'success') { toast(j.message || '変更できませんでした', 'err'); return; }
          toast(on ? '休みを取り消しました' : '休みにしました');
          var s = findStop(id);
          /* soge-undo-v1: 休みにしたときだけ帯を出す（取り消しは戻す対象ではない）。 */
          if (!on) {
            setUndo('absent', id, false, dayIdOfStop(id),
                    ((s && s.user_name) || '') + ' を休みに');
          } else if (state.undo && state.undo.id === id) {
            state.undo = null;
          }
          if (s) { s.is_absent = !on; if (!on) s.arrived_at = ''; }
          keepScroll(render);
        } finally {
          state.busy[id] = false;
        }
      };
    });

    // 出発（soge-note-v1）
    root.querySelectorAll('[data-dep]').forEach(function (el) {
      el.onclick = async function () {
        var id = el.dataset.dep;
        if (state.busy['d' + id]) return;
        state.busy['d' + id] = true;
        el.disabled = true;
        try {
          var r = await fetch('/api/soge/run/depart', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ day_id: id })
          });
          var j = await r.json();
          if (j.status !== 'success') {
            toast(j.message || '記録できませんでした', 'err');
            el.disabled = false;
            return;
          }
          toast('出発 ' + j.departed_at);
          /* soge-undo-v1: 2度押し(already)のときは出さない。何も新しく起きていない。 */
          if (!j.already) setUndo('depart', id, true, id, '出発 ' + j.departed_at + ' を記録');
          var t = findTrip(id);
          if (t) t.departed_at = j.departed_at;
          keepScroll(render);
        } finally {
          state.busy['d' + id] = false;
        }
      };
    });

    // 帰着
    root.querySelectorAll('[data-ret]').forEach(function (el) {
      el.onclick = async function () {
        var id = el.dataset.ret;
        if (state.busy[id]) return;
        state.busy[id] = true;
        el.disabled = true;
        try {
          var r = await fetch('/api/soge/run/return', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ day_id: id })
          });
          var j = await r.json();
          if (j.status !== 'success') {
            toast(j.message || '記録できませんでした', 'err');
            el.disabled = false;
            return;
          }
          toast('帰着 ' + j.returned_at);
          if (!j.already) setUndo('return', id, true, id, '帰着 ' + j.returned_at + ' を記録');
          var t = findTrip(id);
          if (t) t.returned_at = j.returned_at;
          keepScroll(render);
        } finally {
          state.busy[id] = false;
        }
      };
    });

    // ---- soge-extra-v1: 臨時便 ----
    var addBtn = document.getElementById('srAddExtra');    // ---- soge-undo-v1: 戻す ----
    /* 済んだ人の開け閉め。開いているかは state に持つ（描き直しても閉じない）。 */
    root.querySelectorAll('[data-doneopen]').forEach(function (el) {
      el.onclick = function () { state.doneOpen = !state.doneOpen; keepScroll(render); };
    });

    /* 直後の帯。★ここだけ確認を出さない。
       押し間違いに気づいた瞬間の操作なので、もう一手間かけさせるのは邪魔。 */
    root.querySelectorAll('[data-udbar]').forEach(function (el) {
      el.onclick = async function () {
        if (el.dataset.udbar === 'x') { state.undo = null; keepScroll(render); return; }
        var u = state.undo;
        if (!u) return;
        var key = 'u' + u.id;
        if (state.busy[key]) return;
        state.busy[key] = true;
        el.disabled = true;
        try {
          var ok = u.isDay ? await undoDay(u.id, u.kind) : await undoStop(u.id, u.kind);
          if (!ok) { el.disabled = false; return; }
          toast('戻しました');
          state.undo = null;
          keepScroll(render);
        } finally { state.busy[key] = false; }
      };
    });

    /* 一覧の中の「戻す」（済んだ人・お休みの人）。
       ★いつでも押せる場所にあるので、名前と時刻を出して確認する。 */
    root.querySelectorAll('[data-uds]').forEach(function (el) {
      el.onclick = async function () {
        var id = el.dataset.uds, kind = el.dataset.udk;
        var nm = el.dataset.udn || '', tm = el.dataset.udt || '';
        var q = (kind === 'absent')
          ? (nm + 'さんの「休み」を取り消しますか？')
          : (nm + 'さん ' + tm + ' の到着を消しますか？');
        if (!confirm(q)) return;
        var key = 'u' + id;
        if (state.busy[key]) return;
        state.busy[key] = true;
        el.disabled = true;
        try {
          if (!await undoStop(id, kind)) { el.disabled = false; return; }
          toast('戻しました');
          if (state.undo && state.undo.id === id) state.undo = null;
          keepScroll(render);
        } finally { state.busy[key] = false; }
      };
    });

    /* 出発・帰着の板の中の「戻す」。
       ★消したあと押し直すと【そのときの時刻】が入る。元の時刻には戻らない。
         なので、消す前に必ず元の時刻を見せて聞く。 */
    root.querySelectorAll('[data-udd]').forEach(function (el) {
      el.onclick = async function () {
        var id = el.dataset.udd, kind = el.dataset.udk, tm = el.dataset.udt || '';
        var q = (kind === 'return' ? '帰着 ' : '出発 ') + tm + ' の記録を消しますか？'
              + '\n（消したあと押し直すと、そのときの時刻が入ります）';
        if (!confirm(q)) return;
        var key = 'u' + id + kind;
        if (state.busy[key]) return;
        state.busy[key] = true;
        el.disabled = true;
        try {
          if (!await undoDay(id, kind)) { el.disabled = false; return; }
          toast('戻しました');
          if (state.undo && state.undo.id === id) state.undo = null;
          keepScroll(render);
        } finally { state.busy[key] = false; }
      };
    });


    if (addBtn) addBtn.onclick = function () { openExtraPanel(addBtn); };

    root.querySelectorAll('[data-exdel]').forEach(function (el) {
      el.onclick = async function () {
        if (!confirm('この臨時便を取り消しますか？（打刻も消えます）')) return;
        var r = await fetch('/api/soge/run/extra', {
          method: 'DELETE', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ day_id: el.dataset.exdel })
        });
        var j = await r.json();
        if (j.status !== 'success') { toast(j.message || '取り消せませんでした', 'err'); return; }
        toast('臨時便を取り消しました');
        await load();
      };
    });

    root.querySelectorAll('[data-exadd]').forEach(function (el) {
      el.onclick = function () { openAddToExtra(el, el.dataset.exadd); };
    });
  }

  // ---------- soge-extra-v1: 利用者の検索（記録入力と同じやり方） ----------
  function toKata(s) { return s.replace(/[ぁ-ゖ]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) + 0x60); }); }
  function toHira(s) { return s.replace(/[ァ-ヶ]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0x60); }); }

  function searchPatients(q) {
    q = (q || '').trim();
    if (!q) return [];
    var ql = q.toLowerCase(), qk = toKata(q), qh = toHira(q);
    return state.patients.filter(function (p) {
      var n = p.user_name || '', k = p.user_kana || '', no = String(p.patient_number || '');
      return n.indexOf(q) >= 0 || n.toLowerCase().indexOf(ql) >= 0 ||
             k.indexOf(q) >= 0 || k.indexOf(qk) >= 0 || k.indexOf(qh) >= 0 ||
             no.indexOf(q) >= 0;
    }).slice(0, 30);
  }

  function uuid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
      var r = Math.random() * 16 | 0;
      return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
    });
  }

  // 検索欄＋「登録のない方」を1つの部品にまとめる。臨時便の新規でも追加でも使う。
  function personPicker(box) {
    box.insertAdjacentHTML('beforeend',
