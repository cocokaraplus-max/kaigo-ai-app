{% extends "base.html" %}
{% block title %}ケース記録 - TASUKARU{% endblock %}
{% block nav_history %}active{% endblock %}

{% block content %}
<div class="page-title" style="display:flex; justify-content:space-between; align-items:center; position:relative;">
    <div style="display:flex; align-items:center; gap:8px;">
        <span class="material-symbols-outlined">folder_open</span>
        ケース記録
    </div>
    <button type="button" onclick="toggleGearMenu(event)"
        style="background:#f1f3f4; border:none; border-radius:50%; width:36px; height:36px;
               display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0;">
        <span class="material-symbols-outlined" style="font-size:20px; color:#5f6368;">settings</span>
    </button>
    <div id="gearMenu" style="display:none; position:absolute; top:46px; right:0;
        background:#fff; border:1.5px solid #e0e0e0; border-radius:12px;
        box-shadow:0 4px 16px rgba(0,0,0,0.1); z-index:1000; min-width:200px; padding:6px;">
        <a href="/monitoring"
           style="display:flex; align-items:center; gap:10px; padding:10px 12px;
                  color:#202124; text-decoration:none; font-size:0.88rem; border-radius:8px;">
            <span class="material-symbols-outlined" style="color:#1a73e8; font-size:20px;">description</span>
            AI書類作成（月次）
        </a>
    </div>
</div>

<!-- 日付選択 -->
<div style="display:flex; align-items:center; gap:10px; margin-bottom:1rem;">
    <button onclick="changeDate(-1)" style="background:#f1f3f4; border:none; border-radius:50%; width:36px; height:36px; cursor:pointer; display:flex; align-items:center; justify-content:center;">
        <span class="material-symbols-outlined" style="font-size:20px;">chevron_left</span>
    </button>
    <input type="date" id="date-picker" class="form-control" style="flex:1; text-align:center; font-weight:600;" onchange="loadRecords()">
    <button onclick="changeDate(1)" style="background:#f1f3f4; border:none; border-radius:50%; width:36px; height:36px; cursor:pointer; display:flex; align-items:center; justify-content:center;">
        <span class="material-symbols-outlined" style="font-size:20px;">chevron_right</span>
    </button>
</div>

<!-- 全員まとめて開くボタン -->
<button id="expand-all-btn" onclick="expandAll()" style="display:none; width:100%; padding:10px; background:#e8f0fe; border:1.5px solid #1a73e8; border-radius:10px; color:#1a73e8; font-weight:600; font-size:0.9rem; cursor:pointer; margin-bottom:1rem; gap:8px; align-items:center; justify-content:center;">
    <span class="material-symbols-outlined" style="font-size:18px;">auto_awesome</span>
    全員のAI要約をまとめて生成
</button>

<div id="loading" style="display:none; text-align:center; padding:2rem; color:#80868b;">
    <span class="material-symbols-outlined" style="font-size:40px; animation:spin 1s linear infinite;">progress_activity</span>
    <div style="margin-top:8px;">記録を読み込み中...</div>
</div>

<div id="no-records" style="display:none; text-align:center; padding:3rem 1rem; color:#80868b;">
    <span class="material-symbols-outlined" style="font-size:48px; opacity:0.4;">inbox</span>
    <div style="margin-top:8px; font-size:0.9rem;">この日の記録はありません</div>
</div>

<div id="patient-list"></div>

<style>
@keyframes spin { to { transform: rotate(360deg); } }
.patient-card { background:#fff; border:1.5px solid #e0e0e0; border-radius:14px; margin-bottom:12px; overflow:hidden; transition:box-shadow 0.2s; }
.patient-card.expanded { box-shadow:0 4px 16px rgba(26,115,232,0.12); border-color:#1a73e8; }
.patient-header { display:flex; align-items:center; padding:14px 16px; cursor:pointer; gap:10px; user-select:none; }
.patient-name { font-weight:700; font-size:1rem; color:#202124; flex:1; }
.record-count-badge { background:#f1f3f4; color:#5f6368; border-radius:20px; padding:2px 10px; font-size:0.78rem; font-weight:600; }
.chevron-icon { color:#80868b; transition:transform 0.2s; font-size:20px; }
.expanded .chevron-icon { transform:rotate(180deg); }
.patient-body { display:none; padding:0 16px 16px; }
.expanded .patient-body { display:block; }
.summary-area { background:linear-gradient(135deg,#e8f0fe 0%,#f0f4ff 100%); border-radius:10px; padding:14px; margin-bottom:12px; position:relative; }
.summary-label { display:flex; align-items:center; gap:6px; font-size:0.78rem; font-weight:700; color:#1557b0; margin-bottom:8px; }
.summary-text { font-size:0.9rem; line-height:1.7; color:#202124; }
.summary-loading { display:flex; align-items:center; gap:8px; color:#1a73e8; font-size:0.88rem; }
.summary-stale-badge { display:inline-flex; align-items:center; gap:4px; background:#fef3c7; color:#92400e; border-radius:6px; padding:2px 8px; font-size:0.75rem; font-weight:600; margin-top:6px; cursor:pointer; border:none; }
.regen-btn { position:absolute; top:10px; right:10px; background:none; border:none; cursor:pointer; color:#1a73e8; padding:4px; border-radius:6px; display:flex; align-items:center; }
.regen-btn:hover { background:rgba(26,115,232,0.08); }
.record-accordion { border:1px solid #f0f0f0; border-radius:8px; margin-bottom:6px; overflow:hidden; }
.record-header { display:flex; align-items:center; padding:10px 12px; cursor:pointer; gap:8px; background:#fafafa; }
.record-header:hover { background:#f5f5f5; }
.record-staff { font-size:0.82rem; font-weight:600; color:#5f6368; flex:1; }
.record-time { font-size:0.78rem; color:#9aa0a6; }
.record-body { display:none; padding:10px 12px; font-size:0.88rem; line-height:1.6; color:#202124; border-top:1px solid #f0f0f0; background:#fff; white-space:pre-wrap; }
.record-body.open { display:block; }
</style>
{% endblock %}

{% block extra_script %}
<script>
window.toggleGearMenu = function(e) {
    e.stopPropagation();
    var menu = document.getElementById('gearMenu');
    if (!menu) return;
    menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
};
document.addEventListener('click', function(e) {
    var menu = document.getElementById('gearMenu');
    if (menu && menu.style.display !== 'none' && !e.target.closest('#gearMenu') && !e.target.closest('[onclick*="toggleGearMenu"]')) {
        menu.style.display = 'none';
    }
});
</script>
<script>
(function() {
var today = new Date();
var todayStr = today.toLocaleDateString('sv-SE');
var picker = document.getElementById('date-picker');
picker.value = todayStr;
picker.max = todayStr;

window.changeDate = function(delta) {
    var d = new Date(picker.value);
    d.setDate(d.getDate() + delta);
    var newStr = d.toLocaleDateString('sv-SE');
    if (newStr > todayStr) return;
    picker.value = newStr;
    loadRecords();
};

var _currentPatients = [];

window.loadRecords = async function() {
    var date = picker.value;
    document.getElementById('loading').style.display = 'block';
    document.getElementById('no-records').style.display = 'none';
    document.getElementById('patient-list').innerHTML = '';
    document.getElementById('expand-all-btn').style.display = 'none';
    try {
        var res = await fetch('/api/daily_records?date=' + date);
        var data = await res.json();
        if (data.error) throw new Error(data.error);
        _currentPatients = data.patients || [];
        document.getElementById('loading').style.display = 'none';
        if (_currentPatients.length === 0) {
            document.getElementById('no-records').style.display = 'block';
            return;
        }
        document.getElementById('expand-all-btn').style.display = 'flex';
        renderPatientList(_currentPatients, date);
    } catch(e) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('no-records').style.display = 'block';
    }
};

function renderPatientList(patients, date) {
    var list = document.getElementById('patient-list');
    list.innerHTML = '';
    patients.forEach(function(p, idx) { list.appendChild(buildPatientCard(p, date, idx)); });
}

function buildPatientCard(p, date, idx) {
    var card = document.createElement('div');
    card.className = 'patient-card';
    card.id = 'card-' + idx;
    var header = document.createElement('div');
    header.className = 'patient-header';
    header.innerHTML = '<span class="material-symbols-outlined" style="color:#1a73e8;font-size:20px;">person</span>' +
        '<span class="patient-name">' + esc(p.user_name) + '</span>' +
        '<span class="record-count-badge">' + p.record_count + '件</span>' +
        '<span class="material-symbols-outlined chevron-icon">expand_more</span>';
    header.addEventListener('click', function() { toggleCard(card, p, date); });
    card.appendChild(header);
    var body = document.createElement('div');
    body.className = 'patient-body';
    body.innerHTML = buildBodyHTML(p);
    card.appendChild(body);
    return card;
}

function buildBodyHTML(p) {
    var sc = '';
    if (p.summary) {
        sc = '<div class="summary-text">' + esc(p.summary) + '</div>';
        if (p.summary_stale) sc += '<button class="summary-stale-badge" onclick="regenSummary(this)">' +
            '<span class="material-symbols-outlined" style="font-size:14px;">update</span>新しい記録があります。タップして再生成</button>';
    } else {
        sc = '<div class="summary-loading"><span class="material-symbols-outlined" style="font-size:18px;color:#9aa0a6;">auto_awesome</span>' +
            '<span style="color:#9aa0a6;font-size:0.85rem;">名前をタップするとAI要約を生成します</span></div>';
    }
    var rh = p.records.map(function(r) {
        var time = new Date(r.created_at).toLocaleTimeString('ja-JP', {hour:'2-digit', minute:'2-digit'});
        var cat = r.category ? '<span style="background:#e8f0fe;color:#1557b0;border-radius:4px;padding:1px 6px;font-size:0.72rem;margin-left:4px;">' + esc(r.category) + '</span>' : '';
        return '<div class="record-accordion"><div class="record-header" onclick="this.nextElementSibling.classList.toggle(\'open\')">' +
            '<span class="material-symbols-outlined" style="font-size:16px;color:#9aa0a6;">edit_note</span>' +
            '<span class="record-staff">' + esc(r.staff_name) + cat + '</span>' +
            '<span class="record-time">' + time + '</span>' +
            '<span class="material-symbols-outlined" style="font-size:16px;color:#c0c0c0;">expand_more</span>' +
            '</div><div class="record-body">' + esc(r.content) + '</div></div>';
    }).join('');
    return '<div class="summary-area" data-user="' + esc(p.user_name) + '">' +
        '<div class="summary-label"><span class="material-symbols-outlined" style="font-size:16px;">auto_awesome</span>AI要約</div>' +
        '<button class="regen-btn" onclick="regenSummary(this)" title="再生成"><span class="material-symbols-outlined" style="font-size:16px;">refresh</span></button>' +
        sc + '</div>' +
        '<div style="font-size:0.78rem;font-weight:600;color:#80868b;margin-bottom:8px;padding-left:4px;">個別記録（' + p.records.length + '件）</div>' + rh;
}

async function toggleCard(card, p, date) {
    var was = card.classList.contains('expanded');
    card.classList.toggle('expanded');
    if (!was && (!p.summary || p.summary_stale)) await genSummary(card, p, date);
}

async function genSummary(card, p, date) {
    var sa = card.querySelector('.summary-area');
    if (!sa) return;
    var old = sa.querySelector('.summary-text,.summary-loading,.summary-stale-badge');
    if (old) old.remove();
    var le = document.createElement('div');
    le.className = 'summary-loading';
    le.innerHTML = '<span class="material-symbols-outlined" style="font-size:18px;animation:spin 1s linear infinite;">progress_activity</span> AI要約を生成中...';
    sa.appendChild(le);
    try {
        var res = await fetch('/api/generate_daily_summary', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({user_name: p.user_name, date: date})
        });
        var data = await res.json();
        if (le.parentNode) le.remove();
        var stale = sa.querySelector('.summary-stale-badge');
        if (stale) stale.remove();
        if (data.summary) {
            p.summary = data.summary; p.summary_stale = false;
            var te = document.createElement('div');
            te.className = 'summary-text'; te.textContent = data.summary;
            sa.appendChild(te);
        } else {
            var ee = document.createElement('div');
            ee.style.cssText = 'color:#d93025;font-size:0.85rem;';
            ee.textContent = data.error || '生成に失敗しました';
            sa.appendChild(ee);
        }
    } catch(e) { if (le.parentNode) le.remove(); }
}

window.regenSummary = async function(el) {
    var card = el.closest('.patient-card');
    var sa = el.closest('.summary-area');
    var uname = sa.dataset.user;
    var date = picker.value;
    var p = _currentPatients.find(function(x){ return x.user_name === uname; });
    if (!p) return;
    p.summary = null; p.summary_stale = true;
    await genSummary(card, p, date);
};

window.expandAll = async function() {
    var date = picker.value;
    var btn = document.getElementById('expand-all-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="material-symbols-outlined" style="font-size:18px;animation:spin 1s linear infinite;">progress_activity</span> 生成中...';
    for (var i = 0; i < _currentPatients.length; i++) {
        var p = _currentPatients[i];
        var card = document.getElementById('card-' + i);
        if (!card) continue;
        card.classList.add('expanded');
        if (!p.summary || p.summary_stale) await genSummary(card, p, date);
    }
    btn.disabled = false;
    btn.innerHTML = '<span class="material-symbols-outlined" style="font-size:18px;">check_circle</span> 全員展開済み';
};

function esc(s) {
    if (!s) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

loadRecords();
})();
</script>
{% endblock %}
