{% extends "base.html" %}
{% block title %}送迎表 - TASUKARU{% endblock %}
{% block nav_soge %}active{% endblock %}

{% block extra_style %}
<style>
/* soge-week-ui-v1 / soge-dnd-v1 */
.sg-wrap { max-width: 1100px; margin: 0 auto; padding: 12px 12px 90px; container-type: inline-size; }
.sg-head { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
.sg-title { font-size:1.15rem; font-weight:800; display:flex; align-items:center; gap:8px; }
.sg-btn { border:none; border-radius:8px; padding:8px 14px; font-weight:700; cursor:pointer; font-size:0.9rem;
  background:#eef2f7; color:#334; }
.sg-btn-primary { background:#1a73e8; color:#fff; }
.sg-btn-sm { padding:5px 10px; font-size:0.78rem; }
.sg-btn:disabled { opacity:0.5; cursor:default; }

/* 未保存バッジ（上の説明文の代わり。場所を取らない） */
.sg-chip { font-size:0.68rem; font-weight:800; border-radius:999px; padding:3px 8px; white-space:nowrap; }
.sg-chip.unsaved { background:#fff7ed; color:#9a3412; border:1px solid #fed7aa; }
.sg-chip.saved   { background:#e6f4ea; color:#137333; border:1px solid #ceead6; }

/* 曜日タブ */
.sg-days { display:flex; gap:6px; margin-bottom:12px; }
.sg-day { flex:1; text-align:center; padding:8px 0; border-radius:10px; border:1.5px solid #dadce0;
  background:#fff; color:#5f6368; font-weight:800; font-size:0.9rem; cursor:pointer; }
.sg-day.on { background:#1a73e8; border-color:#1a73e8; color:#fff; }

/* soge-week-tab-v1: 便のタブ。
   迎え便・中間便・送り便を縦に全部出すと、画面が非常に長くなって
   下の便まで指でずっと送ることになっていた。1便ずつ出す。 */
.sg-ttabs { display:flex; gap:6px; margin-bottom:12px; overflow-x:auto; }
.sg-ttab { flex:1 1 0; min-width:96px; text-align:center; padding:8px 6px; border-radius:10px;
  border:1.5px solid #dadce0; background:#fff; color:#5f6368; font-weight:800; font-size:0.88rem;
  cursor:pointer; line-height:1.35; white-space:nowrap; }
.sg-ttab.on { background:#0f9d58; border-color:#0f9d58; color:#fff; }
.sg-ttab small { display:block; font-size:0.72rem; font-weight:600; opacity:0.85;
  font-variant-numeric:tabular-nums; }

/* 便 */
.sg-trip-head { display:flex; align-items:center; gap:8px; font-weight:800; font-size:1rem;
  padding:8px 0 8px 10px; border-left:4px solid #1a73e8; margin:14px 0 10px; }
.sg-trip-time { font-size:0.8rem; color:#6b7280; font-weight:600; }

/* 車 */
.sg-car { border:1px solid #dbe3ee; border-radius:10px; margin-bottom:12px; background:#fafcff; overflow:hidden; }
/* soge-week-wide-v1: パソコンでは車を横に並べる。
   縦に積むと、1台目から3台目へ人を動かすのに画面を大きく送ることになる。
   横に並べば「隣へ寄せる」だけで済む。スマホは今までどおり縦に積む（横は狭すぎる）。 */
@media (min-width: 900px) {
  .sg-cars { display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr));
    gap:12px; align-items:start; }
  .sg-cars .sg-car { margin-bottom:0; }
  .sg-car .sg-stops { min-height:60px; }   /* 空の車にも落とせる幅と高さを残す */
}
.sg-car-head { display:flex; align-items:center; gap:8px; padding:10px 12px; background:#eef2f7;
  border-bottom:1px solid #e3e8ef; flex-wrap:wrap; }
.sg-car-badge { background:#1a73e8; color:#fff; font-size:0.7rem; font-weight:800; border-radius:999px;
  padding:3px 9px; white-space:nowrap; }
.sg-sel { border:1px solid #d6dbe3; border-radius:8px; padding:6px 8px; font-size:0.85rem; background:#fff; }
.sg-car-meta { flex:1; text-align:right; font-size:0.75rem; color:#5f6368; font-weight:600; }
.sg-min { font-weight:800; }
.sg-min.over { color:#c5221f; }
.sg-min.stale { color:#9aa0a6; }
.sg-seats.over { color:#c5221f; font-weight:800; }

.sg-stops { padding:8px 10px 12px; min-height:44px; }
.sg-stops.drop-on { background:#eef6ff; box-shadow: inset 0 0 0 2px #1a73e8; border-radius:8px; }

/* 立ち寄り＝付箋 */
.sg-stop { display:flex; align-items:center; gap:8px; padding:9px 8px; margin-bottom:6px;
  background:#fff; border:1px solid #e3e8ef; border-radius:10px;
  box-shadow:0 1px 2px rgba(16,24,40,.05); }
.sg-stop:last-child { margin-bottom:0; }
.sg-grip { flex:0 0 auto; width:26px; height:30px; display:flex; align-items:center; justify-content:center;
  color:#b0b6bf; cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none; font-size:1rem; }
.sg-grip:active { cursor:grabbing; }
.sg-seq { width:18px; text-align:center; font-weight:800; color:#9aa0a6; font-size:0.8rem; flex:0 0 auto; }
.sg-type { font-size:0.68rem; font-weight:800; border-radius:6px; padding:2px 6px; white-space:nowrap; flex:0 0 auto; }
.sg-type.pickup  { background:#E6F1FB; color:#185FA5; }
.sg-type.dropoff { background:#EAF3DE; color:#3B6D11; }
.sg-name { flex:1; min-width:0; font-weight:700; font-size:0.9rem; overflow-wrap:anywhere; }
.sg-tag { font-size:0.66rem; font-weight:700; border-radius:6px; padding:2px 5px; margin-left:4px; white-space:nowrap; }
.sg-tag.wc  { background:#f3e8ff; color:#6b21a8; }
.sg-tag.nth { background:#f3f0ff; color:#5b2ea6; }
.sg-plan { font-size:0.78rem; color:#5f6368; font-variant-numeric:tabular-nums; flex:0 0 auto; }

/* ドラッグ中は元の付箋を薄くするだけ。display:none にすると、つまんでいる
   ⠿ ごと消えてしまい、ポインターの追跡が切れてドラッグが固まる。 */
.sg-stop.dragging { opacity:0.28; }

/* 車・利用者の増減 */
.sg-del { flex:0 0 auto; border:1px solid #dadce0; background:#fff; border-radius:8px; width:26px; height:26px;
  cursor:pointer; color:#b0b6bf; font-size:0.75rem; font-weight:800; line-height:1; padding:0; }
.sg-del:hover { background:#fce8e6; border-color:#f5c6c2; color:#c5221f; }
.sg-tools { display:flex; gap:8px; margin:-4px 0 4px; flex-wrap:wrap; }
.sg-add { border:1px dashed #c8cdd3; border-radius:10px; padding:10px; margin-bottom:12px; background:#fafbfc; }
.sg-add-row { display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-top:8px; }
.sg-add select, .sg-add input[type=text] { border:1px solid #d6dbe3; border-radius:8px; padding:7px 8px;
  font-size:0.9rem; background:#fff; }
.sg-add select { flex:1; min-width:90px; }
.sg-add-lbl { font-size:0.75rem; color:#6b7280; font-weight:700; }

/* 検索（記録入力と同じやり方：ひらがな・漢字・カルテ番号） */
.sg-search { position:relative; }
.sg-search input { width:100%; }
.sg-cands { display:none; position:absolute; left:0; right:0; top:100%; z-index:50;
  background:#fff; border:1px solid #d6dbe3; border-radius:8px; margin-top:2px;
  max-height:200px; overflow-y:auto; box-shadow:0 6px 18px rgba(16,24,40,.12); }
.sg-cands.show { display:block; }
.sg-cand { padding:9px 10px; font-size:0.9rem; cursor:pointer; border-bottom:1px solid #f1f3f4; }
.sg-cand:last-child { border-bottom:none; }
.sg-cand:hover, .sg-cand.on { background:#eef6ff; }
.sg-picked { display:flex; align-items:center; gap:6px; background:#e6f4ea; border:1px solid #ceead6;
  color:#137333; border-radius:8px; padding:7px 10px; font-size:0.9rem; font-weight:700; }
.sg-picked .chg { margin-left:auto; color:#5f6368; font-size:0.75rem; font-weight:600; cursor:pointer; }
.sg-tag.guest { background:#fff7ed; color:#9a3412; }
.sg-ghost { position:fixed; z-index:9998; pointer-events:none; margin:0;
  box-shadow:0 10px 24px rgba(16,24,40,.22); transform:rotate(-1.2deg); opacity:.97; }
.sg-ph { height:44px; border:2px dashed #1a73e8; border-radius:10px; background:#eef6ff; margin-bottom:6px; }

.sg-empty { color:#9aa3b2; font-size:0.85rem; padding:10px 6px; }

/* ===== soge-unassigned-v1 : 特別枠 =====
   0  = まだ車が決まっていない人（赤・いちばん上・必ず目に入る場所）
   -1 = 送迎なし（灰色・たたんでおく。家族送迎の方など）
   ★以前は、席に乗り切らなかった人を警告文に出すだけで表には出しておらず、
     保存すると警告ごと消えて【二度と画面に出てこなかった】。 */
.sg-car.unassigned { border-color:#f5c6c2; background:#fff8f7; }
.sg-car.unassigned .sg-car-head { background:#fce8e6; border-bottom-color:#f5c6c2; }
.sg-car.unassigned .sg-car-badge { background:#c5221f; }
.sg-car.noride { border-color:#dfe3e8; background:#fafafa; }
.sg-car.noride .sg-car-head { background:#f1f3f4; border-bottom-color:#e3e8ef; }
.sg-car.noride .sg-car-badge { background:#80868b; }
.sg-special-note { flex:1 1 100%; font-size:0.72rem; line-height:1.5; font-weight:600; }
.sg-car.unassigned .sg-special-note { color:#a5261f; }
.sg-car.noride .sg-special-note { color:#5f6368; }
.sg-noride-wrap { margin:4px 0 12px; }
.sg-noride-wrap > summary { cursor:pointer; font-size:0.8rem; font-weight:700; color:#5f6368;
  padding:9px 12px; background:#f1f3f4; border:1px solid #e3e8ef; border-radius:10px; }
.sg-ttab-warn { display:inline-block; background:#c5221f; color:#fff; border-radius:999px;
  font-size:0.66rem; font-weight:800; padding:1px 6px; margin-left:4px; }
.sg-ttab.on .sg-ttab-warn { background:#fff; color:#c5221f; }

/* 案内・警告はいちばん下（上に置くと表が押し下げられて邪魔になる） */
.sg-foot { margin-top:18px; }
.sg-warn { background:#fff7ed; border:1px solid #fed7aa; color:#9a3412; border-radius:8px;
  padding:10px; font-size:0.8rem; line-height:1.6; margin-bottom:8px; }
.sg-info { font-size:0.75rem; color:#8a93a0; line-height:1.6; }

.sg-toast { position:fixed; left:50%; top:calc(env(safe-area-inset-top, 0px) + 12px); transform:translate(-50%,-140%); z-index:9999;
  background:#137333; color:#fff; padding:10px 16px; border-radius:10px; font-size:0.85rem; font-weight:700;
  transition:transform .22s ease, opacity .22s ease; opacity:0; pointer-events:none; max-width:min(90vw,420px);
  text-align:center; }
.sg-toast.show { transform:translate(-50%,0); opacity:1; }
.sg-toast.err { background:#c5221f; }
</style>
{% endblock %}

{% block content %}
<div class="sg-wrap">
  <div id="sgToast" class="sg-toast"></div>

  <div class="sg-head">
    <div class="sg-title">送迎表 <span id="sgState"></span></div>
    <div style="display:flex;gap:8px;">
      <a class="sg-btn" href="/soge/run" onclick="spaNav(event,'/soge/run')">運行画面</a>
      <button class="sg-btn" id="sgAuto" onclick="sgAutoBuild()">自動で組み直す</button>
      <button class="sg-btn sg-btn-primary" id="sgSave" onclick="sgSave()">保存</button>
    </div>
  </div>

  <div class="sg-days" id="sgDays"></div>

  <div class="sg-ttabs" id="sgTripTabs"></div>
  <div id="sgTrips"></div>

  <div class="sg-foot">
    <div id="sgWarnings"></div>
    <div class="sg-info" id="sgInfo">読み込み中…</div>
  </div>
</div>
{% endblock %}

{% block extra_script %}
<script>
// ===== soge-week-ui-v1 / soge-dnd-v1 =====
(function () {
  var WD = [
    { n: 1, label: '月' }, { n: 2, label: '火' }, { n: 3, label: '水' },
    { n: 4, label: '木' }, { n: 5, label: '金' }, { n: 6, label: '土' }, { n: 0, label: '日' }
  ];
  var state = { weekday: 1, data: null, staff: [], vehicles: [], patients: [], dirty: false,
                tripTab: 0 };   // soge-week-tab-v1: 表示中の便（d.trips の本当の位置）

  function $(id) { return document.getElementById(id); }
  function esc(s) { var d = document.createElement('div'); d.textContent = (s == null ? '' : s); return d.innerHTML; }

  var toastTimer = null;
  function toast(msg, kind) {
    var el = $('sgToast');
    el.textContent = msg;
    el.className = 'sg-toast show' + (kind === 'err' ? ' err' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.className = 'sg-toast' + (kind === 'err' ? ' err' : ''); }, 2600);
  }

  // ---------- 曜日タブ ----------
  function renderDays() {
    $('sgDays').innerHTML = WD.map(function (d) {
      return '<div class="sg-day' + (d.n === state.weekday ? ' on' : '') + '" data-wd="' + d.n + '">' + d.label + '</div>';
    }).join('');
    $('sgDays').querySelectorAll('[data-wd]').forEach(function (el) {
      el.onclick = function () {
        if (state.dirty && !confirm('保存していない変更があります。破棄して切り替えますか？')) return;
        state.weekday = Number(el.dataset.wd);
        state.dirty = false;
        renderDays();
        load();
      };
    });
  }

  // ---------- 読み込み ----------
  async function load() {
    $('sgInfo').textContent = '読み込み中…';
    $('sgTrips').innerHTML = '';
    $('sgTripTabs').innerHTML = '';
    var r = await fetch('/api/soge/week?weekday=' + state.weekday);
    var j = await r.json();
    if (j.status !== 'success') { $('sgInfo').textContent = j.message; return; }
    state.data = j;
    render();
  }

  window.sgAutoBuild = async function () {
    if (state.dirty && !confirm('保存していない変更があります。自動で組み直しますか？')) return;
    var btn = $('sgAuto');
    btn.disabled = true; btn.textContent = '計算中…';
    try {
      var r = await fetch('/api/soge/week/auto', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ weekday: state.weekday })
      });
      var j = await r.json();
      if (j.status !== 'success') { toast(j.message, 'err'); return; }
      state.data = j;
      state.dirty = true;      // 自動生成しただけでは保存されていない
      render();
      toast('組み直しました。内容を確認して保存してください。');
    } finally {
      btn.disabled = false; btn.textContent = '自動で組み直す';
    }
  };

  // 車1台の席の使用数。中間便は「送りの人を降ろしてから迎えに行く」ので、
  // 車内にいる人数のピークは max(送りの人数, 迎えの人数)。
  /* ===== soge-unassigned-v1 =====
     vehicle_no で枠を見分ける。0 = まだ車が決まっていない人 / -1 = 送迎なし。
     車と同じ形にしてあるので、ドラッグ・保存・並べ替えの仕組みをそのまま使える。 */
  var VNO_UNASSIGNED = 0, VNO_NORIDE = -1;
  function isSpecial(v) { return !!v && v.vehicle_no != null && Number(v.vehicle_no) <= 0; }
  function isUnassigned(v) { return !!v && Number(v.vehicle_no) === VNO_UNASSIGNED; }
  function isNoride(v) { return !!v && Number(v.vehicle_no) === VNO_NORIDE; }
  function realCars(trip) {
    return (trip.vehicles || []).filter(function (v) { return !isSpecial(v); });
  }
  // 無ければ作る。未割当は先頭、送迎なしは末尾に置く
  function getBox(trip, vno) {
    trip.vehicles = trip.vehicles || [];
    for (var i = 0; i < trip.vehicles.length; i++) {
      if (Number(trip.vehicles[i].vehicle_no) === vno) return trip.vehicles[i];
    }
    var box = {
      vehicle_no: vno,
      unassigned: (vno === VNO_UNASSIGNED), noride: (vno === VNO_NORIDE),
      vehicle_id: null, vehicle_name: '', plate_no: '',
      seats: null, seats_used: 0, driver_name: '', stops: [],
      stale: false, minutes: null, distance_km: null, over_target: false
    };
    if (vno === VNO_UNASSIGNED) trip.vehicles.unshift(box); else trip.vehicles.push(box);
    return box;
  }
  // 空になった特別枠は残さない（空箱だけが並ぶのを防ぐ）
  function pruneBoxes(trip) {
    trip.vehicles = (trip.vehicles || []).filter(function (v) {
      return !isSpecial(v) || (v.stops || []).length;
    });
  }

  function seatsUsed(v) {
    var dp = 0, pk = 0;
    (v.stops || []).forEach(function (s) { if (s.type === 'dropoff') dp++; else pk++; });
    return Math.max(dp, pk);
  }

  // ---------- 描画 ----------
  function render() {
    var d = state.data;

    $('sgState').innerHTML = state.dirty || !d.saved
      ? '<span class="sg-chip unsaved">未保存</span>'
      : '<span class="sg-chip saved">保存済</span>';

    /* soge-week-tab-v1: 便ごとにタブを出し、選んだ便だけを描く。
       ★ti（d.trips の本当の位置）は変えない。
         保存も並べ替えも data-xxx の "ti_vi_si" を見ているので、
         ここで番号を振り直すと全部ずれる。 */
    var trips = d.trips || [];
    if (state.tripTab >= trips.length) state.tripTab = 0;
    $('sgTripTabs').innerHTML = trips.map(function (t, ti) {
      // soge-unassigned-v1: 未割当が残っている便は、開かなくても分かるようにする。
      //   気づかないまま当日を迎えるのを防ぐのが目的。
      var n = 0, un = 0;
      (t.vehicles || []).forEach(function (v) {
        var c = (v.stops || []).length;
        if (isNoride(v)) return;              // 送迎なしは人数に数えない
        n += c;
        if (isSpecial(v)) un += c;            // ★描画の振り分けと同じ規則にそろえる
      });
      return '<div class="sg-ttab' + (ti === state.tripTab ? ' on' : '') + '" data-ttab="' + ti + '">' +
        esc(t.trip_name) +
        (un ? '<span class="sg-ttab-warn">未' + un + '</span>' : '') +
        '<small>' + (t.depart ? esc(t.depart) + '・' : '') + n + '名</small></div>';
    }).join('');
    $('sgTripTabs').style.display = trips.length ? 'flex' : 'none';
    $('sgTripTabs').querySelectorAll('[data-ttab]').forEach(function (el) {
      el.onclick = function () {
        state.tripTab = Number(el.dataset.ttab);
        render();
        // base.html では画面のスクロールを .page-wrapper が持っている。window では動かない
        var w = document.querySelector('.page-wrapper');
        if (w) w.scrollTop = 0; else window.scrollTo(0, 0);
      };
    });

    var ti = state.tripTab;
    var t = trips[ti];
    if (!t) {
      $('sgTrips').innerHTML = '<div class="sg-empty">この曜日の送迎はありません。</div>';
    } else {
      /* soge-unassigned-v1: 特別枠は「車を横に並べる箱」の外に出す。
         未割当は必ず目に入るように【いちばん上】、
         送迎なしは普段じゃまなので【いちばん下でたたむ】。
         ★vi は t.vehicles の本当の位置を渡すこと。data-key が "ti_vi_si" なので、
           表示の都合で番号を振り直すと、ドラッグも保存も全部ずれる。 */
      var vs = t.vehicles || [];
      var htmlOf = function (v) { return carHtml(t, ti, v, vs.indexOf(v)); };
      // ★0 と -1 以外の特別枠(想定外の値)も必ずどこかに出す。
      //   どの箱にも入らないと、保存はされるのに画面に出ない人ができる＝元の不具合と同じ。
      var unHtml = vs.filter(function (v) { return isSpecial(v) && !isNoride(v); })
                     .map(htmlOf).join('');
      var ndList = vs.filter(isNoride);
      var ndCount = 0;
      ndList.forEach(function (v) { ndCount += (v.stops || []).length; });
      var ndHtml = ndCount
        ? '<details class="sg-noride-wrap"><summary>送迎なし（' + ndCount +
          '件）… 家族送迎などで、この便では乗らない方。開くと車へ戻せます</summary>' +
          ndList.map(htmlOf).join('') + '</details>'
        : '';

      var cars = vs.filter(function (v) { return !isSpecial(v); }).map(htmlOf).join('');
      // soge-week-wide-v1: パソコンで横に並べるための入れ物
      cars = cars ? ('<div class="sg-cars">' + cars + '</div>')
                  : '<div class="sg-empty">この便の対象者はいません</div>';
      cars = unHtml + cars;
      // soge-edit-v1: 台数と人の増減は手でもできるようにする
      var tools = '<div class="sg-tools">' +
        '<button class="sg-btn sg-btn-sm" data-addcar="' + ti + '">＋ 車を追加</button>' +
        '<button class="sg-btn sg-btn-sm" data-addppl="' + ti + '">＋ 利用者を追加</button>' +
        // soge-order-fix-v1: 並べ替えだけをやり直す（車の割り振りは変えない）
        '<button class="sg-btn sg-btn-sm" id="sgReorder">送りを先にして並べ替える</button>' +
        '</div>';
      $('sgTrips').innerHTML = '<div class="sg-trip-head">' + esc(t.trip_name) +
        '<span class="sg-trip-time">' + esc(t.depart || '') + ' 出発</span></div>' +
        cars + tools + ndHtml;
    }

    $('sgWarnings').innerHTML = (d.warnings || []).length
      ? '<div class="sg-warn">' + d.warnings.map(esc).join('<br>') + '</div>' : '';
    $('sgInfo').innerHTML =
      '対象 ' + (d.target_count != null ? d.target_count + '名' : '—') +
      (d.wheelchair_count ? '（うち車いす ' + d.wheelchair_count + '名）' : '') +
      '<br>名前の左の⠿をつまむと、順番の入れ替えも、車から車への移動もできます。直した内容は保存すると次週に引き継がれます。';

    bind();
  }

  function carHtml(t, ti, v, vi) {
    var vopts = state.vehicles.map(function (x) {
      return '<option value="' + x.id + '"' + (x.id === v.vehicle_id ? ' selected' : '') + '>' + esc(x.name) + '</option>';
    }).join('');
    var sopts = state.staff.map(function (n) {
      return '<option value="' + esc(n) + '"' + (n === v.driver_name ? ' selected' : '') + '>' + esc(n) + '</option>';
    }).join('');

    var mins = (v.stale)
      ? '<span class="sg-min stale">保存すると再計算</span>'
      : ((v.minutes != null)
          ? '<span class="sg-min' + (v.over_target ? ' over' : '') + '">' + v.minutes + '分</span>' +
            (v.distance_km ? ' / ' + v.distance_km + 'km' : '')
          : '');

    var used = seatsUsed(v);
    var seatsOver = (v.seats != null && used > v.seats);

    var stops = (v.stops || []).map(function (s, si) {
      return '<div class="sg-stop" data-key="' + ti + '_' + vi + '_' + si + '">' +
        '<span class="sg-grip" data-grip="' + ti + '_' + vi + '_' + si + '">⠿</span>' +
        '<span class="sg-seq">' + (si + 1) + '</span>' +
        '<span class="sg-type ' + s.type + '">' + (s.type === 'pickup' ? '迎' : '送') + '</span>' +
        '<span class="sg-name">' + esc(s.user_name) +
          (s.guest ? '<span class="sg-tag guest">臨時</span>' : '') +
          (s.is_wheelchair ? '<span class="sg-tag wc">車いす</span>' : '') +
          (s.nth ? '<span class="sg-tag nth">第' + s.nth + '</span>' : '') +
        '</span>' +
        '<span class="sg-plan">' + (s.planned_at || '') + '</span>' +
        '<button class="sg-del" data-delstop="' + ti + '_' + vi + '_' + si + '" title="この便から外す">✕</button>' +
      '</div>';
    }).join('');

    // soge-unassigned-v1: 特別枠は「車両・運転手・所要時間・車を外す✕」を出さない。
    //   車ではないので、選ばせても意味が無く、誤操作のもとになる。
    if (isSpecial(v)) {
      // ★-1（送迎なし）以外の特別枠は、すべて「未割当」として赤く出す。
      //   分からない値を静かに隠すより、目立たせて人に判断してもらうほうが安全。
      var un = !isNoride(v);
      return '<div class="sg-car ' + (un ? 'unassigned' : 'noride') + '">' +
        '<div class="sg-car-head">' +
          '<span class="sg-car-badge">' + (un ? 'まだ車が決まっていない人' : '送迎なし') + '</span>' +
          '<span class="sg-car-meta">' + (v.stops || []).length + '件</span>' +
          '<span class="sg-special-note">' +
            (un ? '⠿ をつまんで、乗る車へ移してください。ここに残ったままだと、当日の運行画面にも「まだ車が決まっていない人」として出ます。'
                : 'この便では送迎しない方です。⠿ をつまむと車へ戻せます。') +
          '</span>' +
        '</div>' +
        '<div class="sg-stops" data-drop="' + ti + '_' + vi + '">' +
          (stops || '<div class="sg-empty">ここに付箋を置けます</div>') +
        '</div>' +
      '</div>';
    }

    return '<div class="sg-car">' +
      '<div class="sg-car-head">' +
        '<span class="sg-car-badge">車 ' + (realCars(t).indexOf(v) + 1) + '</span>' +
        '<select class="sg-sel" data-veh="' + ti + '_' + vi + '"><option value="">車両…</option>' + vopts + '</select>' +
        '<select class="sg-sel" data-drv="' + ti + '_' + vi + '"><option value="">運転手…</option>' + sopts + '</select>' +
        '<span class="sg-car-meta">' + mins +
          ' ／ <span class="sg-seats' + (seatsOver ? ' over' : '') + '">席 ' + used + '/' + (v.seats || '-') + '</span>' +
        '</span>' +
        '<button class="sg-del" data-delcar="' + ti + '_' + vi + '" title="この車を使わない">✕</button>' +
      '</div>' +
      '<div class="sg-stops" data-drop="' + ti + '_' + vi + '">' +
        (stops || '<div class="sg-empty">ここに付箋を置けます</div>') +
      '</div>' +
    '</div>';
  }

  function bind() {
    var root = $('sgTrips');
    root.querySelectorAll('[data-veh]').forEach(function (el) {
      el.onchange = function () {
        var a = el.dataset.veh.split('_');
        var v = state.data.trips[a[0]].vehicles[a[1]];
        v.vehicle_id = el.value || null;
        var m = state.vehicles.find(function (x) { return x.id === el.value; });
        v.vehicle_name = m ? m.name : '';
        v.seats = m ? (m.soge_seats || m.capacity || 7) : v.seats;
        state.dirty = true;
        render();
      };
    });
    root.querySelectorAll('[data-drv]').forEach(function (el) {
      el.onchange = function () {
        var a = el.dataset.drv.split('_');
        state.data.trips[a[0]].vehicles[a[1]].driver_name = el.value;
        state.dirty = true;
        render();
      };
    });
    root.querySelectorAll('[data-grip]').forEach(function (el) {
      el.addEventListener('pointerdown', gripDown);
    });

    // ---- soge-edit-v1: 車と利用者の増減 ----
    root.querySelectorAll('[data-delcar]').forEach(function (el) {
      el.onclick = function () { delCar(el.dataset.delcar); };
    });
    root.querySelectorAll('[data-delstop]').forEach(function (el) {
      el.onclick = function () { delStop(el.dataset.delstop); };
    });
    root.querySelectorAll('[data-addcar]').forEach(function (el) {
      el.onclick = function () { addCar(Number(el.dataset.addcar)); };
    });
    // soge-order-fix-v1
    var rb = document.getElementById('sgReorder');
    if (rb) rb.onclick = sgReorder;
    root.querySelectorAll('[data-addppl]').forEach(function (el) {
      el.onclick = function () { openAddPerson(Number(el.dataset.addppl), el); };
    });
  }

  // 便の中の車をまるごと外す。乗っていた人は残りの車の先頭へ移す（消さない）。
  function delCar(key) {
    var a = key.split('_').map(Number);
    var trip = state.data.trips[a[0]];
    var v = trip.vehicles[a[1]];
    // soge-unassigned-v1: 特別枠は「車」ではないので外せない（✕も出していない）
    if (isSpecial(v)) return;
    if (realCars(trip).length <= 1) { toast('最後の1台は外せません', 'err'); return; }
    var n = (v.stops || []).length;
    if (n && !confirm(v.stops.length + '名が乗っています。他の車へ移して、この車を外しますか？')) return;

    trip.vehicles.splice(a[1], 1);
    if (n) {
      // soge-unassigned-v1: 移す先は【本物の車】。未割当の箱へ流し込まない
      var dst = realCars(trip)[0];
      dst.stops = (dst.stops || []).concat(v.stops);
    }
    // ★番号の振り直しも本物の車だけ。特別枠(0/-1)を 1,2,3 に書き換えると
    //   ふつうの車に化けて、保存した瞬間に区別が消える。
    var no = 0;
    trip.vehicles.forEach(function (x) {
      if (!isSpecial(x)) x.vehicle_no = ++no;
      x.stale = true; x.minutes = null; x.distance_km = null; x.over_target = false;
      (x.stops || []).forEach(function (s) { s.planned_at = null; });
    });
    state.dirty = true;
    keepScroll(render);
    toast(n ? '車を外し、' + n + '名を他の車へ移しました' : '車を外しました');
  }

  // 車を増やす。まだ使っていない車両を初期値に入れる。
  function addCar(ti) {
    var trip = state.data.trips[ti];
    trip.vehicles = trip.vehicles || [];
    var used = trip.vehicles.map(function (v) { return v.vehicle_id; });
    var free = state.vehicles.find(function (x) { return used.indexOf(x.id) < 0; });
    /* soge-unassigned-v1: 番号は【いま使われている最大＋1】。
       ★台数で数えると、自動生成が 1 と 3 を作った便（席の割り当てで
         真ん中の車が0名になると番号が飛ぶ）で 3 が重複する。
         soge_routes は (施設,曜日,便,vehicle_no) が一意なので、
         重複したまま保存すると【先に古い行を消したあと insert が失敗し、
         その曜日の配車表がまるごと消える】。 */
    var maxNo = 0;
    realCars(trip).forEach(function (x) {
      var k = Number(x.vehicle_no) || 0;
      if (k > maxNo) maxNo = k;
    });
    trip.vehicles.push({
      vehicle_no: maxNo + 1,
      vehicle_id: free ? free.id : null,
      vehicle_name: free ? free.name : '',
      seats: free ? (free.soge_seats || free.capacity || 7) : 7,
      seats_used: 0,
      driver_name: '',
      stops: [],
      stale: true, minutes: null, distance_km: null, over_target: false
    });
    state.dirty = true;
    keepScroll(render);
    toast('車を追加しました。付箋を移してください。');
  }

  /* その便から1人外す。
     ★soge-unassigned-v1: 【消さずに「送迎なし」へ移す】。
       消すだけだと、その方はその曜日の対象者なので、次に開いたとき
       「まだ車が決まっていない人」にまた出てきてしまう。
       家族送迎の方が毎回赤い箱に並ぶことになり、本当に危ない未割当が埋もれる。
       「送迎なし」に居る人は補完の対象から外れるので、静かにたたんでおける。 */
  function delStop(key) {
    var a = key.split('_').map(Number);
    var trip = state.data.trips[a[0]];
    var v = trip.vehicles[a[1]];
    var s = v.stops[a[2]];
    if (!s) return;

    if (isNoride(v)) {
      // 「送迎なし」から外す＝本当に取り消す。次に開くと未割当に戻る
      if (!confirm(s.user_name + ' さんを「送迎なし」から取り消しますか？\n次に開くと「まだ車が決まっていない人」に出ます。')) return;
      v.stops.splice(a[2], 1);
    } else {
      if (!confirm(s.user_name + ' さんは、この便では送迎しませんか？\n「送迎なし」へ移します。あとで車へ戻せます。')) return;
      v.stops.splice(a[2], 1);
      s.planned_at = null;
      getBox(trip, VNO_NORIDE).stops.push(s);
    }
    v.stale = true; v.minutes = null; v.distance_km = null; v.over_target = false;
    (v.stops || []).forEach(function (x) { x.planned_at = null; });
    pruneBoxes(trip);
    state.dirty = true;
    keepScroll(render);
  }

  // ひらがな↔カタカナをまたいで探せるようにする（記録入力と同じ）
  function toKata(s) { return s.replace(/[ぁ-ゖ]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) + 0x60); }); }
  function toHira(s) { return s.replace(/[ァ-ヶ]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0x60); }); }

  function searchPatients(q) {
    q = (q || '').trim();
    if (!q) return [];
    var ql = q.toLowerCase(), qk = toKata(q), qh = toHira(q);
    return state.patients.filter(function (p) {
      var name = p.user_name || '', kana = p.user_kana || '', no = String(p.patient_number || '');
      return name.indexOf(q) >= 0 || name.toLowerCase().indexOf(ql) >= 0 ||
             kana.indexOf(q) >= 0 || kana.indexOf(qk) >= 0 || kana.indexOf(qh) >= 0 ||
             no.indexOf(q) >= 0;
    }).slice(0, 30);
  }

  function uuid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
      var r = Math.random() * 16 | 0;
      return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
    });
  }

  // 見学の方などを臨時で足す。登録のある人は検索、無い人は名前を直接入力。
  function openAddPerson(ti, btn) {
    if (btn.parentNode.querySelector('.sg-add')) return;   // 二重に開かない
    var trip = state.data.trips[ti];

    // 中間便は「送り」と「迎え」が混ざるので、どちらか選んでもらう
    var hasPick = (trip.vehicles || []).some(function (v) {
      return (v.stops || []).some(function (s) { return s.type === 'pickup'; });
    });
    var hasDrop = (trip.vehicles || []).some(function (v) {
      return (v.stops || []).some(function (s) { return s.type === 'dropoff'; });
    });
    var typeSel = (hasPick && hasDrop)
      ? '<select class="ty"><option value="pickup">迎え</option><option value="dropoff">送り</option></select>'
      : '<input type="hidden" class="ty" value="' + (hasDrop && !hasPick ? 'dropoff' : 'pickup') + '">';

    /* soge-unassigned-v1: 追加先には【本物の車だけ】を出す。
       特別枠(0/-1)は名前が空なので、そのまま並べると「車 1」と表示され、
       しかも未割当は先頭にあるので【既定の選択肢】になってしまう。
       それに気づかず追加すると、当日その人を迎えに行く車が居ない。
       ★value には trip.vehicles の本当の位置を入れること。 */
    var vsAll = trip.vehicles || [];
    var carSel = '<select class="car">' + vsAll.map(function (v, i) {
      return isSpecial(v) ? '' :
        '<option value="' + i + '">' +
        esc(v.vehicle_name || ('車 ' + (realCars(trip).indexOf(v) + 1))) + '</option>';
    }).join('') + '</select>';

    var box = document.createElement('div');
    box.className = 'sg-add';
    box.innerHTML =
      '<div class="sg-add-lbl">利用者（ひらがな・漢字・カルテ番号で検索）</div>' +
      '<div class="sg-search" style="margin-top:5px;">' +
        '<input type="text" class="q" placeholder="例：やまだ / 山田 / 001" autocomplete="off">' +
        '<div class="sg-cands"></div>' +
      '</div>' +
      '<div class="picked" style="display:none;margin-top:6px;"></div>' +
      '<div class="sg-add-row">' +
        '<label style="font-size:0.8rem;display:flex;align-items:center;gap:4px;">' +
          '<input type="checkbox" class="guest"> 登録のない方（名前を直接入力）' +
        '</label>' +
      '</div>' +
      '<div class="sg-add-row">' + typeSel + carSel +
        '<button class="sg-btn sg-btn-sm sg-btn-primary ok">追加</button>' +
        '<button class="sg-btn sg-btn-sm no">やめる</button>' +
      '</div>';
    btn.parentNode.insertBefore(box, btn.parentNode.firstChild);

    var q = box.querySelector('.q');
    var cands = box.querySelector('.sg-cands');
    var picked = box.querySelector('.picked');
    var guestCb = box.querySelector('.guest');
    var chosen = null;      // 登録のある人を選んだとき

    function clearPick() {
      chosen = null;
      picked.style.display = 'none';
      q.parentNode.parentNode.querySelector('.sg-search').style.display = '';
      q.value = '';
      q.focus();
    }

    function pick(p) {
      chosen = p;
      cands.classList.remove('show');
      box.querySelector('.sg-search').style.display = 'none';
      picked.style.display = '';
      picked.innerHTML = '<div class="sg-picked">' + esc(p.user_name) +
        '<span class="chg">変更</span></div>';
      picked.querySelector('.chg').onclick = clearPick;
    }

    q.oninput = q.onkeyup = q.oncompositionend = function () {
      if (guestCb.checked) { cands.classList.remove('show'); return; }
      var list = searchPatients(q.value);
      if (!q.value.trim()) { cands.classList.remove('show'); return; }
      if (!list.length) {
        cands.innerHTML = '<div class="sg-cand" style="color:#9aa0a6;">該当なし（登録のない方はチェックを入れてください）</div>';
      } else {
        cands.innerHTML = list.map(function (p, i) {
          return '<div class="sg-cand" data-i="' + i + '">' + esc(p.user_name) +
            (p.user_kana ? '<span style="color:#9aa0a6;font-size:0.78rem;margin-left:6px;">' + esc(p.user_kana) + '</span>' : '') +
            '</div>';
        }).join('');
        cands.querySelectorAll('[data-i]').forEach(function (el) {
          el.addEventListener('mousedown', function (e) { e.preventDefault(); });
          el.addEventListener('click', function () { pick(list[Number(el.dataset.i)]); });
          el.addEventListener('touchstart', function (e) { e.preventDefault(); pick(list[Number(el.dataset.i)]); });
        });
      }
      cands.classList.add('show');
    };

    guestCb.onchange = function () {
      clearPick();
      cands.classList.remove('show');
      q.placeholder = guestCb.checked ? '名前を入力（例：見学 太郎）' : '例：やまだ / 山田 / 001';
    };

    box.querySelector('.no').onclick = function () { box.remove(); };

    box.querySelector('.ok').onclick = function () {
      // soge-unassigned-v1: 空文字は 0（＝未割当の箱）になるので、明示的に見る
      var raw = box.querySelector('.car').value;
      var vi = (raw === '' ? -1 : Number(raw));
      var v = (vi >= 0) ? trip.vehicles[vi] : null;
      var type = box.querySelector('.ty').value || 'pickup';
      if (!v || isSpecial(v)) { toast('先に「＋ 車を追加」で車を用意してください', 'err'); return; }

      var pid, nm, isGuest = false, revive = null;
      if (guestCb.checked) {
        nm = (q.value || '').trim();
        if (!nm) { toast('名前を入れてください', 'err'); q.focus(); return; }
        pid = uuid();          // 送迎の中だけで使う。利用者マスタには登録しない。
        isGuest = true;
      } else {
        if (!chosen) { toast('利用者を選んでください', 'err'); q.focus(); return; }
        pid = chosen.patient_id;
        nm = chosen.user_name;
        /* soge-unassigned-v1: 「送迎なし」に入っている方は【すでに居る】と言わない。
           たたまれていて画面に見えないので、断られた理由が分からなくなる。
           その場で車へ戻してあげるのが親切。 */
        var here = function (x) {
          return (x.stops || []).some(function (s) {
            return String(s.patient_id) === String(pid) && s.type === type;
          });
        };
        if ((trip.vehicles || []).some(function (x) { return !isNoride(x) && here(x); })) {
          toast('この方はすでにこの便に入っています', 'err'); return;
        }
        var ndBox = (trip.vehicles || []).filter(function (x) { return isNoride(x) && here(x); })[0];
        if (ndBox) {
          /* 「送迎なし」から取り出して、選んだ車へ移す。
             ★取り出した付箋を【そのまま使い回す】こと。作り直すと nth（第N週）が
               0 に戻り、「第2火曜だけ」の方を毎週迎えに行くことになる。
               nth は保存された値がそのまま読み戻されるので、自然には直らない。 */
          for (var z = ndBox.stops.length - 1; z >= 0; z--) {
            var zs = ndBox.stops[z];
            if (String(zs.patient_id) === String(pid) && zs.type === type) {
              revive = ndBox.stops.splice(z, 1)[0];
            }
          }
          pruneBoxes(trip);
        }
      }

      if (revive) {
        revive.planned_at = null;
        v.stops.push(revive);            // nth・車いすなど、元の情報を保つ
      } else {
        v.stops.push({
          patient_id: pid, user_name: nm, type: type, nth: 0,
          is_wheelchair: false, guest: isGuest, planned_at: null
        });
      }
      v.stale = true; v.minutes = null; v.distance_km = null; v.over_target = false;
      state.dirty = true;
      box.remove();
      keepScroll(render);
      toast(nm + ' さんを追加しました' + (isGuest ? '（住所が無いので周り順は手で直してください）' : ''));
    };

    q.focus();
  }

  // 画面を作り直しても、見ていた位置にとどまる
  /* ===== soge-keepscroll-v1 : 見ていた位置を保つ =====
     ★これまで効いていなかった。base.html では本文のスクロールを
       .page-wrapper が持っているので、window.scrollY は常に 0 で、
       window.scrollTo も何も起こさない。0を読んで0に戻していただけだった。
     ★innerHTML を入れ替えると、中身の高さが一瞬 0 になる。
       そこでブラウザがスクロール位置を 0 に詰めるので、
       【中身が戻ったあと】＝次の描画でもう一度当て直す必要がある。 */
  function keepScroll(fn) {
    var sc = scrollBox();
    var y = sc.scrollTop;
    fn();
    sc.scrollTop = y;
    if (window.requestAnimationFrame) {
      requestAnimationFrame(function () { sc.scrollTop = y; });
    }
  }

  // ---------- 付箋のドラッグ ----------
  // 同じ車の中の順番入れ替えと、車から車への移動の両方。
  // 便（迎え便・中間便・送り便）をまたぐ移動はしない。
  var drag = null;
  var ph = null;

  function gripDown(e) {
    if (e.button != null && e.button !== 0) return;
    var row = e.currentTarget.closest('.sg-stop');
    if (!row) return;
    var a = e.currentTarget.dataset.grip.split('_').map(Number);

    var rect = row.getBoundingClientRect();
    var ghost = row.cloneNode(true);
    ghost.classList.add('sg-ghost');
    ghost.classList.remove('dragging');
    ghost.style.width = rect.width + 'px';
    ghost.style.left = rect.left + 'px';
    ghost.style.top = rect.top + 'px';
    document.body.appendChild(ghost);

    ph = document.createElement('div');
    ph.className = 'sg-ph';
    row.parentNode.insertBefore(ph, row.nextSibling);
    row.classList.add('dragging');

    drag = {
      ti: a[0], vi: a[1], si: a[2], row: row, ghost: ghost,
      dx: e.clientX - rect.left, dy: e.clientY - rect.top,
      lx: e.clientX, ly: e.clientY, sy: 0,     // soge-week-autoscroll-v1
      pid: e.pointerId
    };
    e.preventDefault();

    // 監視は window に付ける。つまんでいる ⠿ は付箋の中にあるので、
    // 付箋を隠したり作り直したりすると、その要素に付けたリスナーごと消える。
    // それがドラッグの固まりの原因だった。window なら必ず pointerup が届く。
    window.addEventListener('pointermove', gripMove);
    window.addEventListener('pointerup', gripUp);
    window.addEventListener('pointercancel', gripUp);
    // 画面外に出ても、指を離したのを取りこぼさないための保険
    window.addEventListener('blur', gripUp);
  }

  /* ===== soge-week-autoscroll-v1 =====
     ★スマホで、画面の外にある車へ人を動かせなかった。
       付箋をつまむと指はふさがるので、もう片方の手で画面を送ることもできない。
     → つまんだまま画面の【上端・下端】に寄せると、そちらへ勝手に送る。
       指を止めていても送り続ける必要があるので、タイマーで回す。 */
  var scTimer = null;
  function scrollBox() {
    // base.html では本文のスクロールを .page-wrapper が持っている
    return document.querySelector('.page-wrapper') || document.scrollingElement || document.body;
  }
  function edgeSpeed(y) {
    var sc = scrollBox(), top, bottom;
    if (sc === document.scrollingElement || sc === document.body) {
      top = 0; bottom = window.innerHeight;
    } else {
      var r = sc.getBoundingClientRect(); top = r.top; bottom = r.bottom;
    }
    var EDGE = 90, MAX = 16;            // 端から90px、1回あたり最大16px
    if (y < top + EDGE)    return -Math.ceil((top + EDGE - y) / EDGE * MAX);
    if (y > bottom - EDGE) return  Math.ceil((y - (bottom - EDGE)) / EDGE * MAX);
    return 0;
  }
  function startAutoScroll() {
    if (scTimer) return;
    scTimer = setInterval(function () {
      if (!drag || !drag.sy) return;
      var sc = scrollBox();
      var before = sc.scrollTop;
      sc.scrollTop = before + drag.sy;
      if (sc.scrollTop === before) return;        // これ以上動かない
      // 画面が動いたので、落とし先を測り直す（指は止まったままでも動く）
      placeGhost(drag.lx, drag.ly);
    }, 16);
  }
  function stopAutoScroll() {
    if (scTimer) { clearInterval(scTimer); scTimer = null; }
  }

  // 落とし先の枠を決めて、目印(ph)を置く。画面座標で判定する
  function placeGhost(x, y) {
    if (!drag) return;
    drag.ghost.style.display = 'none';
    var el = document.elementFromPoint(x, y);
    drag.ghost.style.display = '';
    if (!el || !el.closest) return;

    var box = el.closest('.sg-stops');
    if (!box) return;
    var key = box.dataset.drop.split('_').map(Number);
    if (key[0] !== drag.ti) return;      // 別の便には移せない

    document.querySelectorAll('.sg-stops.drop-on').forEach(function (b) { b.classList.remove('drop-on'); });
    box.classList.add('drop-on');

    var rows = Array.prototype.slice.call(box.querySelectorAll('.sg-stop'))
      .filter(function (r) { return r !== drag.row; });
    var before = null;
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i].getBoundingClientRect();
      if (y < r.top + r.height / 2) { before = rows[i]; break; }
    }
    if (before) box.insertBefore(ph, before);
    else box.appendChild(ph);
  }

  function gripMove(e) {
    if (!drag) return;
    drag.ghost.style.left = (e.clientX - drag.dx) + 'px';
    drag.ghost.style.top = (e.clientY - drag.dy) + 'px';
    drag.lx = e.clientX; drag.ly = e.clientY;
    drag.sy = edgeSpeed(e.clientY);
    if (drag.sy) startAutoScroll();
    placeGhost(e.clientX, e.clientY);
  }

  function gripUp(e) {
    if (!drag) return;
    stopAutoScroll();
    window.removeEventListener('pointermove', gripMove);
    window.removeEventListener('pointerup', gripUp);
    window.removeEventListener('pointercancel', gripUp);
    window.removeEventListener('blur', gripUp);

    var box = (ph && ph.parentNode && ph.parentNode.classList.contains('sg-stops')) ? ph.parentNode : null;
    var dstKey = box ? box.dataset.drop.split('_').map(Number) : null;

    // 置いた位置＝手前にある付箋の数（ドラッグ中の付箋は数えない）
    var idx = 0;
    if (box) {
      var n = ph.previousElementSibling;
      while (n) {
        if (n.classList.contains('sg-stop') && n !== drag.row) idx++;
        n = n.previousElementSibling;
      }
    }

    // 何があってもゴーストと目印は必ず片づける（固まりの後始末）
    if (drag.ghost && drag.ghost.parentNode) drag.ghost.parentNode.removeChild(drag.ghost);
    if (ph && ph.parentNode) ph.parentNode.removeChild(ph);
    if (drag.row) drag.row.classList.remove('dragging');
    document.querySelectorAll('.sg-ghost').forEach(function (x) { x.remove(); });
    document.querySelectorAll('.sg-ph').forEach(function (x) { x.remove(); });
    document.querySelectorAll('.sg-stops.drop-on').forEach(function (x) { x.classList.remove('drop-on'); });

    var d = drag;
    drag = null; ph = null;

    if (!dstKey || dstKey[0] !== d.ti) { render(); return; }

    var trip = state.data.trips[d.ti];
    var src = trip.vehicles[d.vi];
    var dst = trip.vehicles[dstKey[1]];
    var item = src.stops.splice(d.si, 1)[0];
    if (!item) { render(); return; }
    dst.stops.splice(idx, 0, item);

    // 順番も乗る車も変わったら、到着予定時刻と所要時間は当てにならない。
    // 保存すると Google の経路で再計算される。
    [src, dst].forEach(function (v) {
      (v.stops || []).forEach(function (s) { s.planned_at = null; });
      v.stale = true; v.minutes = null; v.distance_km = null; v.over_target = false;
      v.seats_used = seatsUsed(v);
    });

    if (dst.seats != null && seatsUsed(dst) > dst.seats) {
      toast('席数を超えています（席 ' + seatsUsed(dst) + '/' + dst.seats + '）', 'err');
    }
    // soge-unassigned-v1: 最後の1人を車へ移したら、空の特別枠は消す
    pruneBoxes(trip);

    state.dirty = true;
    // soge-keepscroll-v1: 人を動かすたびに一番上へ飛ばない
    keepScroll(render);
  }

  /* ===== soge-order-fix-v1: 送り → 迎え に並べ替える =====
     ★自動生成をやり直すと、手で直した車の割り振りまで消えてしまう。
       これは【各車の中の順番だけ】を直す。誰がどの車か は変えない。
     ★保存はしない。画面が変わるだけなので、確かめてから「保存」を押せる。 */
  async function sgReorder() {
    var b = document.getElementById('sgReorder');
    if (b) { b.disabled = true; b.textContent = '並べ替え中…'; }
    try {
      var r = await fetch('/api/soge/week/reorder', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          trips: (state.data.trips || []).map(function (t) {
            return {
              trip_key: t.trip_key,
              // soge-unassigned-v1: 特別枠を並べ替えないよう、番号もいっしょに送る
              vehicles: (t.vehicles || []).map(function (v) {
                return { vehicle_no: v.vehicle_no, stops: v.stops || [] };
              })
            };
          })
        })
      });
      var j = await r.json();
      if (j.status !== 'success') { toast(j.message || '並べ替えできませんでした', 'err'); return; }
      (j.trips || []).forEach(function (nt, i) {
        var t = state.data.trips[i];
        if (!t) return;
        (nt.vehicles || []).forEach(function (nv, k) {
          var v = t.vehicles[k];
          if (!v) return;
          v.stops = nv.stops || [];
          // 順番が変わったら、到着予定と所要時間は当てにならない。保存すると再計算される。
          v.stops.forEach(function (s) { s.planned_at = null; });
          v.stale = true; v.minutes = null; v.distance_km = null; v.over_target = false;
        });
      });
      state.dirty = true;
      keepScroll(render);      // soge-keepscroll-v1
      toast('送りを先にして並べ替えました。よければ「保存」を押してください');
    } catch (e) { toast('並べ替えできませんでした', 'err'); }
    finally { if (b) { b.disabled = false; b.textContent = '送りを先にして並べ替える'; } }
  }

  // ---------- 保存 ----------
  window.sgSave = async function () {
    var btn = $('sgSave');
    btn.disabled = true; btn.textContent = '保存中…';
    try {
      var r = await fetch('/api/soge/week', {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          weekday: state.weekday,
          trips: (state.data.trips || []).map(function (t) {
            return {
              trip_key: t.trip_key,
              vehicles: (t.vehicles || []).map(function (v) {
                return {
                  vehicle_no: v.vehicle_no,
                  vehicle_id: v.vehicle_id,
                  driver_name: v.driver_name,
                  stops: (v.stops || []).map(function (s) {
                    return {
                      patient_id: s.patient_id, type: s.type, nth: s.nth || 0,
                      // soge-guest-v1: 登録のない方は名前も一緒に保存する
                      guest: !!s.guest, user_name: s.user_name || ''
                    };
                  })
                };
              })
            };
          })
        })
      });
      var j = await r.json();
      if (j.status !== 'success') { toast(j.message || '保存に失敗しました', 'err'); return; }
      state.dirty = false;
      toast('保存しました。この順番が次週にも引き継がれます。');
      await load();
    } finally {
      btn.disabled = false; btn.textContent = '保存';
    }
  };

  // ---------- init ----------
  (async function init() {
    var today = new Date().getDay();
    state.weekday = today;
    renderDays();

    var s = await fetch('/api/soge/staff').then(function (r) { return r.json(); }).catch(function () { return {}; });
    state.staff = (s && s.staff) ? s.staff : [];
    var v = await fetch('/api/vehicles').then(function (r) { return r.json(); }).catch(function () { return {}; });
    state.vehicles = (v && v.vehicles) ? v.vehicles : [];
    // soge-edit-v1: 見学の方などを臨時で足すための候補
    var p = await fetch('/api/soge/patients').then(function (r) { return r.json(); }).catch(function () { return {}; });
    state.patients = (p && p.patients) ? p.patients : [];

    await load();
  })();

  window.addEventListener('beforeunload', function (e) {
    if (state.dirty) { e.preventDefault(); e.returnValue = ''; }
  });
})();
</script>
{% endblock %}
