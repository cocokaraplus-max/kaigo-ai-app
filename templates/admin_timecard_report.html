{% extends "base.html" %}
{% block title %}勤怠集計 - TASUKARU{% endblock %}

{% block content %}
<style>
  /* timecard-report-ui-v2 : 月次集計＋打刻編集(A案) */
  .tcr-wrap{max-width:var(--page-max-width,480px);margin:0 auto;padding:16px 14px 120px}
  .tcr-head{display:flex;align-items:center;gap:8px;margin-bottom:4px}
  .tcr-head .material-symbols-outlined{font-size:26px;color:#2f6b5e}
  .tcr-title{font-size:1.15rem;font-weight:800}
  .tcr-lead{font-size:.86rem;color:#777;margin-bottom:14px}
  .tcr-back{display:inline-flex;align-items:center;gap:4px;background:none;border:0;
    color:#2f6b5e;font-weight:700;font-size:.9rem;cursor:pointer;font-family:inherit;
    padding:4px 0;margin-bottom:10px;text-decoration:none}
  .tcr-monthbar{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:14px}
  .tcr-monthbar button{background:#fff;border:1px solid #d8d4cc;border-radius:10px;width:40px;height:40px;
    font-size:1.2rem;cursor:pointer;font-family:inherit;color:#2f6b5e}
  .tcr-month-label{font-size:1.05rem;font-weight:800;min-width:140px;text-align:center}
  .tcr-staff{background:#fff;border:1px solid #d8d4cc;border-radius:12px;margin-bottom:12px;overflow:hidden}
  .tcr-staff-head{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer;
    background:#fafafa;border-bottom:1px solid #f0ede7}
  .tcr-staff-head .emoji{font-size:1.5rem}
  .tcr-staff-head .nm{font-weight:800;flex:1}
  .tcr-staff-head .tot{font-weight:800;color:#2f6b5e;font-size:1.05rem;text-align:right}
  .tcr-staff-head .sub{font-size:.74rem;color:#999;display:block;font-weight:400}
  .tcr-warn-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#e09b16;margin-left:6px}
  .tcr-days{padding:6px 14px 12px}
  .tcr-day{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #f4f1ec;font-size:.86rem}
  .tcr-day:last-child{border-bottom:0}
  .tcr-day .d{width:62px;color:#666;font-variant-numeric:tabular-nums}
  .tcr-day .io{flex:1;color:#888;font-size:.8rem;font-variant-numeric:tabular-nums}
  .tcr-day .hrs{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
  .tcr-day.bad{background:#fff8ec;margin:0 -14px;padding:9px 14px}
  .tcr-flag{color:#c77d12;font-size:.74rem;font-weight:700}
  .tcr-edit{background:none;border:0;color:#2f6b5e;cursor:pointer;padding:4px;display:flex;align-items:center}
  .tcr-edit .material-symbols-outlined{font-size:18px}
  .tcr-empty{color:#999;font-size:.86rem;text-align:center;padding:24px 0}
  .tcr-collapsed .tcr-days{display:none}
  .tcr-summary{background:#eef5f3;border:1px solid #d7e6e1;border-radius:12px;padding:12px 14px;
    margin-bottom:14px;font-size:.88rem;color:#2f6b5e}
  .tcr-summary b{font-size:1.05rem}
  .tcr-actions{display:flex;gap:8px;margin-bottom:14px}
  .tcr-actions button{flex:1;padding:10px;border-radius:10px;border:1px solid #d8d4cc;background:#fff;
    font-family:inherit;font-weight:700;font-size:.88rem;cursor:pointer;color:#2f6b5e;
    display:flex;align-items:center;justify-content:center;gap:6px}

  /* 編集モーダル */
  .tcm-back{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:none;
    align-items:flex-end;justify-content:center}
  .tcm-back.show{display:flex}
  .tcm{background:#fff;width:100%;max-width:var(--page-max-width,480px);border-radius:16px 16px 0 0;
    padding:18px 16px;max-height:86vh;overflow-y:auto;margin-bottom:var(--tc-nav-h,0px)}
  .tcm h3{font-size:1.05rem;margin-bottom:2px}
  .tcm .sub{font-size:.82rem;color:#888;margin-bottom:14px}
  .tcm-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #f0ede7}
  .tcm-row .pt{width:84px;font-size:.86rem;font-weight:700}
  .tcm-row input[type=time]{flex:1;padding:9px;border:1px solid #d8d4cc;border-radius:9px;
    font-size:1rem;font-family:inherit}
  .tcm-row .save{background:#2f6b5e;color:#fff;border:0;border-radius:8px;padding:9px 12px;
    font-weight:700;font-size:.82rem;cursor:pointer;font-family:inherit}
  .tcm-row .del{background:none;border:0;color:#c0392b;cursor:pointer;padding:6px;display:flex}
  .tcm-row .del .material-symbols-outlined{font-size:18px}
  .tcm-add{margin-top:14px;background:#f6f4ef;border:1px dashed #c8c3b8;border-radius:12px;padding:12px}
  .tcm-add h4{font-size:.86rem;margin-bottom:8px;color:#555}
  .tcm-add-row{display:flex;gap:8px;align-items:center}
  .tcm-add-row select,.tcm-add-row input[type=time]{padding:9px;border:1px solid #d8d4cc;border-radius:9px;
    font-size:.92rem;font-family:inherit}
  .tcm-add-row select{flex:1}
  .tcm-add-row .add{background:#2f6b5e;color:#fff;border:0;border-radius:8px;padding:9px 14px;
    font-weight:700;font-size:.85rem;cursor:pointer;font-family:inherit}
  .tcm-note{width:100%;margin-top:12px;padding:9px;border:1px solid #d8d4cc;border-radius:9px;
    font-size:.9rem;font-family:inherit}
  .tcm-close{width:100%;margin-top:14px;background:#eee;border:0;border-radius:10px;padding:13px;
    font-weight:700;font-family:inherit;cursor:pointer;color:#555}
  .tcm-empty{color:#aaa;font-size:.85rem;padding:8px 0}

  @media print{
    .tcr-monthbar button,.tcr-actions,.tcr-edit,.tcr-back{display:none!important}
    .tcr-collapsed .tcr-days{display:block!important}
  }
  /* staff-leave-ui-v1 */
  .tcm-leave{margin-top:14px;background:#eef5f3;border:1px solid #d7e6e1;border-radius:12px;padding:12px}
  .tcm-leave h4{font-size:.86rem;margin-bottom:8px;color:#2f6b5e}
  .tcm-leave-row{display:flex;gap:8px;align-items:center}
  .tcm-leave-row select{flex:1;padding:9px;border:1px solid #cddbd6;border-radius:9px;font-family:inherit;font-size:.9rem;background:#fff}
  .tcm-leave-save{background:#2f6b5e;color:#fff;border:0;border-radius:8px;padding:9px 16px;font-family:inherit;font-weight:700;font-size:.86rem;cursor:pointer}
  .tcm-leave-sub{margin-top:10px;display:flex;align-items:center;gap:8px}
  .tcm-leave-sub label{font-size:.82rem;color:#555;white-space:nowrap}
  .tcm-leave-sub input[type=date]{flex:1;padding:8px;border:1px solid #cddbd6;border-radius:9px;font-family:inherit;font-size:.88rem;background:#fff}
</style>

<div class="tcr-wrap">
  <a href="/admin/timecard" class="tcr-back"><span class="material-symbols-outlined" style="font-size:18px">arrow_back</span>当日の打刻に戻る</a>
  <div class="tcr-head">
    <span class="material-symbols-outlined">calendar_month</span>
    <span class="tcr-title">勤怠集計</span>
  </div>
  <div class="tcr-lead">月ごとの職員別労働時間です。打刻漏れの日は黄色で表示され合計には含みません。各日の鉛筆から打刻を修正できます。</div>

  <div class="tcr-monthbar">
    <button id="tcr-prev">‹</button>
    <span class="tcr-month-label" id="tcr-month-label">----年--月</span>
    <button id="tcr-next">›</button>
  </div>

  <div class="tcr-actions">
    <button id="tcr-print"><span class="material-symbols-outlined" style="font-size:18px">print</span>印刷 / PDF</button>
  </div>

  <div id="tcr-body"><div class="tcr-empty">読み込み中…</div></div>
</div>

<!-- 編集モーダル -->
<div class="tcm-back" id="tcm-back">
  <div class="tcm">
    <h3 id="tcm-title">打刻の編集</h3>
    <div class="sub" id="tcm-sub"></div>
    <div id="tcm-rows"></div>
    <div class="tcm-leave"><!-- staff-leave-ui-v1 -->
      <h4>この日の休暇区分</h4>
      <div class="tcm-leave-row">
        <select id="tcm-leave-type">
          <option value="">なし（通常勤務・休暇なし）</option>
          <option value="paid">有給</option>
          <option value="substitute">振替休</option>
          <option value="condolence">忌休</option>
          <option value="absence">欠勤</option>
          <option value="off">休み</option>
          <option value="half">半休</option>
          <option value="hourly">時間休</option>
        </select>
        <button class="tcm-leave-save" id="tcm-leave-save">保存</button>
      </div>
      <div class="tcm-leave-sub" id="tcm-leave-sub-wrap" style="display:none;">
        <label>振替元の日付</label>
        <input type="date" id="tcm-leave-sub-date">
      </div>
    </div>
    <div class="tcm-add">
      <h4>打刻を追加</h4>
      <div class="tcm-add-row">
        <select id="tcm-add-type">
          <option value="in">出勤</option>
          <option value="break_start">休憩開始</option>
          <option value="break_end">休憩終了</option>
          <option value="out">退勤</option>
        </select>
        <input type="time" id="tcm-add-time">
        <button class="add" id="tcm-add-btn">追加</button>
      </div>
    </div>
    <input class="tcm-note" id="tcm-note" placeholder="修正メモ（任意・例：本人申告により修正）">
    <button class="tcm-close" id="tcm-close">閉じる</button>
  </div>
</div>
{% endblock %}

{% block extra_script %}
<script>
(function(){
  "use strict";
  function $(id){ return document.getElementById(id); }
  function esc(t){ return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

  var cur=new Date(), year=cur.getFullYear(), month=cur.getMonth()+1;
  var editing={ staff:null, date:null };

  var PT_LABEL={in:"出勤",out:"退勤",break_start:"休憩開始",break_end:"休憩終了"};

  function fmtHM(min){ if(min==null) return "—"; var h=Math.floor(min/60),m=min%60; return h+"時間"+(m?(" "+m+"分"):""); }
  function fmtTime(iso){ if(!iso) return "--:--"; try{var d=new Date(iso);return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");}catch(e){return "--:--";} }
  function timeVal(iso){ if(!iso) return ""; try{var d=new Date(iso);return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");}catch(e){return "";} }
  function dayLabel(dk){ var p=dk.split("-");var d=new Date(Number(p[0]),Number(p[1])-1,Number(p[2]));var wd=["日","月","火","水","木","金","土"][d.getDay()];return Number(p[2])+"日("+wd+")"; }

  async function load(){
    $("tcr-month-label").textContent=year+"年"+month+"月";
    $("tcr-body").innerHTML='<div class="tcr-empty">読み込み中…</div>';
    try{
      var res=await fetch("/admin/timecard/monthly?year="+year+"&month="+month);
      var j=await res.json();
      if(j.status!=="success"){ $("tcr-body").innerHTML='<div class="tcr-empty">'+esc(j.message||"取得失敗")+'</div>'; return; }
      render(j);
    }catch(e){ $("tcr-body").innerHTML='<div class="tcr-empty">通信エラー</div>'; }
  }

  function render(j){
    var staff=j.staff||[];
    if(!staff.some(function(s){return s.days.length>0;})){ $("tcr-body").innerHTML='<div class="tcr-empty">この月の打刻記録はありません。</div>'; return; }
    var grandMin=0,grandInc=0;
    staff.forEach(function(s){ grandMin+=s.total_minutes; grandInc+=s.incomplete_days; });
    var html='<div class="tcr-summary">施設合計：<b>'+fmtHM(grandMin)+'</b>'+(grandInc?'　／　要確認の日 <b>'+grandInc+'</b>日':'')+'</div>';
    staff.forEach(function(s){
      if(!s.days.length) return;
      var warn=s.incomplete_days>0?'<span class="tcr-warn-dot"></span>':'';
      html+='<div class="tcr-staff tcr-collapsed"><div class="tcr-staff-head" data-toggle>'
        +'<span class="emoji">'+(s.emoji||"👤")+'</span><span class="nm">'+esc(s.name)+warn+'</span>'
        +'<span class="tot">'+fmtHM(s.total_minutes)+'<span class="sub">'+s.worked_days+'日勤務'+(s.incomplete_days?'・要確認'+s.incomplete_days+'日':'')+'</span></span></div><div class="tcr-days">';
      s.days.forEach(function(d){
        var editBtn='<button class="tcr-edit" data-edit data-staff="'+esc(s.name)+'" data-date="'+d.date+'"><span class="material-symbols-outlined">edit</span></button>';
        if(d.incomplete){
          html+='<div class="tcr-day bad"><span class="d">'+dayLabel(d.date)+'</span>'
            +'<span class="io">'+fmtTime(d.in)+'→'+fmtTime(d.out)+'</span>'
            +'<span class="tcr-flag">⚠ '+esc((d.flags||[]).join("／"))+'</span>'+editBtn+'</div>';
        }else{
          var brk=d.break_min?'（休憩'+d.break_min+'分）':'';
          html+='<div class="tcr-day"><span class="d">'+dayLabel(d.date)+'</span>'
            +'<span class="io">'+fmtTime(d.in)+'→'+fmtTime(d.out)+' '+brk+'</span>'
            +'<span class="hrs">'+fmtHM(d.minutes)+'</span>'+editBtn+'</div>';
        }
      });
      html+='</div></div>';
    });
    $("tcr-body").innerHTML=html;
    document.querySelectorAll("[data-toggle]").forEach(function(h){
      h.addEventListener("click",function(e){ if(e.target.closest("[data-edit]")) return; h.closest(".tcr-staff").classList.toggle("tcr-collapsed"); });
    });
    document.querySelectorAll("[data-edit]").forEach(function(b){
      b.addEventListener("click",function(e){ e.stopPropagation(); openEdit(b.getAttribute("data-staff"), b.getAttribute("data-date")); });
    });
  }

  async function openEdit(staff, date){
    editing.staff=staff; editing.date=date;
    $("tcm-title").textContent=staff+" さんの打刻";
    $("tcm-sub").textContent=date+" の記録を修正できます";
    $("tcm-note").value="";
    $("tcm-rows").innerHTML='<div class="tcm-empty">読み込み中…</div>';
    $("tcm-back").classList.add("show");
    await loadDay();
    await loadLeave();  // staff-leave-ui-v1
  }

  // staff-leave-ui-v1: この日の休暇区分を読み込んでプルダウンに反映
  async function loadLeave(){
    var sel=$("tcm-leave-type"), subWrap=$("tcm-leave-sub-wrap"), subDate=$("tcm-leave-sub-date");
    if(!sel) return;
    sel.value=""; subDate.value=""; subWrap.style.display="none";
    try{
      var d=new Date(editing.date);
      var y=d.getFullYear(), m=d.getMonth()+1;
      var res=await fetch("/admin/timecard/leave/list?year="+y+"&month="+m);
      var j=await res.json();
      if(j.status==="success"){
        var hit=(j.leaves||[]).find(function(x){ return x.staff_name===editing.staff && x.leave_date===editing.date; });
        if(hit){
          sel.value=hit.leave_type||"";
          if(hit.leave_type==="substitute"){ subWrap.style.display="flex"; if(hit.substitute_for) subDate.value=hit.substitute_for; }
        }
      }
    }catch(e){ /* 取得失敗は静かに無視(なし扱い) */ }
  }

  async function loadDay(){
    try{
      var res=await fetch("/admin/timecard/day?staff_name="+encodeURIComponent(editing.staff)+"&date="+editing.date);
      var j=await res.json();
      if(j.status!=="success"){ $("tcm-rows").innerHTML='<div class="tcm-empty">'+esc(j.message||"取得失敗")+'</div>'; return; }
      var ps=j.punches||[];
      if(!ps.length){ $("tcm-rows").innerHTML='<div class="tcm-empty">この日の打刻はありません。下から追加できます。</div>'; return; }
      $("tcm-rows").innerHTML=ps.map(function(p){
        return '<div class="tcm-row"><span class="pt">'+PT_LABEL[p.type]+'</span>'
          +'<input type="time" value="'+timeVal(p.at)+'" data-id="'+p.id+'">'
          +'<button class="save" data-save data-id="'+p.id+'">保存</button>'
          +'<button class="del" data-del data-id="'+p.id+'"><span class="material-symbols-outlined">delete</span></button></div>';
      }).join("");
      $("tcm-rows").querySelectorAll("[data-save]").forEach(function(b){
        b.addEventListener("click",function(){ var id=b.getAttribute("data-id"); var inp=$("tcm-rows").querySelector('input[data-id="'+id+'"]'); saveEdit(id, inp.value); });
      });
      $("tcm-rows").querySelectorAll("[data-del]").forEach(function(b){
        b.addEventListener("click",function(){ delPunch(b.getAttribute("data-id")); });
      });
    }catch(e){ $("tcm-rows").innerHTML='<div class="tcm-empty">通信エラー</div>'; }
  }

  async function saveEdit(id, time){
    if(!time){ alert("時刻を入力してください"); return; }
    try{
      var res=await fetch("/admin/timecard/edit",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({id:Number(id), date:editing.date, time:time, note:$("tcm-note").value.trim()})});
      var j=await res.json();
      if(j.status==="success"){ await loadDay(); load(); }
      else alert(j.message||"保存できませんでした");
    }catch(e){ alert("通信エラー"); }
  }

  async function delPunch(id){
    if(!confirm("この打刻を削除しますか？")) return;
    try{
      var res=await fetch("/admin/timecard/delete",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({id:Number(id), note:$("tcm-note").value.trim()})});
      var j=await res.json();
      if(j.status==="success"){ await loadDay(); load(); }
      else alert(j.message||"削除できませんでした");
    }catch(e){ alert("通信エラー"); }
  }

  async function addPunch(){
    var type=$("tcm-add-type").value, time=$("tcm-add-time").value;
    if(!time){ alert("時刻を入力してください"); return; }
    try{
      var res=await fetch("/admin/timecard/add",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({staff_name:editing.staff, punch_type:type, date:editing.date, time:time, note:$("tcm-note").value.trim()})});
      var j=await res.json();
      if(j.status==="success"){ $("tcm-add-time").value=""; await loadDay(); load(); }
      else alert(j.message||"追加できませんでした");
    }catch(e){ alert("通信エラー"); }
  }

  $("tcr-prev").addEventListener("click",function(){ month--; if(month<1){month=12;year--;} load(); });
  $("tcr-next").addEventListener("click",function(){ month++; if(month>12){month=1;year++;} load(); });
  $("tcr-print").addEventListener("click",function(){ window.print(); });
  $("tcm-add-btn").addEventListener("click", addPunch);
  $("tcm-close").addEventListener("click",function(){ $("tcm-back").classList.remove("show"); });
  // staff-leave-ui-v1: 振替休を選んだら振替元日付欄を表示
  $("tcm-leave-type").addEventListener("change",function(){
    $("tcm-leave-sub-wrap").style.display = (this.value==="substitute") ? "flex" : "none";
  });
  // staff-leave-ui-v1: 休暇の保存(なし=削除、区分あり=登録/更新)
  $("tcm-leave-save").addEventListener("click",async function(){
    var t=$("tcm-leave-type").value;
    var btn=this; btn.disabled=true; var old=btn.textContent; btn.textContent="保存中…";
    try{
      if(!t){
        await fetch("/admin/timecard/leave/delete",{method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({staff_name:editing.staff, leave_date:editing.date})});
      }else{
        var body={staff_name:editing.staff, leave_date:editing.date, leave_type:t};
        if(t==="substitute"){ body.substitute_for=$("tcm-leave-sub-date").value||""; }
        await fetch("/admin/timecard/leave/set",{method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify(body)});
      }
      btn.textContent="保存しました";
      if(typeof load==="function"){ load(); }  // 月次を再読込(あれば)
      setTimeout(function(){ btn.textContent=old; btn.disabled=false; },1200);
    }catch(e){ btn.textContent="失敗"; setTimeout(function(){ btn.textContent=old; btn.disabled=false; },1200); }
  });
  $("tcm-back").addEventListener("click",function(e){ if(e.target===$("tcm-back")) $("tcm-back").classList.remove("show"); });

  load();
})();
</script>
{% endblock %}
