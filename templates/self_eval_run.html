<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>ご本人へのおたずね - TASUKARU</title>
<!--
  self-eval-v1 : 利用者が答える画面（キオスク）
  ★base.html を継承しない。下メニューもハンバーガーも出さないため。
  ★ここから他の画面へは行けない。サーバ側の _kiosk_guard() が全リクエストを止めている。
    画面側の細工（戻る封じ等）は補助にすぎない。ガードを消さないこと。
  UIの決まりは README の self-eval-design-2026-08-20 の「7.」を参照。
    ・10段階を直接出さない（3択 → その中で3〜4択）
    ・絵文字を使わない。達成度は円の塗りで表す
    ・ひらがなだらけにしない。1画面1問。選んだだけでは進まない
-->
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* ★画面そのものはスクロールさせない（self-eval-fit-v1）。
   body を「中央ぞろえ」にしたまま中身が縦にはみ出すと、はみ出した【上側】に
   どうやっても戻れなくなる（実機で発生：質問文が切れたまま下にも戻せない）。
   スクロールするのは .body の中だけにして、上の名前・進捗と下のボタンは必ず見えるようにする。 */
html,body{margin:0;height:100%;overflow:hidden}
/* ★スマホの時計や電波表示（セーフエリア）と重ならないように余白をとる。
   これが無いと画面の一番上が隠れてしまう。 */
body{background:#f4f5f7;color:#1f2933;
 font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
 display:flex;align-items:center;justify-content:center;
 padding:calc(18px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right))
         calc(18px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));
 -webkit-user-select:none;user-select:none}
.tab{width:100%;max-width:900px;background:#fff;border-radius:14px;
 box-shadow:0 4px 24px rgba(31,41,51,.10);overflow:hidden;display:flex;flex-direction:column;
 min-height:min(640px,100%);max-height:100%}
.bar{display:flex;align-items:baseline;gap:14px;padding:16px 26px 12px}
.who{font-size:1.15rem;font-weight:800;letter-spacing:.02em}
.who span{font-size:.9rem;font-weight:600;color:#7b8794;margin-left:6px}
.prog{margin-left:auto;font-size:1rem;font-weight:800;color:#52606d;font-variant-numeric:tabular-nums}
.progbar{height:5px;background:#e4e7eb;margin:0 26px;border-radius:99px;overflow:hidden}
.progbar i{display:block;height:100%;background:#1b4965;transition:width .35s}
.body{flex:1;padding:26px 32px 22px;display:flex;flex-direction:column;overflow-y:auto}
.foot{padding:16px 26px 22px;display:flex;gap:16px;align-items:center;border-top:1px solid #e4e7eb}
.kicker{font-size:.92rem;font-weight:800;color:#1b4965;letter-spacing:.09em;margin-bottom:12px;
 padding-left:11px;border-left:3px solid #1b4965;line-height:1.3}
.q{font-size:1.95rem;font-weight:800;line-height:1.55;margin:0 0 8px;letter-spacing:.01em}
.qsub{font-size:1.05rem;color:#616e7c;margin:0 0 20px;line-height:1.65}
.readbtn{display:inline-flex;align-items:center;gap:11px;padding:13px 24px;border-radius:8px;
 border:2px solid #b6c0cb;background:#fff;color:#3e4c59;font-size:1.08rem;font-weight:800;
 cursor:pointer;margin-bottom:24px;align-self:flex-start;font-family:inherit}
.readbtn.on{border-color:#1b4965;color:#1b4965;background:#eef3f7}
.c3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.c3 button{padding:26px 12px 24px;border-radius:12px;border:2px solid #d3d9df;background:#fff;
 font-size:1.32rem;font-weight:800;cursor:pointer;line-height:1.4;color:#1f2933;
 display:flex;flex-direction:column;align-items:center;gap:14px;font-family:inherit}
.c3 button.sel{border-color:#1b4965;border-width:3px;background:#eef3f7;box-shadow:inset 0 0 0 1px #1b4965}
.c3 .cap{font-size:.86rem;font-weight:700;color:#7b8794}
.c3 button.sel .cap{color:#1b4965}
/* ★「どのくらいでしたか」を出すときは、3択を1行にたたむ（self-eval-fit-v1）。
   3択と10段階を同時に出すと縦に長くなりすぎて、質問文が画面の外へ出てしまう。 */
.c3pick{display:none;align-items:center;gap:14px;padding:16px 18px;border:2px solid #1b4965;
 border-radius:12px;background:#eef3f7}
.c3pick .tx{font-size:1.25rem;font-weight:800;color:#1b4965}
.c3pick button{margin-left:auto;padding:11px 16px;border-radius:8px;border:2px solid #b6c0cb;
 background:#fff;color:#3e4c59;font-size:1rem;font-weight:800;cursor:pointer;font-family:inherit}
.step2{margin-top:26px;padding-top:22px;border-top:1px solid #e4e7eb;display:none}
.step2.on{display:block;animation:fade .22s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.step2 h3{font-size:1.2rem;font-weight:800;margin:0 0 14px;color:#3e4c59}
.lv{display:grid;gap:10px}
.lv button{padding:18px 20px;border-radius:10px;border:2px solid #d3d9df;background:#fff;
 font-size:1.22rem;font-weight:700;text-align:left;cursor:pointer;display:flex;align-items:center;
 gap:18px;color:#1f2933;font-family:inherit}
.lv button.sel{border-color:#1b4965;border-width:3px;background:#eef3f7}
.lv .num{flex:0 0 46px;height:46px;border-radius:6px;background:#eef1f4;color:#52606d;
 display:flex;align-items:center;justify-content:center;font-size:1.25rem;font-weight:800}
.lv button.sel .num{background:#1b4965;color:#fff}
.why{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:6px}
.why button{padding:30px 16px;border-radius:12px;border:2px solid #d3d9df;background:#fff;
 font-size:1.24rem;font-weight:800;cursor:pointer;line-height:1.4;color:#1f2933;
 display:flex;flex-direction:column;align-items:center;gap:16px;font-family:inherit}
.skip{margin-top:18px;width:100%;padding:17px;border-radius:10px;border:2px solid #d3d9df;
 background:#fafbfc;color:#616e7c;font-size:1.08rem;font-weight:800;cursor:pointer;font-family:inherit}
textarea{width:100%;min-height:150px;font-size:1.3rem;padding:16px;border:2px solid #d3d9df;
 border-radius:10px;font-family:inherit;line-height:1.7;color:#1f2933;-webkit-user-select:text;user-select:text}
textarea:focus{outline:none;border-color:#1b4965}
/* ===== self-eval-pen-v1 : ペンで書く欄 =====
   ★利用者はフリック入力ができない。紙に書くのと同じように書いてもらう。
     罫線は下地(.penwrap)に描き、canvasは透明にして線だけを持つ。
     touch-action:none がないと、指で書いたときに画面ごとスクロールしてしまう。 */
.penwrap{position:relative;flex:1;min-height:260px;margin-top:4px;border:2px solid #d3d9df;
 border-radius:10px;background-color:#fff;background-image:repeating-linear-gradient(
   to bottom, transparent 0, transparent 61px, #eceff2 61px, #eceff2 62px);
 overflow:hidden}
#pad{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;
 -webkit-user-select:none;user-select:none}
.penhint{position:absolute;left:0;right:0;top:22px;text-align:center;font-size:1.12rem;
 color:#a6b0bb;font-weight:700;pointer-events:none}
.pentools{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.pentools button{padding:14px 18px;border-radius:9px;border:2px solid #d3d9df;background:#fff;
 color:#3e4c59;font-size:1.05rem;font-weight:800;cursor:pointer;font-family:inherit}
.pentools button.kb{margin-left:auto;background:#fafbfc;color:#616e7c}

/* ★手書きのときは【書く面をできるだけ広く】する（self-eval-pen-v2）。
   ペンで書くには面積がいる。字が小さくなると本人も職員も読めない。
   この画面のあいだだけ、まわりの余白と見出しを詰めて紙を広げる。
   （body に .writing が付く。goWrite() で付け、他の画面に移ると外す） */
body.writing{padding:calc(4px + env(safe-area-inset-top)) calc(4px + env(safe-area-inset-right))
                     calc(4px + env(safe-area-inset-bottom)) calc(4px + env(safe-area-inset-left))}
body.writing .tab{border-radius:8px;max-width:100%;min-height:100%}
body.writing .bar{padding:8px 16px 3px}
body.writing .progbar{margin:0 16px}
body.writing #screen-write{padding:10px 14px 8px}
body.writing #screen-write .kicker{display:none}
body.writing #screen-write .q{font-size:1.06rem;line-height:1.5;margin:0 0 7px}
body.writing .penwrap{min-height:0}       /* 使えるぶんだけ全部つかう */
body.writing .pentools{margin-top:8px}
body.writing .pentools button{padding:12px 15px}
body.writing .foot{padding:9px 14px calc(9px + env(safe-area-inset-bottom))}
body.writing .nav{padding:13px 18px}
.rec{display:flex;flex-direction:column;align-items:center;gap:18px;padding:22px 0}
.recbtn{width:130px;height:130px;border-radius:50%;border:3px solid #8f3b34;background:#a34a41;color:#fff;
 font-size:1.02rem;font-weight:800;cursor:pointer;display:flex;flex-direction:column;
 align-items:center;justify-content:center;gap:8px;font-family:inherit}
.recbtn.on{animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(163,74,65,.35)}50%{box-shadow:0 0 0 14px rgba(163,74,65,0)}}
.rectxt{font-size:1.08rem;color:#616e7c;font-weight:700;text-align:center;line-height:1.6}
.nav{padding:17px 30px;border-radius:9px;font-size:1.18rem;font-weight:800;cursor:pointer;
 border:2px solid transparent;font-family:inherit;letter-spacing:.03em}
.back{background:#fff;border-color:#b6c0cb;color:#3e4c59}
.next{margin-left:auto;background:#1b4965;color:#fff;min-width:200px}
.next:disabled{background:#e4e7eb;color:#9aa5b1;cursor:default}
.help{font-size:1rem;color:#7b8794;font-weight:700}
.loading{flex:1;display:flex;align-items:center;justify-content:center;font-size:1.2rem;color:#7b8794}

/* ★スマホ（縦持ち）でのはみ出し対策。
   案内文が縦書きのように潰れ、「次へ」が画面の外に出ていた。 */
@media (max-width: 700px){
  .help{display:none}                    /* 案内文は消す。ボタンの状態で分かる */
  .foot{gap:10px;padding:14px 16px 18px}
  .nav{padding:15px 16px;font-size:1.05rem;letter-spacing:0}
  .next{min-width:0;flex:1}
  .back{flex:0 0 auto}
  .body{padding:20px 18px 18px}
  .bar{padding:14px 18px 10px}
  .progbar{margin:0 18px}
  .q{font-size:1.5rem}
  .c3{gap:9px}
  .c3 button{padding:18px 6px 16px;font-size:1.02rem;gap:10px}
  .c3 button svg{width:42px;height:42px}
  .why{gap:11px}
  .why button{padding:22px 10px;font-size:1.08rem}
  .penwrap{min-height:150px}
  .pentools button{padding:12px 12px;font-size:.98rem}
}
</style></head>
<body>
<div class="tab">
  <div class="bar">
    <span class="who">{{ user_name }}<span>さん</span></span>
    <span class="prog" id="prog"></span>
  </div>
  <div class="progbar"><i id="pbar" style="width:0%"></i></div>

  <div class="body" id="screen-load"><div class="loading">読み込んでいます…</div></div>

  <div class="body" id="screen-q" style="display:none">
    <div class="kicker" id="kicker">おたずね</div>
    <p class="q" id="qtext"></p>
    <p class="qsub">この1か月をふりかえって、近いものを お選びください。</p>
    <button class="readbtn" id="readbtn" onclick="speak()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
      読み上げる
    </button>
    <!-- ★選択肢の文言は goal_kind によって変わる（render() で書き換える）。
         「満足していますか」に「できなかった」では答えにならないため。 -->
    <div class="c3" id="c3wrap">
      <button onclick="pick('no',this)">
        <svg width="52" height="52" viewBox="0 0 52 52"><circle cx="26" cy="26" r="21" fill="none" stroke="#6b7b8c" stroke-width="3"/></svg>
        <span class="lbl" id="c3-no">できなかった</span><span class="cap" id="cap-no">0 〜 3</span>
      </button>
      <button onclick="pick('mid',this)">
        <svg width="52" height="52" viewBox="0 0 52 52"><circle cx="26" cy="26" r="21" fill="none" stroke="#b08040" stroke-width="3"/><path d="M26 5 A21 21 0 0 1 26 47 Z" fill="#b08040"/></svg>
        <span class="lbl" id="c3-mid">少し できた</span><span class="cap" id="cap-mid">4 〜 7</span>
      </button>
      <button onclick="pick('ok',this)">
        <svg width="52" height="52" viewBox="0 0 52 52"><circle cx="26" cy="26" r="21" fill="#3f6f52"/></svg>
        <span class="lbl" id="c3-ok">できた</span><span class="cap" id="cap-ok">8 〜 10</span>
      </button>
    </div>
    <!-- 3択を選んだあとに出る「たたんだ表示」。選び直しもここから -->
    <div class="c3pick" id="c3pick">
      <span id="c3pick-mk"></span>
      <span class="tx" id="c3pick-tx"></span>
      <button type="button" onclick="unpick()">選び直す</button>
    </div>
    <div class="step2" id="step2">
      <h3>その中では どのくらいでしたか</h3>
      <div class="lv" id="lv"></div>
    </div>
  </div>

  <div class="body" id="screen-why" style="display:none">
    <div class="kicker">続けて お聞きします</div>
    <p class="q" id="whyq"></p>
    <p class="qsub">お答えになりたくないときは、とばせます。</p>
    <div class="why">
      <button onclick="goWrite()">
        <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#3e4c59" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        自分で書く
      </button>
      <button onclick="goVoice()">
        <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#3e4c59" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
        声で話す
      </button>
    </div>
    <button class="skip" onclick="saveAndNext('skip')">とばして 次へ　（あとで職員がお聞きします）</button>
  </div>

  <div class="body" id="screen-write" style="display:none">
    <div class="kicker">お書きください</div>
    <p class="q" style="font-size:1.35rem;margin-bottom:10px">理由を お書きください</p>
    <div class="penwrap" id="penwrap">
      <canvas id="pad"></canvas>
      <div class="penhint" id="penhint">ここに ペンや 指で お書きください</div>
    </div>
    <div class="pentools">
      <button type="button" onclick="padUndo()">ひとつ もどす</button>
      <button type="button" onclick="padClear()">ぜんぶ 消す</button>
      <button type="button" class="kb" id="kbbtn" onclick="padToggleKb()">キーボードで 入力</button>
    </div>
    <textarea id="wtext" placeholder="ここに お書きください" style="display:none;margin-top:12px"></textarea>
  </div>

  <div class="body" id="screen-voice" style="display:none">
    <div class="kicker">お話しください</div>
    <p class="q" style="font-size:1.45rem;margin-bottom:0">理由を お話しください</p>
    <div class="rec">
      <button class="recbtn" id="recbtn" onclick="toggleRec()">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
        <span id="reclabel">押して 話す</span>
      </button>
      <div class="rectxt" id="rectxt">ボタンを押してから お話しください</div>
    </div>
  </div>

  <div class="foot" id="foot" style="display:none">
    <button class="nav back" onclick="back()">◀　もどる</button>
    <span class="help" id="helptxt">お選びになると「次へ」が押せます</span>
    <button class="nav next" id="nextbtn" onclick="next()" disabled>次へ　▶</button>
  </div>
</div>

<script>
/* self-eval-v1
   ★ブラウザの「戻る」で評価画面から出られないようにする（第2層の一部）。
     本命はサーバ側の _kiosk_guard()。これは補助。 */
history.pushState(null, '', location.href);
window.addEventListener('popstate', function(){ history.pushState(null, '', location.href); });

var LEVELS = {
  no:  [{n:0,t:'まったく できなかった'},{n:1,t:'ほとんど できなかった'},{n:2,t:'できた日が 少しあった'},{n:3,t:'ときどき できた'}],
  mid: [{n:4,t:'半分くらいの日は できた'},{n:5,t:'半分より 少し多く できた'},{n:6,t:'たいてい できた'},{n:7,t:'ほとんどの日 できた'}],
  ok:  [{n:8,t:'ほぼ毎日 できた'},{n:9,t:'毎日 できた'},{n:10,t:'余裕をもって できた'}]
};
/* ★質問の種類ごとに、3つの選択肢の言い方を変える。
   「満足していますか」に「できなかった」では答えにならない。
   deep=false のものは、そのあとの「どのくらい？」を出さない（3段階で十分。
   既存の評価も ○△× の3段階なので、これで足りる）。 */
var CHOICE_SETS = {
  '':       {no:'できなかった',   mid:'少し できた',        ok:'できた',        deep:true,  sub:'この1か月をふりかえって、近いものを お選びください。'},
  change:   {no:'変わらない',     mid:'少し 楽になった',    ok:'楽になった',    deep:false, sub:'この1か月をふりかえって、近いものを お選びください。'},
  satisfy:  {no:'満足していない', mid:'どちらとも いえない', ok:'満足している',  deep:false, sub:'いまのお気持ちに 近いものを お選びください。'},
  fit:      {no:'合っていない',   mid:'どちらとも いえない', ok:'合っている',    deep:false, sub:'いまのお気持ちに 近いものを お選びください。'}
};
function choiceSet(){ return CHOICE_SETS[(QS[i]||{}).goal_kind || ''] || CHOICE_SETS['']; }
var QS=[], i=0, choice=null, level=null, phase='q';

function show(id){
  ['screen-load','screen-q','screen-why','screen-write','screen-voice'].forEach(function(s){
    document.getElementById(s).style.display = (s===id)?'flex':'none';
  });
  /* 手書き画面いがいでは、詰めた余白をもとに戻す（self-eval-pen-v2） */
  if(id!=='screen-write') document.body.classList.remove('writing');
  document.getElementById('foot').style.display = (id==='screen-load')?'none':'flex';
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

async function load(){
  try{
    var j = await fetch('/api/self-eval/questions',{credentials:'same-origin'}).then(function(r){return r.json();});
    if(j.status!=='success' || !(j.questions||[]).length){
      document.getElementById('screen-load').innerHTML='<div class="loading">質問がありません。職員にお知らせください。</div>';
      return;
    }
    QS = j.questions;
    /* 途中で中断していたら、まだ答えていない最初の質問から再開する */
    var k = QS.findIndex(function(q){ return q.score===null || q.score===undefined; });
    i = (k<0) ? 0 : k;
    render();
  }catch(e){
    document.getElementById('screen-load').innerHTML='<div class="loading">読み込めませんでした。職員にお知らせください。</div>';
  }
}
function isFree(){ return (QS[i]||{}).goal_kind === 'free'; }
function render(){
  phase='q'; choice=null; level=null;
  document.getElementById('prog').textContent = (i+1)+' / '+QS.length;
  document.getElementById('pbar').style.width = ((i+1)/QS.length*100)+'%';
  document.getElementById('wtext').value = '';
  padReset();                                  /* self-eval-pen-v1: 前の問の手書きを持ち越さない */
  /* ★質問の種類に合わせて、選択肢の言い方と補足文を差し替える */
  var cs = choiceSet();
  document.getElementById('c3-no').textContent  = cs.no;
  document.getElementById('c3-mid').textContent = cs.mid;
  document.getElementById('c3-ok').textContent  = cs.ok;
  ['no','mid','ok'].forEach(function(k, n){
    var el = document.getElementById('cap-'+k);
    el.style.display = cs.deep ? '' : 'none';   /* 0〜3 などの数字は深掘りするときだけ出す */
  });
  document.querySelector('#screen-q .qsub').textContent = cs.sub;
  /* ★goal_kind='free' の質問（例：これからしてみたいこと）は達成度で答えられない。
     3択を出さず、そのまま「書く／話す／とばす」を出す。 */
  if(isFree()){
    phase='why';
    show('screen-why');
    document.getElementById('whyq').textContent = QS[i].question || '';
    document.querySelector('#screen-why .kicker').textContent = 'さいごに おたずねします';
    document.getElementById('nextbtn').disabled = true;
    document.getElementById('helptxt').textContent = 'お選びください';
    return;
  }
  document.querySelector('#screen-why .kicker').textContent = '続けて お聞きします';
  show('screen-q');
  document.getElementById('qtext').textContent = QS[i].question || '';
  document.querySelectorAll('.c3 button').forEach(function(b){ b.classList.remove('sel'); });
  document.getElementById('step2').classList.remove('on');
  unfold();                                   /* たたんだ3択をもとに戻す */
  document.getElementById('nextbtn').disabled = true;
  document.getElementById('helptxt').textContent = 'お選びになると「次へ」が押せます';
  document.getElementById('readbtn').classList.remove('on');
  document.getElementById('screen-q').scrollTop = 0;
}
/* 3択の「たたむ／もどす」（self-eval-fit-v1） */
function fold(kind){
  var cs = choiceSet();
  var mk = {no:'<svg width="34" height="34" viewBox="0 0 52 52"><circle cx="26" cy="26" r="21" fill="none" stroke="#6b7b8c" stroke-width="4"/></svg>',
            mid:'<svg width="34" height="34" viewBox="0 0 52 52"><circle cx="26" cy="26" r="21" fill="none" stroke="#b08040" stroke-width="4"/><path d="M26 5 A21 21 0 0 1 26 47 Z" fill="#b08040"/></svg>',
            ok:'<svg width="34" height="34" viewBox="0 0 52 52"><circle cx="26" cy="26" r="21" fill="#3f6f52"/></svg>'};
  document.getElementById('c3wrap').style.display = 'none';
  document.getElementById('c3pick-mk').innerHTML = mk[kind] || '';
  document.getElementById('c3pick-tx').textContent = cs[kind] || '';
  document.getElementById('c3pick').style.display = 'flex';
}
function unfold(){
  document.getElementById('c3wrap').style.display = '';
  document.getElementById('c3pick').style.display = 'none';
}
function unpick(){
  choice = null; level = null;
  unfold();
  document.querySelectorAll('.c3 button').forEach(function(b){ b.classList.remove('sel'); });
  document.getElementById('step2').classList.remove('on');
  document.getElementById('nextbtn').disabled = true;
  document.getElementById('helptxt').textContent = 'お選びになると「次へ」が押せます';
  document.getElementById('screen-q').scrollTop = 0;
}
function pick(kind, el){
  choice = kind; level = null;
  document.querySelectorAll('.c3 button').forEach(function(b){ b.classList.remove('sel'); });
  el.classList.add('sel');
  /* ★満足度などは3段階で十分なので「どのくらい？」を出さない。
     点数は 2 / 5 / 9 を当てる（○△×に直したとき ×/△/○ になる値）。 */
  if(!choiceSet().deep){
    level = (kind==='ok') ? 9 : (kind==='mid' ? 5 : 2);
    document.getElementById('step2').classList.remove('on');
    document.getElementById('nextbtn').disabled = false;
    document.getElementById('helptxt').textContent = '「次へ」を押してください';
    return;
  }
  document.getElementById('lv').innerHTML = LEVELS[kind].map(function(x){
    return '<button onclick="pickLv('+x.n+',this)"><span class="num">'+x.n+'</span>'+x.t+'</button>';
  }).join('');
  fold(kind);                    /* ★3択をたたむ。質問文を画面から追い出さないため */
  document.getElementById('step2').classList.add('on');
  document.getElementById('nextbtn').disabled = true;
  document.getElementById('helptxt').textContent = 'どのくらいか お選びください';
  document.getElementById('screen-q').scrollTop = 0;
}
function pickLv(n, el){
  level = n;
  document.querySelectorAll('#lv button').forEach(function(b){ b.classList.remove('sel'); });
  el.classList.add('sel');
  document.getElementById('nextbtn').disabled = false;
  document.getElementById('helptxt').textContent = '「次へ」を押してください';
}
/* ★1問ごとにサーバへ保存する。途中で電源が切れても回答は残る。 */
async function saveAnswer(mode, text){
  try{
    await fetch('/api/self-eval/answer',{method:'POST',credentials:'same-origin',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({id:QS[i].id, score:level, choice:choice,
                           reason_mode:mode||null, reason_text:text||''})});
    QS[i].score = level;
  }catch(e){ /* 通信が切れても操作は止めない。次に開いたとき続きから */ }
}
async function saveAndNext(mode, text){
  await saveAnswer(mode, text);
  i++;
  if(i>=QS.length){ await finish(); return; }
  render();
}
async function finish(){
  document.getElementById('screen-load').innerHTML='<div class="loading">保存しています…</div>';
  show('screen-load');
  try{
    var j = await fetch('/api/self-eval/finish',{method:'POST',credentials:'same-origin',
      headers:{'Content-Type':'application/json'},body:'{}'}).then(function(r){return r.json();});
    location.href = (j && j.redirect) ? j.redirect : '/self-eval/locked';
  }catch(e){ location.href='/self-eval/locked'; }
}
async function next(){
  if(phase==='q'){
    if(choice==='ok'){ saveAndNext(null,''); return; }   /* できた人に理由は聞かない */
    document.getElementById('whyq').innerHTML = (choice==='no')
      ? 'できなかったのは<br>どうしてだと 思われますか'
      : 'あと少しだったのは<br>どうしてだと 思われますか';
    phase='why'; show('screen-why');
    document.getElementById('nextbtn').disabled = true;
    document.getElementById('helptxt').textContent = 'お選びください';
    return;
  }
  if(phase==='write'){
    /* self-eval-pen-v1: 手書きがあれば先に画像を送る。
       ★失敗しても止めない。手書きは補足で、点数のほうが本体だから。 */
    var img = padExport();
    if(img){
      var nb = document.getElementById('nextbtn');
      nb.disabled = true;
      document.getElementById('helptxt').textContent = '保存しています…';
      try{
        await fetch('/api/self-eval/answer-image',{method:'POST',credentials:'same-origin',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({id:QS[i].id, image:img})});
      }catch(e){ /* 通信が切れても操作は止めない */ }
      nb.disabled = false;
    }
    saveAndNext('write', document.getElementById('wtext').value); return;
  }
  if(phase==='voice'){ saveAndNext('voice', ''); return; }
}
function freeLabel(){ return isFree() ? 'してみたいこと・困っていること' : '理由'; }
function goWrite(){ phase='write'; show('screen-write');
  document.querySelector('#screen-write .q').textContent = freeLabel()+' を お書きください';
  document.getElementById('nextbtn').disabled=false;
  document.getElementById('helptxt').textContent='書き終えたら「次へ」';
  /* ★書く面をできるだけ広くする。まわりの余白と見出しを詰める */
  document.body.classList.add('writing');
  /* ★画面を出してから寸法を測る。display:none のままだと幅も高さも0になる。
     余白を詰めた分の反映を待ってから測るため、2回に分けて呼ぶ */
  setTimeout(padInit, 0);
  setTimeout(padInit, 120); }

/* ===== self-eval-pen-v1 : ペンで書く =====
   ★なぜ手書きか
     利用者はタブレットのキーボード（フリック入力）が使えない。
     文字入力だけにすると「自分で書く」が実質つかえない機能になっていた。
   ★線は「点の並び」で持つ（画面の向きが変わっても描き直せるように）。
     座標はCSSピクセルで持ち、描くときだけ画面の細かさ(dpr)を掛ける。 */
var PAD = {c:null, ctx:null, strokes:[], cur:null, dpr:1, ready:false};

function padStyle(ctx){
  ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.strokeStyle='#16324a'; ctx.lineWidth=3.4;
}
function padInit(){
  var c = document.getElementById('pad');
  var wrap = document.getElementById('penwrap');
  if(!c || !wrap) return;
  var w = wrap.clientWidth, h = wrap.clientHeight;
  if(!w || !h) return;                       /* まだ画面に出ていない */
  var dpr = Math.min(window.devicePixelRatio || 1, 2);   /* 2までで十分。大きすぎると保存が重い */
  c.width = Math.round(w*dpr); c.height = Math.round(h*dpr);
  PAD.c = c; PAD.dpr = dpr; PAD.w = w; PAD.h = h;
  PAD.ctx = c.getContext('2d');
  PAD.ctx.setTransform(dpr,0,0,dpr,0,0);
  padStyle(PAD.ctx);
  if(!PAD.ready){ padBind(c); PAD.ready = true; }
  padRedraw();
}
function padBind(c){
  function pos(e){ var r=c.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; }
  c.addEventListener('pointerdown', function(e){
    e.preventDefault();
    try{ c.setPointerCapture(e.pointerId); }catch(_){}
    PAD.cur = [pos(e)];
    PAD.strokes.push(PAD.cur);
    document.getElementById('penhint').style.display='none';
    /* 点だけ打った場合も見えるように、小さな丸を置く */
    var p=PAD.cur[0], ctx=PAD.ctx;
    ctx.beginPath(); ctx.arc(p.x,p.y,1.7,0,Math.PI*2); ctx.fillStyle='#16324a'; ctx.fill();
  });
  c.addEventListener('pointermove', function(e){
    if(!PAD.cur) return;
    e.preventDefault();
    var p = pos(e), q = PAD.cur[PAD.cur.length-1];
    PAD.cur.push(p);
    var ctx=PAD.ctx;
    ctx.beginPath(); ctx.moveTo(q.x,q.y); ctx.lineTo(p.x,p.y); ctx.stroke();
  });
  ['pointerup','pointercancel','pointerleave'].forEach(function(ev){
    c.addEventListener(ev, function(){ PAD.cur = null; });
  });
}
function padRedraw(){
  var ctx = PAD.ctx; if(!ctx) return;
  ctx.setTransform(PAD.dpr,0,0,PAD.dpr,0,0);
  ctx.clearRect(0,0,PAD.w,PAD.h);
  padStyle(ctx);
  PAD.strokes.forEach(function(s){
    if(!s.length) return;
    if(s.length===1){ ctx.beginPath(); ctx.arc(s[0].x,s[0].y,1.7,0,Math.PI*2);
                      ctx.fillStyle='#16324a'; ctx.fill(); return; }
    ctx.beginPath(); ctx.moveTo(s[0].x,s[0].y);
    for(var k=1;k<s.length;k++) ctx.lineTo(s[k].x,s[k].y);
    ctx.stroke();
  });
  var hint = document.getElementById('penhint');
  if(hint) hint.style.display = PAD.strokes.length ? 'none' : 'block';
}
function padUndo(){ PAD.strokes.pop(); PAD.cur=null; padRedraw(); }
function padClear(){ PAD.strokes=[]; PAD.cur=null; padRedraw(); }
function padReset(){
  PAD.strokes=[]; PAD.cur=null;
  var t=document.getElementById('wtext'); if(t){ t.style.display='none'; }
  var b=document.getElementById('kbbtn'); if(b){ b.textContent='キーボードで 入力'; }
  padRedraw();
}
/* 文字が打てる方のための逃げ道。ふだんは使わない */
function padToggleKb(){
  var t=document.getElementById('wtext'), b=document.getElementById('kbbtn');
  var on = (t.style.display==='none');
  t.style.display = on ? 'block' : 'none';
  b.textContent = on ? 'キーボードを 閉じる' : 'キーボードで 入力';
  setTimeout(padInit, 0);      /* 紙の高さが変わるので測り直す（線は消えない） */
  if(on) t.focus();
}
/* 白い紙の上に線を写して1枚のPNGにする（背景が透明のままだと真っ黒に見える端末がある） */
function padExport(){
  if(!PAD.c || !PAD.strokes.length) return null;
  try{
    var o = document.createElement('canvas');
    o.width = PAD.c.width; o.height = PAD.c.height;
    var x = o.getContext('2d');
    x.fillStyle = '#ffffff'; x.fillRect(0,0,o.width,o.height);
    x.drawImage(PAD.c, 0, 0);
    return o.toDataURL('image/png');
  }catch(e){ return null; }
}
/* 画面の向きが変わったら描き直す（線は消さない） */
window.addEventListener('resize', function(){ if(phase==='write') padInit(); });
function goVoice(){ phase='voice'; show('screen-voice');
  document.querySelector('#screen-voice .q').textContent = freeLabel()+' を お話しください';
  document.getElementById('nextbtn').disabled=false;
  document.getElementById('helptxt').textContent='話し終えたら「次へ」'; }
function back(){
  /* free の質問は3択が無いので、もどるは「前の質問へ」 */
  if(phase!=='q' && !isFree()){
    phase='q'; show('screen-q');
    document.getElementById('nextbtn').disabled = (level===null);
    document.getElementById('helptxt').textContent='「次へ」を押してください'; return;
  }
  if(isFree() && (phase==='write' || phase==='voice')){
    phase='why'; show('screen-why');
    document.getElementById('nextbtn').disabled=true;
    document.getElementById('helptxt').textContent='お選びください'; return;
  }
  if(i>0){ i--; render(); }
}
/* ===== 読み上げ =====
   ★端末に入っている日本語の声の中から、いちばん自然なものを選ぶ。
     何も選ばないと、機械的な声や英語の声で読まれることがある。
     iPhone/iPadなら Kyoko / Otoya、Androidなら Google 日本語 が入っていることが多い。
   ★声の一覧は非同期で用意されるので voiceschanged を待つ必要がある。 */
var JA_VOICE = null;
function pickVoice(){
  try{
    var vs = speechSynthesis.getVoices() || [];
    var ja = vs.filter(function(v){ return (v.lang||'').toLowerCase().indexOf('ja') === 0; });
    if(!ja.length) return null;
    var prefer = ['kyoko','o-ren','otoya','google 日本語','google japanese','japanese'];
    for(var p=0;p<prefer.length;p++){
      for(var k=0;k<ja.length;k++){
        if((ja[k].name||'').toLowerCase().indexOf(prefer[p]) >= 0) return ja[k];
      }
    }
    return ja[0];
  }catch(e){ return null; }
}
JA_VOICE = pickVoice();
if(typeof speechSynthesis !== 'undefined'){
  speechSynthesis.onvoiceschanged = function(){ JA_VOICE = pickVoice(); };
}
/* 読み上げやすい文に整える。記号をそのまま読ませない・区切りで少し間をあける */
function speechText(s){
  return String(s || '')
    .replace(/[「」『』（）()【】]/g, ' ')
    .replace(/[〜~]/g, 'から')
    .replace(/・/g, '、')
    .replace(/\s*\/\s*/g, '、')
    .replace(/、/g, '、 ')
    .replace(/。/g, '。 ')
    .replace(/\s+/g, ' ')
    .trim();
}
/* ブラウザ標準の読み上げ（保険）。サーバの音声が使えないときはこちらになる。 */
function speakLocal(t){
  var b = document.getElementById('readbtn');
  try{
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(t);
    u.lang = 'ja-JP';
    if(JA_VOICE) u.voice = JA_VOICE;
    u.rate = 0.82; u.pitch = 1.0; u.volume = 1.0;
    u.onstart=function(){ b.classList.add('on'); };
    u.onend  =function(){ b.classList.remove('on'); };
    u.onerror=function(){ b.classList.remove('on'); };
    speechSynthesis.speak(u);
  }catch(e){ b.classList.remove('on'); }
}

/* ===== self-eval-tts-v1 : サーバで作った自然な音声で読み上げる =====
   ★サーバ側が失敗したら（APIが未有効・通信不良など）、
     何事もなかったようにブラウザ標準の読み上げに戻す。利用者を待たせない。
   ★一度読んだ音声は端末側でも使い回す（同じ質問を何度も押されても速い）。 */
var TTS_CACHE = {};
var TTS_AUDIO = null;
async function speak(){
  var b = document.getElementById('readbtn');
  var el = (phase==='q') ? document.getElementById('qtext') : document.getElementById('whyq');
  var raw = el ? el.textContent : '';
  var t = speechText(raw);
  if(!t) return;

  try{ speechSynthesis.cancel(); }catch(e){}
  if(TTS_AUDIO){ try{ TTS_AUDIO.pause(); }catch(e){} TTS_AUDIO = null; }
  b.classList.add('on');

  if(TTS_CACHE[t]){ playTts(TTS_CACHE[t]); return; }
  try{
    var r = await fetch('/api/self-eval/tts',{method:'POST',credentials:'same-origin',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({text:t})});
    var ct = r.headers.get('content-type') || '';
    if(!r.ok || ct.indexOf('audio') < 0) throw new Error('tts unavailable');
    var url = URL.createObjectURL(await r.blob());
    TTS_CACHE[t] = url;
    playTts(url);
  }catch(e){
    speakLocal(t);            /* ★ここが保険。サーバが駄目でも読み上げは動く */
  }
}
function playTts(url){
  var b = document.getElementById('readbtn');
  try{
    TTS_AUDIO = new Audio(url);
    TTS_AUDIO.onended = function(){ b.classList.remove('on'); };
    TTS_AUDIO.onerror = function(){ b.classList.remove('on'); };
    TTS_AUDIO.play().catch(function(){ b.classList.remove('on'); });
  }catch(e){ b.classList.remove('on'); }
}
/* 音声は第1段では「録音した」ことだけ記録する。文字起こしは次の段で入れる。 */
var recOn=false;
function toggleRec(){
  recOn=!recOn;
  document.getElementById('recbtn').classList.toggle('on',recOn);
  document.getElementById('reclabel').textContent = recOn ? '話しています' : '押して 話す';
  document.getElementById('rectxt').textContent = recOn
    ? 'お話しください。終わりましたら もう一度 押してください'
    : 'ありがとうございました。「次へ」を押してください';
}

/* ★3分間さわらなければロック画面へ戻す（利用者が席を立った場合の備え） */
var idleTimer=null;
function resetIdle(){
  if(idleTimer) clearTimeout(idleTimer);
  idleTimer = setTimeout(function(){ location.href='/self-eval/locked'; }, 3*60*1000);
}
['click','touchstart','keydown'].forEach(function(ev){
  document.addEventListener(ev, resetIdle, {passive:true});
});
resetIdle();
load();
</script>
