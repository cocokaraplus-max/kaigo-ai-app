<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>タップ診断・取っ手</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+JP:wght@400;500;700&display=swap">

<style>
  :root {
    --ground:      #f2f5f7;
    --surface:     #ffffff;
    --surface-2:   #e8edf1;
    --ink:         #16202b;
    --ink-soft:    #5c6b7a;
    --hair:        #d3dbe2;
    --signal:      #0e7c73;
    --signal-soft: #d9efec;
    --alert:       #b4630f;
    --alert-soft:  #fbeedc;
    --handle:      #2b3440;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:      #10171f;
      --surface:     #18222d;
      --surface-2:   #1f2c39;
      --ink:         #e6edf3;
      --ink-soft:    #93a3b3;
      --hair:        #2c3a48;
      --signal:      #3fbdb0;
      --signal-soft: #14312e;
      --alert:       #e2a35a;
      --alert-soft:  #33240f;
      --handle:      #c3cedb;
    }
  }
  :root[data-theme="dark"] {
    --ground:      #10171f;
    --surface:     #18222d;
    --surface-2:   #1f2c39;
    --ink:         #e6edf3;
    --ink-soft:    #93a3b3;
    --hair:        #2c3a48;
    --signal:      #3fbdb0;
    --signal-soft: #14312e;
    --alert:       #e2a35a;
    --alert-soft:  #33240f;
    --handle:      #c3cedb;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: "IBM Plex Sans JP", system-ui, -apple-system, "Hiragino Kaku Gothic ProN", sans-serif;
    font-size: 15px;
    line-height: 1.7;
    -webkit-text-size-adjust: 100%;
  }

  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 22px 16px 60px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  header h1 {
    font-size: 1.22rem;
    font-weight: 700;
    margin: 0 0 4px;
    letter-spacing: 0.01em;
    text-wrap: balance;
  }
  header p {
    margin: 0;
    color: var(--ink-soft);
    font-size: 0.86rem;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--hair);
    border-radius: 12px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .step {
    display: flex;
    align-items: baseline;
    gap: 9px;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
    text-transform: uppercase;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
  }

  /* ---- 実験台 ---- */
  .stage {
    position: relative;
    height: 168px;
    border-radius: 10px;
    background:
      repeating-linear-gradient(
        90deg, var(--surface-2) 0 1px, transparent 1px 24px),
      repeating-linear-gradient(
        0deg, var(--surface-2) 0 1px, transparent 1px 24px);
    background-color: var(--ground);
    border: 1px solid var(--hair);
    overflow: hidden;
  }
  .stage-label {
    position: absolute; left: 10px; top: 8px;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 0.68rem; color: var(--ink-soft);
    letter-spacing: 0.04em;
  }

  /* 本物と同じ寸法・同じ touch-action */
  .grip {
    position: absolute;
    width: 26px; height: 64px;
    top: 52px;
    border-radius: 14px;
    background: var(--handle);
    color: var(--surface);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 0.72rem;
    user-select: none;
  }
  .grip.a { right: 22px; }
  .grip.b { right: 92px; opacity: 0.55; }
  .grip:active { opacity: 1; }
  .grip-cap {
    position: absolute;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 0.64rem;
    color: var(--ink-soft);
    top: 122px;
    width: 92px;
    text-align: center;
    letter-spacing: 0.02em;
  }
  .grip-cap.a { right: -11px; }
  .grip-cap.b { right: 59px; }

  /* ---- 判定 ---- */
  .verdict {
    border-radius: 10px;
    padding: 13px 14px;
    font-size: 0.92rem;
    font-weight: 500;
    border-left: 3px solid var(--ink-soft);
    background: var(--surface-2);
    line-height: 1.65;
  }
  .verdict.ok    { border-left-color: var(--signal); background: var(--signal-soft); }
  .verdict.bad   { border-left-color: var(--alert);  background: var(--alert-soft); }
  .verdict b { font-weight: 700; }

  /* ---- 記録 ---- */
  .log {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 0.72rem;
    line-height: 1.55;
    font-variant-numeric: tabular-nums;
    background: var(--ground);
    border: 1px solid var(--hair);
    border-radius: 8px;
    padding: 10px;
    max-height: 300px;
    overflow: auto;
    white-space: pre;
    color: var(--ink);
    margin: 0;
  }
  .log:empty::before {
    content: "まだ何も押されていません";
    color: var(--ink-soft);
    white-space: normal;
  }

  .row { display: flex; gap: 9px; flex-wrap: wrap; }
  button {
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 700;
    padding: 10px 15px;
    border-radius: 8px;
    border: 1px solid var(--hair);
    background: var(--surface-2);
    color: var(--ink);
    cursor: pointer;
    flex: 1 1 auto;
    min-width: 118px;
  }
  button.primary { background: var(--signal); border-color: var(--signal); color: #fff; }
  button:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }

  .facts {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 0.72rem;
    color: var(--ink-soft);
    line-height: 1.7;
    margin: 0;
    font-variant-numeric: tabular-nums;
  }

  ol.how { margin: 0; padding-left: 1.3em; font-size: 0.87rem; }
  ol.how li { margin-bottom: 5px; }
  ol.how li::marker { color: var(--signal); font-weight: 700; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>取っ手のタップ診断</h1>
    <p>この端末が、指のタップをどう報告してくるかを記録します。開発者ツールは要りません。</p>
  </header>

  <div class="card">
    <div class="step">手順</div>
    <ol class="how">
      <li><b>濃いほう（A）</b>を、いつもどおり軽く<b>1回タップ</b>してください。</li>
      <li>下の判定と記録を見ます。</li>
      <li>次に<b>薄いほう（B）</b>も1回タップしてください。</li>
      <li>「記録をコピー」を押して、その中身を送ってください。</li>
    </ol>
  </div>

  <div class="card">
    <div class="step">実験台</div>
    <div class="stage">
      <span class="stage-label">1マス = 24px</span>
      <div class="grip a" id="gripA">A</div>
      <div class="grip b" id="gripB">B</div>
      <div class="grip-cap a">A ＝ 本物と同じ</div>
      <div class="grip-cap b">B ＝ 素の判定</div>
    </div>
    <p class="facts" id="facts">端末の情報を読み込み中…</p>
  </div>

  <div class="card">
    <div class="step">判定</div>
    <div class="verdict" id="verdict">まだ押されていません。上の A を1回タップしてください。</div>
  </div>

  <div class="card">
    <div class="step">記録</div>
    <pre class="log" id="log"></pre>
    <div class="row">
      <button class="primary" id="copy">記録をコピー</button>
      <button id="clear">記録を消す</button>
    </div>
  </div>

</div>

<script>
(function () {
  'use strict';

  // ---- 本物の設定に合わせる（base.html の取っ手より） ----
  var LONG_MS  = 400;   // 長押しで「取っ手を動かすモード」に入るまで
  var DRAG_PX  = 12;    // 引き出しモードに入るしきい値（drawer-tap-v1 で 6→12）
  var TAP_PX   = 14;    // これ未満しか動いていなければタップ扱い（drawer-tap-v1）
  var SNAP     = 0.35;  // 開くか閉じるかの割合
  var W        = 280;   // 引き出しの幅の代わり

  var logEl = document.getElementById('log');
  var verEl = document.getElementById('verdict');
  var lines = [];
  var t0 = 0;

  function put(s) {
    lines.push(s);
    logEl.textContent = lines.join('\n');
    logEl.scrollTop = logEl.scrollHeight;
  }
  function ms() { return Math.round(performance.now() - t0); }
  function pad(n, w) { var s = String(n); while (s.length < w) s = ' ' + s; return s; }

  function verdict(kind, html) {
    verEl.className = 'verdict ' + kind;
    verEl.innerHTML = html;
  }

  // ---- 端末の情報 ----
  (function facts() {
    var f = [];
    f.push('画面 ' + window.innerWidth + '×' + window.innerHeight +
           '  倍率 ' + (window.devicePixelRatio || 1));
    f.push('PointerEvent ' + ('PointerEvent' in window ? 'あり' : 'なし') +
           '  maxTouchPoints ' + (navigator.maxTouchPoints || 0));
    f.push('UA ' + navigator.userAgent);
    document.getElementById('facts').textContent = f.join('\n');
  })();

  // ==========================================================
  // A ＝ 本物と同じ作り（pointer捕捉・preventDefault・長押しタイマー）
  // ==========================================================
  (function wireA() {
    var el = document.getElementById('gripA');
    var hx = 0, hy = 0, hid = null, hdrag = false;
    var moveTimer = null, moving = false, maxMove = 0;
    var moveCount = 0, captured = '—';

    el.addEventListener('pointerdown', function (e) {
      t0 = performance.now();
      lines = [];
      logEl.textContent = '';
      hx = e.clientX; hy = e.clientY;
      hdrag = false; moving = false; maxMove = 0; moveCount = 0;
      hid = e.pointerId;

      try { el.setPointerCapture(hid); captured = 'できた'; }
      catch (err) { captured = 'できなかった（' + err.name + '）'; }

      e.preventDefault();

      put('A  ' + pad(ms(), 4) + 'ms  pointerdown   種類=' + e.pointerType +
          '  捕捉=' + captured);

      clearTimeout(moveTimer);
      moveTimer = setTimeout(function () {
        moving = true;
        put('A  ' + pad(ms(), 4) + 'ms  ★長押し成立（取っ手を動かすモードに入った）');
      }, LONG_MS);
    });

    el.addEventListener('pointermove', function (e) {
      if (hid === null || e.pointerId !== hid) return;
      e.preventDefault();
      var dx = e.clientX - hx, dy = e.clientY - hy;
      var d = Math.max(Math.abs(dx), Math.abs(dy));
      if (d > maxMove) maxMove = d;
      moveCount++;
      var inward = -dx, cross = Math.abs(dy);
      if (!hdrag) {
        clearTimeout(moveTimer);
        if (cross > 24 && cross > inward) { return; }
        if (inward < DRAG_PX) { return; }
        hdrag = true;
        put('A  ' + pad(ms(), 4) + 'ms  ★引き出しモードに入った（内向き ' +
            Math.round(inward) + 'px）');
      }
    });

    function up(e, why) {
      if (hid === null) return;
      clearTimeout(moveTimer);
      var dx = (e && e.clientX != null) ? e.clientX - hx : 0;
      var dy = (e && e.clientY != null) ? e.clientY - hy : 0;
      var inward = -dx;
      try { el.releasePointerCapture(hid); } catch (err) {}
      hid = null;

      put('A  ' + pad(ms(), 4) + 'ms  ' + why +
          '   ずれ dx=' + Math.round(dx) + ' dy=' + Math.round(dy) +
          '  最大 ' + Math.round(maxMove) + 'px  move ' + moveCount + '回');

      var res, kind;
      if (moving) {
        res = '開かない（長押しが成立して「取っ手を動かすモード」になっていた）';
        kind = 'bad';
      } else if (!hdrag) {
        res = '開く（タップとして扱われた）';
        kind = 'ok';
      } else if (maxMove < TAP_PX) {
        res = '開く（引き出しモードに入ったが、ほとんど動いていないのでタップ扱い）';
        kind = 'ok';
      } else if (inward / W > SNAP) {
        res = '開く（' + Math.round(inward) + 'px 引いた）';
        kind = 'ok';
      } else {
        res = '開かない（引き出しモードに入ったが ' + Math.round(inward) +
              'px しか引いていない）';
        kind = 'bad';
      }
      put('A  ' + pad(ms(), 4) + 'ms  判定 → ' + res);
      verdict(kind, '<b>A（本物と同じ作り）</b><br>' + res);
    }

    el.addEventListener('pointerup',     function (e) { up(e, 'pointerup    '); });
    el.addEventListener('pointercancel', function (e) { up(e, 'pointercancel'); });
    el.addEventListener('click',   function () { put('A  ' + pad(ms(), 4) + 'ms  click が来た'); });
    el.addEventListener('touchstart', function () { put('A  ' + pad(ms(), 4) + 'ms  touchstart が来た'); }, {passive:true});
    el.addEventListener('touchend',   function () { put('A  ' + pad(ms(), 4) + 'ms  touchend が来た'); }, {passive:true});
    el.addEventListener('lostpointercapture', function () {
      put('A  ' + pad(ms(), 4) + 'ms  ★捕捉が外れた（lostpointercapture）');
    });
  })();

  // ==========================================================
  // B ＝ 素の判定。捕捉も preventDefault も長押しタイマーも無し。
  //      これが効くなら、原因は A の作り込みの側にある。
  // ==========================================================
  (function wireB() {
    var el = document.getElementById('gripB');
    var sx = 0, sy = 0, down = 0;

    el.addEventListener('pointerdown', function (e) {
      t0 = performance.now();
      lines = [];
      logEl.textContent = '';
      sx = e.clientX; sy = e.clientY; down = performance.now();
      put('B  ' + pad(ms(), 4) + 'ms  pointerdown   種類=' + e.pointerType);
    });
    el.addEventListener('pointerup', function (e) {
      var dx = e.clientX - sx, dy = e.clientY - sy;
      var d = Math.round(Math.max(Math.abs(dx), Math.abs(dy)));
      var held = Math.round(performance.now() - down);
      put('B  ' + pad(ms(), 4) + 'ms  pointerup     ずれ ' + d +
          'px  押していた時間 ' + held + 'ms');
      var ok = d < TAP_PX;
      put('B  ' + pad(ms(), 4) + 'ms  判定 → ' + (ok ? '開く' : '開かない（' + d + 'px 動いた）'));
      verdict(ok ? 'ok' : 'bad',
        '<b>B（素の判定）</b><br>' + (ok
          ? '開く。指のずれは ' + d + 'px、押していた時間は ' + held + 'ms でした。'
          : '開かない。指が ' + d + 'px 動いています。'));
    });
    el.addEventListener('click', function () { put('B  ' + pad(ms(), 4) + 'ms  click が来た'); });
  })();

  // ---- 記録の受け渡し ----
  document.getElementById('copy').addEventListener('click', function () {
    var text = document.getElementById('facts').textContent + '\n---\n' + lines.join('\n');
    var btn = this;
    function done(msg) { btn.textContent = msg; setTimeout(function () { btn.textContent = '記録をコピー'; }, 1800); }
    try {
      navigator.clipboard.writeText(text).then(function () { done('コピーしました'); },
                                              function () { fallback(); });
    } catch (e) { fallback(); }
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;left:8px;right:8px;top:8px;height:40vh;z-index:99;font-size:12px;';
      document.body.appendChild(ta);
      ta.select();
      done('選んでコピーしてください');
      setTimeout(function () { ta.remove(); }, 20000);
    }
  });

  document.getElementById('clear').addEventListener('click', function () {
    lines = [];
    logEl.textContent = '';
    verdict('', 'まだ押されていません。上の A を1回タップしてください。');
  });
})();
</script>
</body>
</html>
